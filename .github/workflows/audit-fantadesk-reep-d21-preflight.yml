name: D21 Reep Release and FantaNexus Anchor Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-fantadesk-reep-d21-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Inspect public D1 source structure and Reep official download URLs
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('data/nexus-d1/final-v3/IDENTITY_MASTER.json','utf8'));
          console.log('D1_PUBLIC_SCHEMA',JSON.stringify({root:Array.isArray(j)?'array':typeof j,keys:Object.keys(j).slice(0,30),types:Object.fromEntries(Object.entries(j).slice(0,20).map(([k,v])=>[k,Array.isArray(v)?'array '+v.length:typeof v]))}));
          for(const [k,v] of Object.entries(j).slice(0,20))if(Array.isArray(v)&&v.length)console.log('D1_ARRAY_SAMPLE_SHAPE',k,JSON.stringify({keys:Object.keys(v[0]??{}).slice(0,35),types:Object.fromEntries(Object.entries(v[0]??{}).slice(0,30).map(([k,x])=>[k,Array.isArray(x)?'array':typeof x]))}));
          const u='https://reep.football/data/';
          try{
            const r=await fetch(u,{signal:AbortSignal.timeout(12000),redirect:'follow'});
            const body=await r.text();
            console.log('REEP_HTML',JSON.stringify({status:r.status,url:r.url,bytes:body.length}));
            const urls=[...body.matchAll(/(?:href|src)=["']([^"']+)["']/g)].map(x=>x[1]).filter(x=>/download|\.csv\.gz|manifest|release\.json|latest\.json|checksums/i.test(x)).slice(0,80);
            console.log('REEP_LINKS',JSON.stringify([...new Set(urls)]));
          }catch(e){console.log('REEP_FETCH_ERROR',e?.message??'UNKNOWN')}
          NODE

      - name: Inspect Reep manifest and FantaNexus identity bridge shapes
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('data/nexus-d1/final-v3/IDENTITY_MASTER.json','utf8'));
          for(const prop of ['scopes','subjectRefs','providerAliases']){
            const e=j.persons.flatMap(p=>Array.isArray(p[prop])?p[prop]:[]).find(x=>x&&typeof x==='object');
            console.log('D1_'+prop.toUpperCase()+'_OBJECT_SHAPE',JSON.stringify(e?Object.fromEntries(Object.entries(e).map(([k,v])=>[k,Array.isArray(v)?'array '+v.length:v===null?'null':typeof v])):null));
          }
          console.log('D1_PROVIDER_UNITS',JSON.stringify(j.providerScopedIdentityUnits.reduce((a,x)=>{let p=x.provider??'unknown';a[p]=(a[p]??0)+1;return a},{})));
          const url='https://data.reep.football/releases/2026-10-25.1/objects/a840bd0f-f3bf-420e-97bd-20d52377e67d/manifest.json';
          const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
          const m=await r.json();
          console.log('REEP_MANIFEST_STATUS',r.status,'rootKeys',JSON.stringify(Object.keys(m)));
          for(const [k,v] of Object.entries(m)){
            if(Array.isArray(v))console.log('MANIFEST_ARRAY',k,v.length,JSON.stringify(Object.keys(v[0]??{}).slice(0,20)));
            else if(v&&typeof v==='object')console.log('MANIFEST_OBJECT',k,JSON.stringify(Object.keys(v).slice(0,35)));
          }
          const u='https://reep.football/downloads/csv/bridges';
          const head=await fetch(u,{method:'HEAD',signal:AbortSignal.timeout(15000)});
          console.log('REEP_BRIDGES_HEAD',JSON.stringify({status:head.status,targetHost:new URL(head.url).hostname,size:head.headers.get('content-length'),type:head.headers.get('content-type')}));
          NODE

      - name: Aggregate D1 provider/person link structure without raw identifiers
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('data/nexus-d1/final-v3/IDENTITY_MASTER.json','utf8'));
          const aliases=j.persons.flatMap(p=>p.providerAliases??[]);
          const names=Object.entries(aliases.reduce((a,x)=>{const v=x.provider??'none';a[v]=(a[v]??0)+1;return a},{}));
          console.log('D1_PERSON_ALIAS_PROVIDERS',JSON.stringify(Object.fromEntries(names)));
          const categories=j.persons.reduce((a,p)=>{const v=[...new Set((p.providerAliases??[]).map(x=>x.provider))].sort().join('+')||'NO_ALIASES';a[v]=(a[v]??0)+1;return a},{});
          console.log('D1_PERSON_COMBINATIONS',JSON.stringify(categories));
          const refScopes=j.persons.flatMap(p=>p.subjectRefs??[]).reduce((a,x)=>{const v=x.scope??'NONE';a[v]=(a[v]??0)+1;return a},{});
          console.log('D1_SUBJECTREF_SCOPES',JSON.stringify(refScopes));
          const approved=j.persons.filter(x=>x.globalPersonPromotionGranted===true).length;
          console.log('D1_PERSON_APPROVAL_STATES',JSON.stringify({total:j.persons.length,globalPromotionGranted:approved,notGranted:j.persons.length-approved}));
          NODE

      - name: Inspect official compressed CSV header through Node streaming GET
        run: |
          node --input-type=module <<'NODE'
          for(const name of ['bridges','redirects']){
            const url='https://reep.football/downloads/csv/'+name;
            const res=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(25000)});
            console.log('REEP_CSV_STATUS',name,res.status,new URL(res.url).hostname);
            if(!res.ok)throw Error('REEP_CSV_NOT_ACCESSIBLE');
            if(!res.body)throw Error('REEP_CSV_NO_BODY');
            const stream=res.body.pipeThrough(new DecompressionStream('gzip')).getReader();
            const decoder=new TextDecoder();let str='';
            while(str.split(String.fromCharCode(10)).length<4){
              const x=await stream.read();
              if(x.done)throw Error('REEP_CSV_TRUNCATED');
              str+=decoder.decode(x.value,{stream:true});
              if(str.length>5000000)throw Error('REEP_CSV_LONG_RECORD');
            }
            console.log('REEP_CSV_SCHEMA',name,JSON.stringify(str.split(String.fromCharCode(10))[0].replace(/^\\uFEFF/,'').split(',')));
            console.log('REEP_CSV_ROW_LENGTH',name,str.split(String.fromCharCode(10))[1].split(',').length);
            await stream.cancel();
          }
          NODE
