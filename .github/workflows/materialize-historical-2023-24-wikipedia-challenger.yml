name: Materialize historical 2023-24 Wikipedia challenger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-historical-2023-24-wikipedia-challenger.yml'
  workflow_dispatch:

permissions:
  contents: read

# Runner trigger revision: cited-evidence challenger v2.2
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
          git -C fantadesk-private rev-parse HEAD
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml requests beautifulsoup4
      - name: Materialize completeness challenger
        working-directory: fantadesk-private
        run: python scripts/nexus/materialize_historical_2023_24_wikipedia_challenger.py
      - name: Stage challenger
        run: |
          set -euo pipefail
          mkdir -p out
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2023-24-summer-wikipedia-transfer-challenger-v2.csv out/
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2023-24-winter-wikipedia-transfer-challenger-v2.csv out/
      - name: Upload challenger
        uses: actions/upload-artifact@v4
        with:
          name: historical-2023-24-wikipedia-transfer-challenger-v2
          path: out
          if-no-files-found: error
          retention-days: 14
