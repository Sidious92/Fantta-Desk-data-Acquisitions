name: FantaDesk Private CI Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: FantaDesk branch, tag or commit to verify
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-private-ci-verify.yml
      - .github/fantadesk-ci-target.txt

permissions:
  contents: read

jobs:
  verify-private-fantadesk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FANTADESK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
    steps:
      - name: Checkout public CI controller
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve explicitly pinned private commit on public push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\\r\\n' < .github/fantadesk-ci-target.txt)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid pinned private commit SHA'; exit 1; }
          echo "FANTADESK_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout private FantaDesk ephemerally
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.FANTADESK_REF }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Tests
        working-directory: app
        run: npm run test:run

      - name: Build
        working-directory: app
        run: npm run build
