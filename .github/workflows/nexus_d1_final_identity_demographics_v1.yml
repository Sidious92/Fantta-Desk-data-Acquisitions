name: Nexus D1 Final Identity Demographics v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-final-identity-demographics-v1/EXECUTE'

permissions:
  contents: write

concurrency:
  group: nexus-d1-final-identity-demographics-v1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEST: data/nexus-d1/final-v1
      RELEASE_TAG: nexus-d1-identity-demographics-final-v1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preflight all D1 immutable raw authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          checks=[
            ('.nexus-d1-current-505-wikidata-v2-1-status/RESULT.json',505),
            ('.nexus-d1-historical-2048-wikidata-v4-1-status/RESULT.json',2048),
            ('.nexus-d1-historical-445-observation-demographics-v1-status/RESULT.json',704),
            ('.nexus-d1-secondary-raw-preservation-v2-status/RESULT.json',None),
          ]
          for p,n in checks:
            d=json.loads(Path(p).read_text()); assert d['status']=='PASS',p
          assert json.loads(Path('.nexus-d1-current-505-wikidata-v2-1-status/RESULT.json').read_text())['summary']['subjects']==505
          assert json.loads(Path('.nexus-d1-historical-2048-wikidata-v4-1-status/RESULT.json').read_text())['summary']['subjects']==2048
          assert json.loads(Path('.nexus-d1-historical-445-observation-demographics-v1-status/RESULT.json').read_text())['summary']['observations']==704
          p=json.loads(Path('.nexus-d1-secondary-raw-preservation-v2-status/RESULT.json').read_text())
          assert p['rules']['preservationReplayOnly'] is True and p['rules']['d2Started'] is False
          PY
          for tag in \
            nexus-d1-current-505-wikidata-v2-1 \
            nexus-d1-historical-2048-wikidata-v4-1 \
            nexus-d1-historical-445-observation-demographics-v1 \
            nexus-d1-secondary-raw-preservation-v2; do
              gh release view "$tag" >/dev/null
          done

      - name: Build final identity master and D1 registry
        run: |
          set -euo pipefail
          rm -rf "$DEST"
          python scripts/nexus-d1-build-final-identity-master-v1.py | tee /tmp/d1-final-build.log
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/nexus-d1/final-v1/IDENTITY_MASTER.json').read_text())
          r=json.loads(Path('data/nexus-d1/final-v1/D1_REGISTRY.json').read_text())
          x=json.loads(Path('data/nexus-d1/final-v1/MANIFEST.json').read_text())
          assert m['status']=='PASS' and x['status']=='PASS'
          assert m['scope']['currentSubjectRecords']==505
          assert m['scope']['historicalUnderstatSubjectRecords']==2048
          assert m['scope']['historicalProviderScopedIdentityUnits']==445
          assert r['counts']['current']['dobVerified']==505
          assert r['counts']['historicalUnderstatBacked']['dobVerified']==2047
          assert r['counts']['historicalUnderstatBacked']['dobConflict']==1
          assert r['counts']['historicalNeverUnderstatBridged']['providerScopedGroups']==445
          assert r['counts']['historicalNeverUnderstatBridged']['groupsWithoutDobConsensus']==0
          assert len(r['typedResiduals']['dobConflicts'])==1
          assert r['governance']['fuzzyMatchingUsed'] is False
          assert r['governance']['providerIdsUsedAsGlobalPersonKeys'] is False
          assert r['governance']['f1Started'] is False and r['governance']['d2Started'] is False
          PY

      - name: Persist final package
        run: |
          set -euo pipefail
          cp /tmp/d1-final-build.log "$DEST/BUILD.stdout.log"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'nexus: persist final D1 identity demographics package v1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Freeze final D1 package in immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'final release already exists' >&2; exit 1; fi
          tar -czf nexus-d1-identity-demographics-final-v1.tar.gz "$DEST"
          sha256sum nexus-d1-identity-demographics-final-v1.tar.gz > nexus-d1-identity-demographics-final-v1.tar.gz.sha256
          trap 'gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true' ERR
          gh release create "$RELEASE_TAG" --draft --target "$(git rev-parse HEAD)" --title 'FantaNexus D1 Identity & Demographics Final v1' --notes 'Final D1 identity-demographics package. Current 505 complete; historical Understat-backed 2047/2048 DOB verified with one typed source conflict; 445 never-bridged Fantacalcio groups remain provider-scoped. No fuzzy matching, inferred DOB, age derivation, F1, D2, or model mutation.'
          gh release upload "$RELEASE_TAG" nexus-d1-identity-demographics-final-v1.tar.gz nexus-d1-identity-demographics-final-v1.tar.gz.sha256 "$DEST/IDENTITY_MASTER.json" "$DEST/D1_REGISTRY.json" "$DEST/MANIFEST.json"
          trap - ERR
