name: Audit historical 2023-24 winter youth discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-historical-2023-24-winter-primavera-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

# trigger: challenger route audit v6 alias/name normalization
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - uses: actions/checkout@v4
      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build latest secondary supplement
        working-directory: fantadesk-private
        run: |
          set -euo pipefail
          python scripts/nexus/materialize_historical_2023_24_wikipedia_challenger.py
          python scripts/nexus/audit_historical_2023_24_challenger_routes.py
          python scripts/nexus/materialize_historical_2023_24_secondary_supplement.py
      - name: Audit secondary supplement overlap
        working-directory: fantadesk-private
        run: python scripts/nexus/audit_historical_2023_24_secondary_overlap.py
      - name: Audit Primavera discovery residual
        working-directory: fantadesk-private
        run: python scripts/nexus/audit_historical_2023_24_winter_primavera_discovery.py
      - name: Audit Juventus complete official winter recap
        working-directory: fantadesk-private
        run: python scripts/nexus/audit_historical_2023_24_winter_juventus_official_recap.py
      - name: Stage diagnostics
        run: |
          set -euo pipefail
          mkdir -p out
          D=fantadesk-private/data/nexus/transfer-events/v1
          cp "$D"/historical-2023-24-challenger-route-audit-v6.json out/
          cp "$D"/historical-2023-24-secondary-completeness-supplement-audit-v3.json out/
          cp "$D"/historical-2023-24-secondary-overlap-audit-v1.json out/
          cp "$D"/historical-2023-24-winter-primavera-discovery-audit-v1.json out/
          cp "$D"/historical-2023-24-winter-juventus-official-recap-audit-v2.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: historical-2023-24-normalized-overlap-youth-audits
          path: out
          if-no-files-found: error
          retention-days: 14
