name: Audit historical 2023-24 winter youth discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-historical-2023-24-winter-primavera-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

# trigger: promoted bulk Primavera layer + post-bulk residual/completeness/reconciliation
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - uses: actions/checkout@v4
      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build secondary completeness layer
        working-directory: fantadesk-private
        run: |
          set -euo pipefail
          python scripts/nexus/materialize_historical_2023_24_wikipedia_challenger.py
          python scripts/nexus/audit_historical_2023_24_challenger_routes.py
          python scripts/nexus/materialize_historical_2023_24_secondary_supplement.py
          python scripts/nexus/audit_historical_2023_24_secondary_overlap.py
      - name: Materialize reviewed Primavera bulk layer
        working-directory: fantadesk-private
        run: python scripts/nexus/materialize_historical_2023_24_winter_primavera_bulk_candidate.py
      - name: Verify Primavera source residual is zero
        working-directory: fantadesk-private
        run: |
          set -euo pipefail
          python scripts/nexus/audit_historical_2023_24_winter_primavera_discovery.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nexus/transfer-events/v1/historical-2023-24-winter-primavera-discovery-audit-v2.json')
          s=json.loads(p.read_text())
          assert s['status']=='PASS', s
          assert s['residualDiscoveryCandidates']==0, s['residualDiscoveryCandidates']
          print({'primaveraResidual':0,'covered':s['alreadyCoveredFaces'],'disposed':s['resolvedByReviewedDisposition']})
          PY
      - name: Audit Juventus complete official winter recap
        working-directory: fantadesk-private
        run: python scripts/nexus/audit_historical_2023_24_winter_juventus_official_recap.py
      - name: Run full completeness diagnostic
        working-directory: fantadesk-private
        run: python scripts/nexus/audit_historical_2023_24_completeness.py
      - name: Reconcile all internal Serie A pairs
        working-directory: fantadesk-private
        run: |
          set -euo pipefail
          python scripts/nexus/reconcile_historical_2023_24_internal_pairs.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nexus/transfer-events/v1/historical-2023-24-internal-pair-reconciliation-audit-v1.json')
          s=json.loads(p.read_text())
          assert s['status']=='PASS', s
          print({'pairAudit':s['status']})
          PY
      - name: Stage end-to-end diagnostics
        run: |
          set -euo pipefail
          mkdir -p out
          D=fantadesk-private/data/nexus/transfer-events/v1
          cp "$D"/historical-2023-24-winter-primavera-bulk-team-side-ledger-v1.csv out/
          cp "$D"/historical-2023-24-winter-primavera-bulk-ledger-audit-v1.json out/
          cp "$D"/historical-2023-24-winter-primavera-discovery-audit-v2.json out/
          cp "$D"/historical-2023-24-completeness-diagnostic-v4.json out/
          cp "$D"/historical-2023-24-summer-internal-pair-reconciliation-v1.csv out/
          cp "$D"/historical-2023-24-winter-internal-pair-reconciliation-v1.csv out/
          cp "$D"/historical-2023-24-internal-pair-reconciliation-audit-v1.json out/
          cp "$D"/historical-2023-24-winter-juventus-official-recap-audit-v2.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: historical-2023-24-post-bulk-youth-e2e-validation
          path: out
          if-no-files-found: error
          retention-days: 14
