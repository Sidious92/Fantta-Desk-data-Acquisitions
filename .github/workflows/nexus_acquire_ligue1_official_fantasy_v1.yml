name: Nexus Ligue 1 Official Fantasy v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-ligue1-official-fantasy-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTHORITY_SHA: 57881f26f259cb1bd345812fda0889209972cdc7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify scientific authority
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-ligue1-official-fantasy-acquisition-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/nexus-acquire-ligue1-official-fantasy-v1.py
      - name: Validate manifest
        run: |
          python - <<'PY'
          import json,sys
          m=json.load(open('/mnt/data/nexus-ligue1-official-fantasy-v1/manifest.json'))
          checks=m['validation']['checks']
          assert m['status']=='PASS'
          assert all(checks.values())
          assert m['governance']['authenticated_surface_accessed'] is False
          assert m['governance']['predictive_models_modified'] is False
          assert m['governance']['decision_layer_started'] is False
          print(json.dumps(m['coverage'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-ligue1-official-fantasy-v1
          path: /mnt/data/nexus-ligue1-official-fantasy-v1
          if-no-files-found: warn
          retention-days: 90
      - name: Record terminal status
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-ligue1-official-fantasy-v1-status
          python - '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          status,run_id=sys.argv[1:]
          out={'workflow':'Nexus Ligue 1 Official Fantasy v1','job_status':status,'run_id':int(run_id)}
          p=Path('/mnt/data/nexus-ligue1-official-fantasy-v1/manifest.json')
          if p.is_file():out['manifest']=json.load(open(p))
          Path('.nexus-ligue1-official-fantasy-v1-status/RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-ligue1-official-fantasy-v1-status/RESULT.json
          git commit -m 'ci: record Ligue 1 official fantasy v1 ${{ job.status }}' || exit 0
          git push origin HEAD:main
