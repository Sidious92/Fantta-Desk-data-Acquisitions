name: FantaDesk B35 - verification dossier focused contract and UI
on:
  push:
    branches:
      - ci/fantadesk-b35-verification-dossier-20261028
    paths:
      - .github/workflows/fantadesk-b35-focused.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PRIVATE_SHA: 'bce0e5ad1b9ae49d26724650c548b74848e764bb'
      FANTADESK_PUBLIC_WEB_BUILD: 'true'
      VITE_NEXUS_PRIVATE_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Verify source SHA
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: B33 replay contract and existing regression tests
        working-directory: private-app
        run: npm run test:run -- src/features/campionato/cupTieRuleRepository.test.ts src/features/campionato/verificationDossierRepository.test.ts src/features/campionato/leaguePublicationFreshness.test.ts src/features/campionato/leaguePublicationRepository.test.ts src/features/campionato/leaguePublishedStandings.test.ts src/features/campionato/serverReplayRepository.test.ts src/features/campionato/dualFixtureReconciliation.test.ts src/features/campionato/MatchReviewControl.test.tsx src/features/campionato/CampionatoPage.test.tsx --maxWorkers=2
      - name: Strict TypeScript
        working-directory: private-app
        run: npm run typecheck
      - name: Public build
        working-directory: private-app
        run: npm run build
      - name: Public asset check
        working-directory: private-app
        run: node scripts/assert-public-web-dist.mjs
