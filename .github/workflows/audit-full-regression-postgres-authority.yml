name: Full Regression Postgres Authority

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-full-regression-postgres-authority.yml'

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require private-repo token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - name: Checkout exact private FantaDesk SHA
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: d4eafca6b850d964a38b331fb83a96fa77684cf6
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "d4eafca6b850d964a38b331fb83a96fa77684cf6"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-package-lock
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Run full test suite
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee full-regression.log
      - name: Build web app
        working-directory: app
        run: npm run build
      - name: Upload full regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-log-${{ github.run_id }}
          path: app/full-regression.log
          if-no-files-found: warn
          retention-days: 7
