name: Full Regression Postgres Authority

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-full-regression-postgres-authority.yml'

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require private-repo token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - name: Checkout exact private FantaDesk SHA
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: f8907b0dc10221173d76fa0d2b0a3b0a211b544d
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "f8907b0dc10221173d76fa0d2b0a3b0a211b544d"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-package-lock
      - name: Run full test suite
        working-directory: app
        run: npx vitest run --reporter=verbose
