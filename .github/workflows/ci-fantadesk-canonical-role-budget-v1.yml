name: CI FantaDesk price band colors

on:
  push:
    branches: [main]
    paths:
      - '.ci-trigger/fantadesk-canonical-role-budget-v1.txt'
      - '.github/workflows/ci-fantadesk-canonical-role-budget-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Require private-repo token
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          test -n "$FANTADESK_READ_TOKEN"

      - name: Checkout private FantaDesk branch
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: fix/price-band-colors-v1
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Run test suite
        working-directory: app
        run: npx vitest run

      - name: TypeScript
        working-directory: app
        run: npx tsc -b

      - name: Production build
        working-directory: app
        run: |
          npm run nexus:runtime:build
          npx vite build --base=./
