name: Nexus Belgian Fantasy Pro League v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-belgian-fantasy-proleague-v2-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTHORITY_SHA: bb9a4836e720174fc3fdcc8e2099913c7536cb14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-belgian-fantasy-proleague-acquisition-v2-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - run: python scripts/nexus-acquire-belgian-fantasy-proleague-v2.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          m=json.load(open('/mnt/data/nexus-belgian-fantasy-proleague-v2/manifest.json'))
          ps=m['sources']['players_stats'];pd=m['sources']['player_details']
          checks={
            'manifest_pass':m.get('status')=='PASS',
            'xlsx_valid':m['sources']['excel'].get('valid_xlsx') is True,
            'fdr_valid':m['sources']['fdr'].get('valid_json') is True,
            'players_gt_100':ps.get('unique_player_ids',0)>100,
            'detail_rate':pd.get('success_rate',0)>=0.90,
            'no_auth':m['governance']['authenticated_surface_accessed'] is False,
            'no_private':m['governance']['private_team_or_user_endpoints_accessed'] is False,
            'no_model_mutation':m['governance']['predictive_models_modified'] is False,
          }
          r={'schema':'NEXUS_BELGIAN_FANTASY_PROLEAGUE_V2_VALIDATION','status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'players_stats':ps,'player_details':pd}
          Path('/mnt/data/nexus-belgian-fantasy-proleague-v2-validation.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2));sys.exit(0 if r['status']=='PASS' else 1)
          PY
      - name: Package
        if: always()
        shell: bash
        run: |
          mkdir -p /mnt/data/package-belgian-v2
          test -d /mnt/data/nexus-belgian-fantasy-proleague-v2 && tar -C /mnt/data --zstd -cf /mnt/data/package-belgian-v2/nexus-belgian-fantasy-proleague-v2.tar.zst nexus-belgian-fantasy-proleague-v2 || true
          test -f /mnt/data/nexus-belgian-fantasy-proleague-v2/manifest.json && cp /mnt/data/nexus-belgian-fantasy-proleague-v2/manifest.json /mnt/data/package-belgian-v2/ || true
          test -f /mnt/data/nexus-belgian-fantasy-proleague-v2-validation.json && cp /mnt/data/nexus-belgian-fantasy-proleague-v2-validation.json /mnt/data/package-belgian-v2/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-belgian-fantasy-proleague-v2
          path: /mnt/data/package-belgian-v2/*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Record terminal status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:];p={'workflow':'Nexus Belgian Fantasy Pro League v2','job_status':status,'run_id':int(run_id)}
          for key,path in [('manifest','/mnt/data/nexus-belgian-fantasy-proleague-v2/manifest.json'),('validation','/mnt/data/nexus-belgian-fantasy-proleague-v2-validation.json')]:
              q=Path(path)
              if q.is_file():p[key]=json.load(open(q))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-belgian-fantasy-proleague-v2-status
          cp "$tmp" .nexus-belgian-fantasy-proleague-v2-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-belgian-fantasy-proleague-v2-status/RESULT.json
          git commit -m "ci: record Belgian Fantasy Pro League v2 ${{ job.status }}" || exit 0
          git push origin HEAD:main
