name: Audit Single Listone Authority

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-buy-advisor-simple-v1.yml'

permissions:
  contents: read

jobs:
  audit-listone-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require private-repo token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"

      - name: Checkout exact private FantaDesk feature SHA
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: 4efac432fc93ac81df7ed79223fba83e63bb9975
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact private SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "4efac432fc93ac81df7ed79223fba83e63bb9975"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Run Listone and auction-session tests
        working-directory: app
        run: npx vitest run src/features/listone/playerImport.test.ts src/features/auction/auctionSession.test.ts --reporter=verbose

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Build web app
        working-directory: app
        run: |
          npm run nexus:runtime:build
          npx tsc -b
          npx vite build
