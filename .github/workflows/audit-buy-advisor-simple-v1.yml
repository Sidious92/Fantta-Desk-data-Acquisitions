name: Audit Buy Advisor Simple V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-buy-advisor-simple-v1.yml'

permissions:
  contents: read

jobs:
  audit-buy-advisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require private-repo token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"

      - name: Checkout exact private FantaDesk feature SHA
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: dfccac17145c87e898606edbdb06f0c822f2a115
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact private SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "dfccac17145c87e898606edbdb06f0c822f2a115"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Run Buy Advisor tests and 105 corrected Secas auctions
        working-directory: app
        run: npx vitest run src/features/auction/buyAdvisorV01.test.ts src/features/auction/buyAdvisorV01.secasDynamic105Complete.test.ts --reporter=verbose

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit
