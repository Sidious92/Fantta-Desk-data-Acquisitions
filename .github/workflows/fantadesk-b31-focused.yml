name: FantaDesk B31 - focused dual fixture and owner editor
on:
  push:
    branches: [ci/fantadesk-b31-dual-lineups-20261027]
    paths: [.github/workflows/fantadesk-b31-focused.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  unit-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_SHA: '25a0db7a57cdc454b71a24f2f522c09ed9e8acd3'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Verify exact code
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: B31 dual fixture and model unit regressions
        working-directory: private-app
        run: npm run test:run -- src/features/campionato/dualFixtureReconciliation.test.ts src/features/campionato/opponentLineupRepository.test.ts src/features/campionato/CampionatoPage.test.tsx --maxWorkers=2
      - name: Strict TypeScript
        working-directory: private-app
        run: npm run typecheck
