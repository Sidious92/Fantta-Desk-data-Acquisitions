name: Nexus Scandinavian FPL Clones v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-scandinavian-fpl-clones-v1-launch/EXECUTE'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTHORITY_SHA: 43f6e9d9b676509d39743fe259e41be24d383266
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify authority
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-scandinavian-fpl-clones-acquisition-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - run: python scripts/nexus-acquire-scandinavian-fpl-clones-v1.py
      - name: Validate
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          m=json.load(open('/mnt/data/nexus-scandinavian-fpl-clones-v1/manifest.json'))
          checks={'manifest_pass':m.get('status')=='PASS','two_providers':len(m.get('providers',[]))==2,'all_players_gt_300':all(x.get('bootstrap_players',0)>300 for x in m['providers']),'all_summary_rate':all(x.get('summary_success_rate',0)>=0.95 for x in m['providers']),'no_model_mutation':m['governance']['predictive_models_modified'] is False}
          r={'status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'providers':m['providers']}; Path('/mnt/data/nexus-scandinavian-fpl-clones-v1-validation.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2)); sys.exit(0 if r['status']=='PASS' else 1)
          PY
      - name: Package
        if: always()
        run: |
          mkdir -p /mnt/data/package-scandinavia-v1
          test -d /mnt/data/nexus-scandinavian-fpl-clones-v1 && tar -C /mnt/data --zstd -cf /mnt/data/package-scandinavia-v1/nexus-scandinavian-fpl-clones-v1.tar.zst nexus-scandinavian-fpl-clones-v1 || true
          test -f /mnt/data/nexus-scandinavian-fpl-clones-v1/manifest.json && cp /mnt/data/nexus-scandinavian-fpl-clones-v1/manifest.json /mnt/data/package-scandinavia-v1/ || true
          test -f /mnt/data/nexus-scandinavian-fpl-clones-v1-validation.json && cp /mnt/data/nexus-scandinavian-fpl-clones-v1-validation.json /mnt/data/package-scandinavia-v1/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-scandinavian-fpl-clones-v1
          path: /mnt/data/package-scandinavia-v1/*
          if-no-files-found: warn
          retention-days: 90
      - name: Record terminal status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:]; p={'workflow':'Nexus Scandinavian FPL Clones v1','job_status':status,'run_id':int(run_id)}
          m=Path('/mnt/data/nexus-scandinavian-fpl-clones-v1/manifest.json'); v=Path('/mnt/data/nexus-scandinavian-fpl-clones-v1-validation.json')
          if m.is_file(): p['manifest']=json.load(open(m))
          if v.is_file(): p['validation']=json.load(open(v))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-scandinavian-fpl-clones-v1-status
          cp "$tmp" .nexus-scandinavian-fpl-clones-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-scandinavian-fpl-clones-v1-status/RESULT.json
          git commit -m "ci: record Scandinavian fantasy ${{ job.status }}" || exit 0
          git push origin HEAD:main
