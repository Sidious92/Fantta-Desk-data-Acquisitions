name: Audit Postgres Authority Complete v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-postgres-authority-complete-v1.yml'

permissions:
  contents: read

jobs:
  audit-postgres-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require private-repo token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"

      - name: Checkout exact private FantaDesk SHA
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: 0b6afc73b637b6378c097a2398693397d40e56a0
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact private SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "0b6afc73b637b6378c097a2398693397d40e56a0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Run authority tests
        working-directory: app
        run: npx vitest run src/features/auction/auctionSession.test.ts src/features/auction/auctionLedger.test.ts src/features/auction/nominationAdvisorPresentationV01.test.ts src/features/targets/targetRepository.test.ts src/features/auction/injurySnapshot20260912.test.ts --reporter=verbose

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Build web app
        working-directory: app
        run: |
          npm run nexus:runtime:build
          npx tsc -b
          npx vite build
