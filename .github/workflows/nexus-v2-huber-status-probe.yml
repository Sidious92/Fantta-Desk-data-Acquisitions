name: Nexus v2 Huber Status Probe

on:
  push:
    branches: [main]
    paths:
      - .nexus-v2-huber-status-probe/TRIGGER

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Record target tournament failed jobs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: '32141501811'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          run=os.environ['TARGET_RUN_ID']
          token=os.environ['GH_TOKEN']
          headers={
            'Authorization':f'Bearer {token}',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'nexus-v2-status-probe',
          }
          jobs=[]
          page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/actions/runs/{run}/jobs?per_page=100&page={page}'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  payload=json.load(r)
              batch=payload.get('jobs',[])
              jobs.extend(batch)
              if len(batch)<100: break
              page+=1
          failed=[]
          for j in jobs:
              if j.get('conclusion')!='success':
                  failed.append({
                    'id':j.get('id'),
                    'name':j.get('name'),
                    'status':j.get('status'),
                    'conclusion':j.get('conclusion'),
                    'started_at':j.get('started_at'),
                    'completed_at':j.get('completed_at'),
                    'steps':[
                      {'name':s.get('name'),'number':s.get('number'),'status':s.get('status'),'conclusion':s.get('conclusion')}
                      for s in j.get('steps',[])
                    ],
                  })
          out={'run_id':int(run),'job_count':len(jobs),'non_success_jobs':failed}
          os.makedirs('.nexus-v2-huber-status-probe',exist_ok=True)
          json.dump(out,open('.nexus-v2-huber-status-probe/JOBS.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-v2-huber-status-probe/JOBS.json
          git commit -m "ci: record Huber tournament failed jobs" || exit 0
          git push
