name: Audit Remote Slot Clear v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-remote-slot-clear-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require private-repo token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - name: Checkout exact private FantaDesk SHA
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: c2aead408d46cb8feb892a40d86aa49b1b23258f
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact private SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "c2aead408d46cb8feb892a40d86aa49b1b23258f"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Run slot and auction regression tests
        working-directory: app
        run: npx vitest run src/features/auction/myTeamSlotAssignments.test.ts src/features/auction/myTeamBudgetModel.test.ts src/features/auction/auctionLedger.test.ts src/features/auction/auctionSession.test.ts --reporter=verbose
      - name: Full B12 candidate test suite
        working-directory: app
        run: npm run test:run
      - name: Build web app
        working-directory: app
        run: npm run build
