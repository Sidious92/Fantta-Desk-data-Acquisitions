name: Nexus Belgian Fantasy Pro League Public v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-belgian-fantasy-proleague-public-v1-launch/EXECUTE'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1
      - name: Acquire public stats/export surface
        run: python scripts/nexus-acquire-belgian-fantasy-proleague-public-v1.py
      - name: Package
        if: always()
        run: |
          mkdir -p /mnt/data/package-belgian-fantasy-v1
          test -d /mnt/data/nexus-belgian-fantasy-proleague-public-v1 && tar -C /mnt/data --zstd -cf /mnt/data/package-belgian-fantasy-v1/nexus-belgian-fantasy-proleague-public-v1.tar.zst nexus-belgian-fantasy-proleague-public-v1 || true
          test -f /mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json && cp /mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json /mnt/data/package-belgian-fantasy-v1/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-belgian-fantasy-proleague-public-v1
          path: /mnt/data/package-belgian-fantasy-v1/*
          if-no-files-found: warn
          retention-days: 90
      - name: Record terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if test -f /mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json; then cp /mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json "$tmp"; else printf '{"status":"NO_MANIFEST","job_status":"${{ job.status }}"}\n' > "$tmp"; fi
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-belgian-fantasy-proleague-public-v1-status
          cp "$tmp" .nexus-belgian-fantasy-proleague-public-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-belgian-fantasy-proleague-public-v1-status/RESULT.json
          git commit -m 'ci: record Belgian Fantasy Pro League public acquisition' || exit 0
          git push origin HEAD:main
