name: Nexus D1 Run Diagnostic v1

on:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-current-505-run-diagnostic-v1/EXECUTE'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read D1 workflow runs
        run: |
          set -euo pipefail
          mkdir -p .nexus-d1-current-505-run-diagnostic-v1
          gh run list --workflow nexus_d1_current_505_wikidata_demographics_v1.yml --limit 10 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url > .nexus-d1-current-505-run-diagnostic-v1/CURRENT.json
          gh run list --workflow nexus_d1_recover_current_subject_transport_v2.yml --limit 10 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url > .nexus-d1-current-505-run-diagnostic-v1/RECOVERY.json
          if gh workflow view nexus_d1_historical_2048_wikidata_demographics_v1.yml >/dev/null 2>&1; then
            gh run list --workflow nexus_d1_historical_2048_wikidata_demographics_v1.yml --limit 10 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url > .nexus-d1-current-505-run-diagnostic-v1/HISTORICAL.json
          fi
          cat .nexus-d1-current-505-run-diagnostic-v1/RECOVERY.json
      - name: Persist diagnostic
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-d1-current-505-run-diagnostic-v1/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: persist D1 run diagnostics [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
