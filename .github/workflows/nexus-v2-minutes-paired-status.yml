name: Nexus v2 Minutes Paired Status Watcher

on:
  workflow_run:
    workflows: ["Nexus v2 Minutes Paired Development"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Record status only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nexus-v2-minutes-paired-status
          cat > .nexus-v2-minutes-paired-status/RESULT.json <<EOF
          {"workflow":"Nexus v2 Minutes Paired Development","run_id":${{ github.event.workflow_run.id }},"conclusion":"${{ github.event.workflow_run.conclusion }}","head_sha":"${{ github.event.workflow_run.head_sha }}","updated_at":"${{ github.event.workflow_run.updated_at }}"}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-v2-minutes-paired-status/RESULT.json
          git commit -m "ci: record Nexus v2 Minutes paired status" || exit 0
          git push
