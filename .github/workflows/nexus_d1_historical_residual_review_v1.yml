name: Nexus D1 Historical Residual Review v1
on:
  push:
    paths: ['.nexus-d1-historical-residual-review-v1/EXECUTE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/nexus-d1-review-historical-residuals-v1.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nexus-d1/historical-residual-review-v1
          git commit -m 'nexus: persist D1 historical residual review v1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main