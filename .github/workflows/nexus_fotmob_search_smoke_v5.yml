name: Nexus FotMob Search Smoke v5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-fotmob-search-smoke-v5-launch/EXECUTE'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo mkdir -p /mnt/data/nexus-fotmob-search-smoke-v5 && sudo chown -R $USER:$USER /mnt/data
      - run: timeout 7m python scripts/probe_fotmob_search_smoke_v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-fotmob-search-smoke-v5
          path: /mnt/data/nexus-fotmob-search-smoke-v5
          if-no-files-found: warn
      - name: Record result
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-fotmob-search-smoke-v5-status
          if [ -f /mnt/data/nexus-fotmob-search-smoke-v5/RESULT.json ]; then
            cp /mnt/data/nexus-fotmob-search-smoke-v5/RESULT.json .nexus-fotmob-search-smoke-v5-status/RESULT.json
          else
            printf '{"schema":"NEXUS_FOTMOB_PUBLIC_SEARCH_SMOKE_V5","status":"NO_RESULT_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-fotmob-search-smoke-v5-status/RESULT.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-fotmob-search-smoke-v5-status/RESULT.json
          git commit -m 'ci: record FotMob search smoke v5' || exit 0
          git push origin HEAD:main
