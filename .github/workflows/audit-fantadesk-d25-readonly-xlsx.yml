name: Audit FantaDesk D25 Authorized XLSX Read-only 38 Cohort

on:
  push:
    paths:
      - '.github/workflows/audit-fantadesk-d25-readonly-xlsx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require private checkout read token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/Fantta-Desk-data-Acquisitions
          path: public
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          ref: audit/data-coverage-source-gates-20261028
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1
      - name: Require exactly audited D25 private commit
        run: test "$(git -C private rev-parse HEAD)" = "7b19bac87e5a6000f5442d8b3e427396b829bf62"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: D25 syntax and nine regression tests, no third-party files or secrets printed
        run: |
          node --check private/scripts/data/d25-authorized-workbook-audit.mjs
          node --check private/scripts/data/d25-authorized-workbook-audit-cli.mjs
          node --test private/scripts/data/d25-authorized-workbook-audit.test.mjs
          node --test private/scripts/data/d24-authorized-listone-diff.test.mjs
