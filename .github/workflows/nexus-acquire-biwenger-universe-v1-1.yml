name: Nexus Biwenger Universe v1.1 Bounded
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-biwenger-universe-v1-1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTHORITY_SHA: f92bc46771ab7ba9249a484d31bc2e27c15d2972
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify unchanged scientific protocol
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-biwenger-universe-acquisition-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - name: Bounded acquisition using unchanged v1 protocol
        run: timeout 75m python scripts/nexus-acquire-biwenger-universe-v1-1.py
      - name: Validate
        if: success()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          m=json.load(open('/mnt/data/nexus-biwenger-universe-v1-1/manifest.json'));c=m['coverage'];vm=m['valid_score_queries_by_competition']
          checks={'manifest_pass':m.get('status')=='PASS','valid_competitions_ge_5':c.get('valid_competition_count',0)>=5,'metadata_rate':c.get('metadata_success_rate',0)>=0.95,'multiple_score_mode_somewhere':any(len(v)>=2 for v in vm.values()),'season_refs':c.get('season_references',0)>1000,'same_candidates':m['governance']['same_protocol_candidate_competitions'] is True,'same_scores':m['governance']['same_protocol_score_queries'] is True,'no_normalization':m['governance']['cross_score_mode_normalization_performed'] is False,'no_model_mutation':m['governance']['predictive_models_modified'] is False}
          r={'status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'coverage':c,'valid_scores':vm};Path('/mnt/data/nexus-biwenger-universe-v1-1-validation.json').write_text(json.dumps(r,indent=2)+'\n');print(json.dumps(r,indent=2));sys.exit(0 if r['status']=='PASS' else 1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-biwenger-universe-v1-1
          path: |
            /mnt/data/nexus-biwenger-universe-v1-1
            /mnt/data/nexus-biwenger-universe-v1-1-validation.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record terminal status even after bounded acquisition failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:];p={'workflow':'Nexus Biwenger Universe v1.1 Bounded','job_status':status,'run_id':int(run_id),'scientific_protocol':'NEXUS_BIWENGER_UNIVERSE_ACQUISITION_PROTOCOL_V1','authority_sha':'f92bc46771ab7ba9249a484d31bc2e27c15d2972'}
          m=Path('/mnt/data/nexus-biwenger-universe-v1-1/manifest.json');v=Path('/mnt/data/nexus-biwenger-universe-v1-1-validation.json');q=Path('/mnt/data/nexus-biwenger-universe-v1-1/PROGRESS.json')
          if m.is_file():p['manifest']=json.load(open(m))
          if v.is_file():p['validation']=json.load(open(v))
          if q.is_file():p['progress']=json.load(open(q))
          if not m.is_file():p['manifest_missing']=True
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-biwenger-universe-v1-1-status
          cp "$tmp" .nexus-biwenger-universe-v1-1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-biwenger-universe-v1-1-status/RESULT.json
          git commit -m 'ci: record Biwenger universe v1.1 bounded terminal status' || exit 0
          git push origin HEAD:main
