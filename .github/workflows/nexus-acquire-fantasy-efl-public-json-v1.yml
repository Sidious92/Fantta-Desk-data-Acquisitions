name: Nexus Fantasy EFL Public JSON v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-fantasy-efl-public-json-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTHORITY_SHA: d65e301e8c56817022d5c65dd13655936371d71e
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-fantasy-efl-public-json-acquisition-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - run: python scripts/nexus-acquire-fantasy-efl-public-json-v1.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          m=json.load(open('/mnt/data/nexus-fantasy-efl-public-json-v1/manifest.json'));c=m['coverage']
          checks={
            'manifest_pass':m.get('status')=='PASS',
            'players_gt_100':c.get('players',0)>100,
            'squads_gt_50':c.get('squads',0)>50,
            'competitions_ge_3':c.get('competitions',0)>=3,
            'profile_rate':c.get('player_profile_success_rate',0)>=0.95,
            'no_authenticated_api':m['governance']['authenticated_api_accessed'] is False,
            'no_commercial_genius':m['governance']['commercial_genius_api_accessed'] is False,
            'no_model_mutation':m['governance']['predictive_models_modified'] is False,
          }
          r={'schema':'NEXUS_FANTASY_EFL_PUBLIC_JSON_V1_VALIDATION','status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'coverage':c,'competition_codes':m.get('competition_codes_observed')}
          Path('/mnt/data/nexus-fantasy-efl-public-json-v1-validation.json').write_text(json.dumps(r,indent=2)+'\n');print(json.dumps(r,indent=2));sys.exit(0 if r['status']=='PASS' else 1)
          PY
      - name: Package
        if: always()
        shell: bash
        run: |
          mkdir -p /mnt/data/package-efl-v1
          test -d /mnt/data/nexus-fantasy-efl-public-json-v1 && tar -C /mnt/data --zstd -cf /mnt/data/package-efl-v1/nexus-fantasy-efl-public-json-v1.tar.zst nexus-fantasy-efl-public-json-v1 || true
          test -f /mnt/data/nexus-fantasy-efl-public-json-v1/manifest.json && cp /mnt/data/nexus-fantasy-efl-public-json-v1/manifest.json /mnt/data/package-efl-v1/ || true
          test -f /mnt/data/nexus-fantasy-efl-public-json-v1-validation.json && cp /mnt/data/nexus-fantasy-efl-public-json-v1-validation.json /mnt/data/package-efl-v1/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-fantasy-efl-public-json-v1
          path: /mnt/data/package-efl-v1/*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Record terminal status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:];p={'workflow':'Nexus Fantasy EFL Public JSON v1','job_status':status,'run_id':int(run_id)}
          for key,path in [('manifest','/mnt/data/nexus-fantasy-efl-public-json-v1/manifest.json'),('validation','/mnt/data/nexus-fantasy-efl-public-json-v1-validation.json')]:
              q=Path(path)
              if q.is_file():p[key]=json.load(open(q))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-fantasy-efl-public-json-v1-status
          cp "$tmp" .nexus-fantasy-efl-public-json-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-fantasy-efl-public-json-v1-status/RESULT.json
          git commit -m "ci: record Fantasy EFL public JSON ${{ job.status }}" || exit 0
          git push origin HEAD:main
