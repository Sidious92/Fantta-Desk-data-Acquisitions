name: Nexus D1 Historical Single Observation Retry v1
on:
  push:
    paths: ['.nexus-d1-historical-single-retry-v1/EXECUTE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/nexus-d1-retry-single-historical-observation-v1.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nexus-d1/historical-445-single-retry-v1
          git commit -m 'nexus: persist D1 historical single observation retry v1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main