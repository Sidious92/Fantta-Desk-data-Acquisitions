name: Nexus Biwenger Serie A Cross-League History Probe v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-probe-biwenger-seriea-crossleague-history-v1-launch/EXECUTE'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - run: python scripts/nexus-probe-biwenger-seriea-crossleague-history-v1.py
      - name: Persist result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if test -s .nexus-probe-biwenger-seriea-crossleague-history-v1-status/RESULT.json; then
            cp .nexus-probe-biwenger-seriea-crossleague-history-v1-status/RESULT.json "$tmp"
          else
            printf '{"error":"probe produced no result"}\n' > "$tmp"
          fi
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-probe-biwenger-seriea-crossleague-history-v1-status
          cp "$tmp" .nexus-probe-biwenger-seriea-crossleague-history-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-probe-biwenger-seriea-crossleague-history-v1-status/RESULT.json
          git commit -m 'ci: record Biwenger Serie A cross-league history probe' || exit 0
          git push origin HEAD:main
