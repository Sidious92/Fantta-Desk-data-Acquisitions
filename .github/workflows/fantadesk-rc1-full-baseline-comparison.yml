name: FantaDesk RC1 - full main baseline versus isolated targets
on:
  push:
    branches: [ci/fantadesk-campionato-b22-b26-rc1-20261027]
    paths:
      - .github/workflows/fantadesk-rc1-full-baseline-comparison.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-main-baseline:
    name: Original MAIN complete Vitest suite, same settings as RC1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRIVATE_SHA: 'f631099d38daea3220637ce5c64488cb6d1cdef3'
      FANTADESK_PUBLIC_WEB_BUILD: 'true'
      VITE_NEXUS_PRIVATE_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Ensure actual main baseline
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install baseline
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Run complete baseline Vitest
        working-directory: private-app
        run: npm run test:run -- --maxWorkers=3

  target-rc1-isolated:
    name: RC1 TARGETS persistence regression without other suites
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRIVATE_SHA: '30b9493ca8e8080ac951b8b5415aa5ceb08b667c'
      FANTADESK_PUBLIC_WEB_BUILD: 'true'
      VITE_NEXUS_PRIVATE_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Ensure actual RC1
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install candidate
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Isolated TARGETS persistence tests
        working-directory: private-app
        run: npm run test:run -- src/features/targets/targetRepository.test.ts --maxWorkers=1

# No database writes, no private CI, no change to production or candidate SHA.
