name: Audit FantaDesk D5-D13 PitchAPI Pure Logic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-fantadesk-pitchapi-d5-d6.yml'

permissions:
  contents: read

jobs:
  data-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require private checkout credential
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          ref: 096820806c94a54a6fb57bb24beeca70a3dd4db3
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact reviewed SHA
        run: test "$(git rev-parse HEAD)" = "096820806c94a54a6fb57bb24beeca70a3dd4db3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Compile JS syntax
        run: |
          node --check scripts/data/pitchapi-d5-core.mjs
          node --check scripts/data/pitchapi-d5-source.mjs
          node --check scripts/data/pitchapi-d6-identity-review.mjs
          node --check scripts/data/pitchapi-d7-league-candidate-qa.mjs
          node --check scripts/data/pitchapi-d8-temporal-census.mjs
          node --check scripts/data/pitchapi-d8-secondary-alias-review.mjs
          node --check scripts/data/pitchapi-d9-global-identity-audit.mjs
          node --check scripts/data/pitchapi-d9-transfer-evidence.mjs
          node --check scripts/data/pitchapi-d10-listone-diff.mjs
          node --check scripts/data/pitchapi-d10-review-queue.mjs
          node --check scripts/data/pitchapi-d10-official-html-parser.mjs
          node --check scripts/data/pitchapi-d10-candidate-universe.mjs
          node --check scripts/data/pitchapi-d11-prioritized-review.mjs
          node --check scripts/data/pitchapi-d12-evidence-review.mjs
          node --check scripts/data/pitchapi-d12-review-cli.mjs
          node --check scripts/data/pitchapi-d13-review-access.mjs
          node --check api/identity-review-d13.js
      - name: D5-D13 offline authenticated reviewer policy and QA
        run: node --test scripts/data/pitchapi-d5-core.test.mjs scripts/data/pitchapi-d6-identity-review.test.mjs scripts/data/pitchapi-d7-league-candidate-qa.test.mjs scripts/data/pitchapi-d7-audit-report.test.mjs scripts/data/pitchapi-d8-temporal-census.test.mjs scripts/data/pitchapi-d8-secondary-alias-review.test.mjs scripts/data/pitchapi-d8-audit-report.test.mjs scripts/data/pitchapi-d9-global-identity-audit.test.mjs scripts/data/pitchapi-d9-transfer-evidence.test.mjs scripts/data/pitchapi-d9-audit-report.test.mjs scripts/data/pitchapi-d10-listone-diff.test.mjs scripts/data/pitchapi-d10-review-queue.test.mjs scripts/data/pitchapi-d10-official-html-parser.test.mjs scripts/data/pitchapi-d10-candidate-universe.test.mjs scripts/data/pitchapi-d10-audit-report.test.mjs scripts/data/pitchapi-d11-prioritized-review.test.mjs scripts/data/pitchapi-d11-audit-report.test.mjs scripts/data/pitchapi-d12-evidence-review.test.mjs scripts/data/pitchapi-d12-review-cli.test.mjs scripts/data/pitchapi-d12-audit-report.test.mjs scripts/data/pitchapi-d13-review-access.test.mjs scripts/data/pitchapi-d13-ui-boundary.test.mjs scripts/data/pitchapi-d13-audit-report.test.mjs
