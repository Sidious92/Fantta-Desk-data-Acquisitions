name: F2 Understat Duplicate Event Probe v1

on:
  push:
    branches:
      - feat/f2-understat-player-match-temporal-probe
    paths:
      - '.github/workflows/f2-understat-duplicate-event-probe-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f2-understat-player-match-temporal-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen full reconstruction
        uses: actions/download-artifact@v4
        with:
          name: nexus-f2-understat-full-reconstruction-v1-1
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Sidious92/Fantta-Desk-data-Acquisitions
          run-id: '32663544437'
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          f='source/nexus-f2-understat-full-reconstruction-v1-1.tar.gz'
          [ "$(sha256sum "$f" | awk '{print $1}')" = '00a60a8a8b645e9bf171a354a4adb547c85b70085974596b093ea3dd7d5b329c' ]
          mkdir -p input
          tar -xzf "$f" -C input
      - name: Run independent duplicate-event probe
        id: probe
        shell: bash
        run: |
          mkdir -p .nexus-f2-understat-duplicate-event-probe-v1
          set +e
          python scripts/nexus-f2-probe-understat-duplicate-events-v1.py \
            --input-root input/combined \
            --output-root .nexus-f2-understat-duplicate-event-probe-v1 \
            2>&1 | tee .nexus-f2-understat-duplicate-event-probe-v1/RUN.log
          code=${PIPESTATUS[0]}
          echo "$code" > .nexus-f2-understat-duplicate-event-probe-v1/EXIT_CODE.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package probe
        if: always()
        shell: bash
        run: |
          tar -czf nexus-f2-understat-duplicate-event-probe-v1.tar.gz .nexus-f2-understat-duplicate-event-probe-v1
          sha256sum nexus-f2-understat-duplicate-event-probe-v1.tar.gz > .nexus-f2-understat-duplicate-event-probe-v1/PACKAGE_SHA256.txt
          printf '%s\n' '${{ github.run_id }}' > .nexus-f2-understat-duplicate-event-probe-v1/RUN_ID.txt
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-f2-understat-duplicate-event-probe-v1
          path: |
            nexus-f2-understat-duplicate-event-probe-v1.tar.gz
            .nexus-f2-understat-duplicate-event-probe-v1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Persist probe status
        if: always()
        shell: bash
        run: |
          mkdir -p .nexus-f2-understat-duplicate-event-probe-v1-status
          for f in DUPLICATE_EVENT_PROBE.json RUN.log EXIT_CODE.txt PACKAGE_SHA256.txt RUN_ID.txt; do
            if [ -f ".nexus-f2-understat-duplicate-event-probe-v1/$f" ]; then cp ".nexus-f2-understat-duplicate-event-probe-v1/$f" ".nexus-f2-understat-duplicate-event-probe-v1-status/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .nexus-f2-understat-duplicate-event-probe-v1-status
          if ! git diff --cached --quiet; then
            git commit -m 'nexus f2: persist duplicate-event probe v1 [skip ci]'
            git push origin HEAD:feat/f2-understat-player-match-temporal-probe
          fi
      - name: Enforce probe
        if: always()
        shell: bash
        run: |
          code='${{ steps.probe.outputs.exit_code }}'
          [ -n "$code" ] || exit 1
          [ "$code" = '0' ] || exit "$code"
