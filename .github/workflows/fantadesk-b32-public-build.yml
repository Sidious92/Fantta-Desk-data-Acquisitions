name: FantaDesk B32 - fast public web build
on:
  push:
    branches: [ci/fantadesk-b32-round-seal-review-20261027]
    paths: [.github/workflows/fantadesk-b32-public-build.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  unit-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_SHA: '228f3d161bc89569df323490ab0ca7d675ceeedd'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Verify exact code
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Public Vite build
        working-directory: private-app
        env:
          FANTADESK_PUBLIC_WEB_BUILD: 'true'
          VITE_NEXUS_PRIVATE_DATA_ENABLED: 'false'
        run: npm run build
      - name: Public asset boundary
        working-directory: private-app
        run: node scripts/assert-public-web-dist.mjs
      - name: Strict TypeScript
        working-directory: private-app
        run: npm run typecheck
