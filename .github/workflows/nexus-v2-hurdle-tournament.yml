name: Nexus v2 Hurdle Tournament

on:
  workflow_dispatch:
  push:
    paths:
      - '.nexus-v2-hurdle-launch/EXECUTE'

permissions:
  contents: read
  actions: read

jobs:
  family:
    strategy:
      fail-fast: false
      matrix:
        target: [GOALS, ASSISTS]
        family:
          - RIDGE
          - ELASTIC_NET
          - HUBER
          - POISSON_REGRESSION
          - RANDOM_FOREST
          - EXTRA_TREES
          - HIST_GRADIENT_BOOSTING
          - HIST_GRADIENT_BOOSTING_POISSON
          - XGBOOST
          - XGBOOST_POISSON
          - LIGHTGBM
          - LIGHTGBM_POISSON
          - CATBOOST
          - CATBOOST_POISSON
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fixed private authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: e91ded9ef26ee9326a55c68b07cd56b3971a2c82
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "e91ded9ef26ee9326a55c68b07cd56b3971a2c82"
          test -f fantadesk-private/data/nexus/research-v2/events/nexus-v2-hurdle-tournament-protocol-v1.json
          test -f fantadesk-private/scripts/nexus-v2-hurdle-family.py
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Install pinned environment
        shell: bash
        run: |
          python -m pip install --no-cache-dir \
            numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 \
            joblib==1.5.3 threadpoolctl==3.6.0 orjson==3.11.9 \
            xgboost==3.1.3 lightgbm==4.6.0 catboost==1.2.8
      - name: Materialize exact private base inputs
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: bash fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh
      - name: Rebuild exact Minutes and event surfaces
        shell: bash
        run: |
          set -euo pipefail
          cp fantadesk-private/scripts/nexus-v2-minutes-surface-one.py /mnt/data/minutes_surface_one.py
          for season in 2021-22 2022-23 2023-24 2024-25 2025-26; do python fantadesk-private/scripts/nexus-v2-precompute-usage-cache.py "$season"; done
          python fantadesk-private/scripts/nexus-v2-build-minutes-surface-cached.py
          echo "5898b2c01490e9a1ab21e19c159c4ba51fadbd300470f19e31f6384da13d4f2c  /mnt/data/nexus_v2_minutes_roster_surface.csv" | sha256sum --check --strict
          python fantadesk-private/scripts/nexus-v2-build-event-roster-surface.py
          echo "09022f38648708268e424877e7f2f473f48a84ecaa7a399afbc9fb372c36dfd2  /mnt/data/nexus_v2_event_roster_surface.csv" | sha256sum --check --strict
      - name: Run hurdle family
        shell: bash
        run: python fantadesk-private/scripts/nexus-v2-hurdle-family.py "${{ matrix.target }}" "${{ matrix.family }}"
      - name: Validate sanitized family result
        shell: bash
        run: |
          set -euo pipefail
          SRC="/mnt/data/hurdle_${{ matrix.target }}_${{ matrix.family }}.json"; test -f "$SRC";mkdir -p output;cp "$SRC" output/result.json
          python - <<'PY'
          import json
          p=json.load(open('output/result.json'));assert p['status']=='COMPLETE';assert p['event_surface_hash']=='09022f38648708268e424877e7f2f473f48a84ecaa7a399afbc9fb372c36dfd2';assert p['no_player_rows'] is True
          expected=72 if p['family'] in {'RIDGE','ELASTIC_NET','HUBER','POISSON_REGRESSION'} else 24
          assert p['configs']==expected and len(p['results'])==expected
          assert all(r['pooled']['n']==970 for r in p['results'])
          print('HURDLE_FAMILY=PASS',p['target'],p['family'],p['configs'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hurdle-${{ matrix.target }}-${{ matrix.family }}
          path: output/result.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: family
    if: ${{ always() && needs.family.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: hurdle-*
          path: hurdle-artifacts
          merge-multiple: false
      - name: Validate 28/28 and rank
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,os
          files=glob.glob('hurdle-artifacts/**/result.json',recursive=True)
          if len(files)!=28:raise SystemExit(f'HURDLE_STATUS=INCOMPLETE {len(files)}/28')
          rows=[];seen=set();total=0
          for fn in files:
              p=json.load(open(fn));key=(p['target'],p['family']);assert p['status']=='COMPLETE' and p['no_player_rows'] is True
              if key in seen:raise SystemExit('duplicate '+str(key))
              seen.add(key);rows.extend(p['results']);total+=p['configs']
          if total!=1056 or len(rows)!=1056:raise SystemExit(f'HURDLE_CONFIG_COUNT={total}/{len(rows)}')
          best={}
          for target in ['GOALS','ASSISTS']:
              rr=[r for r in rows if r['target']==target];rr.sort(key=lambda r:(r['pooled']['mae'],r['pooled']['rmse'],abs(r['pooled']['bias']),r['fold_mae_sd']));best[target]=rr[0]
          out={'status':'HURDLE_STAGE1_COMPLETE','event_surface_hash':'09022f38648708268e424877e7f2f473f48a84ecaa7a399afbc9fb372c36dfd2','validated_blocks':28,'validated_configs':1056,'target_best':best,'ranking':rows,'2025-26':'NOT_USED','no_player_rows':True}
          os.makedirs('hurdle-summary',exist_ok=True);json.dump(out,open('hurdle-summary/hurdle-stage1-summary.json','w'),separators=(',',':'))
          for t,r in best.items():print(t,r['family'],r['feature_set'],r['classifier_level'],r['scorer_level'],r['pooled']['mae'],r['pooled']['rmse'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-hurdle-stage1-summary
          path: hurdle-summary/hurdle-stage1-summary.json
          if-no-files-found: error
          retention-days: 7
