name: Nexus Crossleague Career Provider Probe v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-crossleague-career-provider-probe-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo mkdir -p /mnt/data/nexus-crossleague-career-provider-probe-v1 && sudo chown -R $USER:$USER /mnt/data
      - run: timeout 15m python scripts/probe_crossleague_career_providers_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-crossleague-career-provider-probe-v1
          path: /mnt/data/nexus-crossleague-career-provider-probe-v1
          if-no-files-found: warn
      - name: Record result
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-crossleague-career-provider-probe-v1-status
          if [ -f /mnt/data/nexus-crossleague-career-provider-probe-v1/RESULT.json ]; then
            cp /mnt/data/nexus-crossleague-career-provider-probe-v1/RESULT.json .nexus-crossleague-career-provider-probe-v1-status/RESULT.json
          else
            printf '{"schema":"NEXUS_CROSSLEAGUE_CAREER_PROVIDER_PROBE_V1","status":"NO_RESULT_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-crossleague-career-provider-probe-v1-status/RESULT.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-crossleague-career-provider-probe-v1-status/RESULT.json
          git commit -m 'ci: record crossleague career provider probe v1' || exit 0
          git push origin HEAD:main
