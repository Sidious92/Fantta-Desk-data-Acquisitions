name: Nexus GOALS Individual Arithmetic v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-goals-individual-arithmetic-v1-launch/EXECUTE'

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTHORITY_SHA: 2958e4ae7bb8c667d07a4e49c658ed55168db017

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6
        with:
          path: runner-public
          persist-credentials: false

      - name: Checkout fixed private authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false

      - name: Verify authority and output encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh
          test -f fantadesk-private/scripts/nexus-v2-build-live-feature-surface-2026-27.py
          test -f fantadesk-private/scripts/nexus-acquire-current-listone-2026-27.mjs
          test -f runner-public/scripts/nexus-v2-acquire-understat-2025-all-leagues-ajax.mjs
          test -f runner-public/.nexus-v2-public/goals-trajectory-review-cert.pem
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned jsdom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-node
          cd /tmp/nexus-node
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund jsdom@30.0.1
          mkdir -p "$GITHUB_WORKSPACE/fantadesk-private/node_modules"
          ln -s /tmp/nexus-node/node_modules/jsdom "$GITHUB_WORKSPACE/fantadesk-private/node_modules/jsdom"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install --no-cache-dir pandas==2.2.3 numpy==2.3.5 orjson==3.11.9

      - name: Materialize canonical identity/history inputs
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: bash fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh

      - name: Acquire current Listone 2026-27
        working-directory: fantadesk-private
        env:
          NEXUS_LIVE_LISTONE_OUTPUT_ROOT: /mnt/data/current-listone-capture
        run: node scripts/nexus-acquire-current-listone-2026-27.mjs

      - name: Acquire foreign 2025-26 identity support
        working-directory: runner-public
        env:
          NEXUS_V2_UNDERSTAT_2025_OUTPUT_ROOT: /mnt/data/understat-2025-capture
        run: node scripts/nexus-v2-acquire-understat-2025-all-leagues-ajax.mjs

      - name: Build usage caches required by identity surface
        shell: bash
        run: |
          set -euo pipefail
          for season in 2023-24 2024-25 2025-26; do
            python fantadesk-private/scripts/nexus-v2-precompute-usage-cache.py "$season"
          done

      - name: Build current identity surface
        shell: bash
        env:
          NEXUS_V2_CURRENT_LISTONE: /mnt/data/current-listone-capture/current-listone.json
          NEXUS_V2_UNDERSTAT_2025_FOREIGN: /mnt/data/understat-2025-capture/understat-foreign-2025.json
          NEXUS_V2_LIVE_FEATURE_OUT: /mnt/data/live_identity_surface.csv
          NEXUS_V2_LIVE_FEATURE_AUDIT: /mnt/data/live_identity_surface_audit.json
        run: python fantadesk-private/scripts/nexus-v2-build-live-feature-surface-2026-27.py

      - name: Acquire cross-league player-season/stint source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/vibedatascience/understat_players_aggregated/main/understat_players_aggregated_2014_td.csv \
            -o /mnt/data/understat_players_aggregated_2014_td.csv
          sha256sum /mnt/data/understat_players_aggregated_2014_td.csv | tee /mnt/data/understat_source_sha256.txt

      - name: Calculate player-only GOALS arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, unicodedata, hashlib
          from pathlib import Path
          import numpy as np
          import pandas as pd

          YEARS=[2021,2022,2023,2024,2025]
          SEASON={2021:'2021-22',2022:'2022-23',2023:'2023-24',2024:'2024-25',2025:'2025-26'}

          def norm(s):
              s=unicodedata.normalize('NFKD',str(s or ''))
              s=''.join(c for c in s if not unicodedata.combining(c)).lower()
              s=re.sub(r'\b(ac|fc|ssc|us|as|calcio|1909|1913|1907|1908|1920)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s).strip()
              return re.sub(r'\s+',' ',s)

          aliases={
            'milan':{'milan'}, 'inter':{'inter','internazionale'}, 'roma':{'roma'},
            'juventus':{'juventus'}, 'napoli':{'napoli'}, 'atalanta':{'atalanta'},
            'bologna':{'bologna'}, 'fiorentina':{'fiorentina'}, 'lazio':{'lazio'},
            'torino':{'torino'}, 'udinese':{'udinese'}, 'genoa':{'genoa'},
            'cagliari':{'cagliari'}, 'parma':{'parma'}, 'sassuolo':{'sassuolo'},
            'como':{'como'}, 'lecce':{'lecce'}, 'verona':{'verona','hellas verona'},
            'hellas verona':{'verona','hellas verona'},
          }

          def team_match(current, historic):
              a=norm(current); b=norm(historic)
              if not a or not b: return False
              if a==b: return True
              aa=aliases.get(a,{a})
              bb=aliases.get(b,{b})
              if aa & bb: return True
              return a in b or b in a

          roster=json.load(open('/mnt/data/current-listone-capture/current-listone.json'))['players']
          identity=pd.read_csv('/mnt/data/live_identity_surface.csv',low_memory=False)
          us=pd.read_csv('/mnt/data/understat_players_aggregated_2014_td.csv',low_memory=False)
          us['id']=us['id'].astype(str)
          us['year']=pd.to_numeric(us['year'],errors='coerce').astype('Int64')
          us['games']=pd.to_numeric(us['games'],errors='coerce').fillna(0.0)
          us['goals']=pd.to_numeric(us['goals'],errors='coerce').fillna(0.0)
          us=us[us.year.isin(YEARS)].copy()

          by_fid={int(r.fantacalcio_id):r for _,r in identity.iterrows()}
          rows=[]
          for p in roster:
              fid=int(p.get('playerId') or p.get('fantacalcioId'))
              name=str(p.get('name') or '')
              team=str(p.get('club') or p.get('team') or '')
              role=str(p.get('classicRole') or p.get('role') or '')
              ir=by_fid.get(fid)
              uid=''
              method='UNRESOLVED'
              if ir is not None:
                  raw=ir.get('understat_id','')
                  if pd.notna(raw): uid=str(raw).strip().replace('.0','')
                  method=str(ir.get('understat_resolution_method','UNRESOLVED'))
              pu=us[us.id.eq(uid)].copy() if uid else us.iloc[0:0].copy()

              seasons=[]
              for y in YEARS:
                  z=pu[pu.year.eq(y)]
                  games=float(z.games.sum())
                  goals=float(z.goals.sum())
                  clubs=sorted(set(str(x) for x in z.get('team_title',pd.Series([],dtype=str)).dropna().tolist()))
                  pace=goals/games*38.0 if games>0 else None
                  seasons.append({'season':SEASON[y],'games':games,'goals':goals,'goals_per_game':goals/games if games>0 else None,'pace_38':pace,'clubs':clubs})

              z5=pu[pu.year.isin(YEARS)]
              g5=float(z5.games.sum()); go5=float(z5.goals.sum())
              pace5=go5/g5*38.0 if g5>0 else None

              z3=pu[pu.year.isin([2023,2024,2025])]
              g3=float(z3.games.sum()); go3=float(z3.goals.sum())
              pace3=go3/g3*38.0 if g3>0 else None

              recent=None; recent_source=None; recent_games=None; recent_goals=None
              z25=pu[pu.year.eq(2025)].copy()
              if len(z25) and 'team_title' in z25.columns:
                  cur=z25[z25.team_title.map(lambda x: team_match(team,x))]
                  cg=float(cur.games.sum()); cgo=float(cur.goals.sum())
                  if cg>0:
                      recent=cgo/cg*38.0; recent_source='CURRENT_CLUB_2025_26'; recent_games=cg; recent_goals=cgo
              if recent is None:
                  for y in [2025,2024,2023,2022,2021]:
                      z=pu[pu.year.eq(y)]
                      gg=float(z.games.sum()); ggo=float(z.goals.sum())
                      if gg>0:
                          recent=ggo/gg*38.0; recent_source=f'LATEST_AVAILABLE_{SEASON[y]}'; recent_games=gg; recent_goals=ggo
                          break

              refs=[x for x in [pace5,pace3,recent] if x is not None and np.isfinite(x)]
              pred=float(np.mean(refs)) if refs else None
              rows.append({
                'fantacalcio_id':fid,'player_name':name,'team':team,'role':role,
                'understat_id':uid or None,'identity_method':method,
                'seasons':seasons,
                'pace_5y_38':pace5,'pace_last3_38':pace3,
                'pace_recent_38':recent,'recent_source':recent_source,
                'recent_games':recent_games,'recent_goals':recent_goals,
                'goals_prediction':pred,'reference_count':len(refs),
              })

          def clean(v):
              if isinstance(v,float) and (np.isnan(v) or np.isinf(v)): return None
              return v
          for r in rows:
              for k,v in list(r.items()):
                  if k!='seasons': r[k]=clean(v)
              for s in r['seasons']:
                  for k,v in list(s.items()): s[k]=clean(v)

          ranked=sorted([r for r in rows if r['goals_prediction'] is not None],key=lambda r:(-r['goals_prediction'],r['fantacalcio_id']))
          for i,r in enumerate(ranked,1): r['rank']=i
          rankmap={r['fantacalcio_id']:r['rank'] for r in ranked}
          for r in rows: r['rank']=rankmap.get(r['fantacalcio_id'])

          source_sha=hashlib.sha256(Path('/mnt/data/understat_players_aggregated_2014_td.csv').read_bytes()).hexdigest()
          out={
            'schema':'NEXUS_GOALS_INDIVIDUAL_ARITHMETIC_V1',
            'status':'DIAGNOSTIC_ARITHMETIC_NO_MODEL',
            'target_season':'2026-27',
            'formula':{
              'pace_5y_38':'sum(goals 2021-22..2025-26) / sum(games) * 38',
              'pace_last3_38':'sum(goals 2023-24..2025-26) / sum(games) * 38',
              'pace_recent_38':'2025-26 current-club goals/games * 38 when available, otherwise latest available season goals/games * 38',
              'goals_prediction':'arithmetic mean of available pace_5y_38, pace_last3_38, pace_recent_38',
            },
            'explicitly_not_used':['xG','npxG','xA','shots','minutes','expected_minutes','role_normalization','league_normalization','other_players','ML'],
            'understat_source_sha256':source_sha,
            'roster_rows':len(rows),
            'predicted_rows':sum(r['goals_prediction'] is not None for r in rows),
            'no_prediction_rows':sum(r['goals_prediction'] is None for r in rows),
            'players':sorted(rows,key=lambda r:r['fantacalcio_id']),
            'ranking':ranked,
          }
          Path('/mnt/data/nexus_goals_individual_arithmetic_v1.json').write_text(json.dumps(out,separators=(',',':')))

          flat=[]
          for r in ranked:
              q={k:r.get(k) for k in ['rank','fantacalcio_id','player_name','team','role','goals_prediction','pace_5y_38','pace_last3_38','pace_recent_38','recent_source','recent_games','recent_goals','reference_count']}
              for s in r['seasons']:
                  key=s['season'].replace('-','_')
                  q[f'{key}_games']=s['games']; q[f'{key}_goals']=s['goals']; q[f'{key}_pace38']=s['pace_38']
              flat.append(q)
          pd.DataFrame(flat).to_csv('/mnt/data/nexus_goals_individual_arithmetic_v1.csv',index=False)

          print('CALCULATION=PASS')
          print('ROSTER',len(rows),'PREDICTED',len(ranked),'NO_PRED',len(rows)-len(ranked))
          for r in ranked[:20]:
              print(r['rank'],r['player_name'],r['team'],round(r['goals_prediction'],2),round(r['pace_5y_38'],2) if r['pace_5y_38'] is not None else None,round(r['pace_last3_38'],2) if r['pace_last3_38'] is not None else None,round(r['pace_recent_38'],2) if r['pace_recent_38'] is not None else None,r['recent_source'])
          PY

      - name: Encrypt outputs before upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-output
          for f in nexus_goals_individual_arithmetic_v1.json nexus_goals_individual_arithmetic_v1.csv; do
            openssl cms -encrypt -binary -aes256 \
              -in "/mnt/data/$f" -outform DER \
              -out "encrypted-output/$f.p7m" \
              runner-public/.nexus-v2-public/goals-trajectory-review-cert.pem
            rm -f "/mnt/data/$f"
          done

      - name: Upload encrypted outputs
        uses: actions/upload-artifact@v4
        with:
          name: nexus-goals-individual-arithmetic-v1-encrypted
          path: encrypted-output/*.p7m
          if-no-files-found: error
          retention-days: 1
