name: CI FantaDesk Auction Helper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-fantadesk-auction-helper.yml
  workflow_dispatch:
    inputs:
      fantadesk_ref:
        description: FantaDesk ref to validate
        required: true
        default: exp/nomination-advisor-v2-high-complexity

permissions:
  contents: read

jobs:
  validate-auction-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Require private-repo token
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"

      - name: Checkout private FantaDesk authority
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ github.event.inputs.fantadesk_ref || 'exp/nomination-advisor-v2-high-complexity' }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Bootstrap dependencies
        working-directory: app
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts
          npm ci --legacy-peer-deps --ignore-scripts

      - name: Call engine + Advisor V2 real-listone audits
        working-directory: app
        run: npx vitest run src/features/auction/auctionCallOrder.test.ts src/features/auction/auctionCallOrder.gapRecovery.test.ts src/features/auction/auctionCallOrder.simulation.test.ts src/features/auction/nominationAdvisorV2.real.test.ts

      - name: Typecheck
        working-directory: app
        run: npx tsc -b

      - name: Web build
        working-directory: app
        run: npx vite build --base=./

# experimental validation target: exp/nomination-advisor-v2-high-complexity · simple roster-workload correction over refined timing/depth model
