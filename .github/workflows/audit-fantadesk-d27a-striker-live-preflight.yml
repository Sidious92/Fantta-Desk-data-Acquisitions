name: D27-A StrikerAPI Serie A 2026/27 Secret Preflight - 2 credits max
on:
  push:
    paths:
      - .github/workflows/audit-fantadesk-d27a-striker-live-preflight.yml
permissions:
  contents: read
concurrency:
  group: d27a-striker-one-time
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both configured secrets
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: |
          test -n "$FANTADESK_READ_TOKEN"
          test -n "$STRIKERAPI_API_KEY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          ref: f350888e9e8b467b6033351c6fed3bf64915a0ee
          path: private
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
      - name: Assert pinned audited private SHA
        run: test "$(git -C private rev-parse HEAD)" = "f350888e9e8b467b6033351c6fed3bf64915a0ee"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Validate D27-A syntax and existing contracts
        run: |
          node --check private/scripts/data/d27a-striker-free-live-fixtures-probe.mjs
          node --test private/scripts/data/d27-striker-source-qa.test.mjs
      - name: One real Serie A 2026/27 fixture call, 2 credits max, aggregate-only
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
          D27_ALLOW_TWO_CREDITS: '1'
        run: node private/scripts/data/d27a-striker-free-live-fixtures-probe.mjs
