name: Nexus Base Stats Individual Arithmetic v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-base-stats-individual-arithmetic-v1-launch/EXECUTE'

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTHORITY_SHA: 11c3fa84f0b11b10d0aebad2d17633b1876cae3d

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6
        with:
          path: runner-public
          persist-credentials: false

      - name: Checkout fixed private authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false

      - name: Verify authority and governance files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/scripts/nexus-base-stats-individual-arithmetic-v1.py
          test -f fantadesk-private/data/nexus/research-v3/base-stats-arithmetic/nexus-base-stats-individual-arithmetic-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          test -f fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh
          test -f fantadesk-private/scripts/nexus-v2-build-live-feature-surface-2026-27.py
          test -f fantadesk-private/scripts/nexus-v2-minutes-surface-one.py
          test -f fantadesk-private/scripts/nexus-acquire-current-listone-2026-27.mjs
          test -f runner-public/scripts/nexus-v2-acquire-understat-2025-all-leagues-ajax.mjs
          test -f runner-public/.nexus-v2-public/goals-trajectory-review-cert.pem
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned jsdom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-node
          cd /tmp/nexus-node
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund jsdom@30.0.1
          mkdir -p "$GITHUB_WORKSPACE/fantadesk-private/node_modules"
          ln -s /tmp/nexus-node/node_modules/jsdom "$GITHUB_WORKSPACE/fantadesk-private/node_modules/jsdom"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install --no-cache-dir pandas==2.2.3 numpy==2.3.5 orjson==3.11.9

      - name: Materialize canonical historical inputs
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: bash fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh

      - name: Audit normalized Fantacalcio source schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/mnt/data/nexus_v2_predictive_research/source_artifacts/nexus-fantasy-history-v2/normalized/fantacalcio')
          keys=set()
          for season in ['2021-22','2022-23','2023-24','2024-25','2025-26']:
              rows=json.load(open(root/season/'season-summary.json'))['rows']
              for row in rows[:50]: keys.update(row.keys())
          print('FANTACALCIO_NORMALIZED_FIELDS=' + ','.join(sorted(keys)))
          PY

      - name: Acquire current Listone 2026-27
        working-directory: fantadesk-private
        env:
          NEXUS_LIVE_LISTONE_OUTPUT_ROOT: /mnt/data/current-listone-capture
        run: node scripts/nexus-acquire-current-listone-2026-27.mjs

      - name: Acquire foreign 2025-26 identity support
        working-directory: runner-public
        env:
          NEXUS_V2_UNDERSTAT_2025_OUTPUT_ROOT: /mnt/data/understat-2025-capture
        run: node scripts/nexus-v2-acquire-understat-2025-all-leagues-ajax.mjs

      - name: Build usage caches required by canonical identity surface
        shell: bash
        run: |
          set -euo pipefail
          cp fantadesk-private/scripts/nexus-v2-minutes-surface-one.py /mnt/data/minutes_surface_one.py
          for season in 2023-24 2024-25 2025-26; do
            python fantadesk-private/scripts/nexus-v2-precompute-usage-cache.py "$season"
          done

      - name: Build canonical current feature surface
        shell: bash
        env:
          NEXUS_V2_CURRENT_LISTONE: /mnt/data/current-listone-capture/current-listone.json
          NEXUS_V2_UNDERSTAT_2025_FOREIGN: /mnt/data/understat-2025-capture/understat-foreign-2025.json
          NEXUS_V2_LIVE_FEATURE_OUT: /mnt/data/live_identity_surface.csv
          NEXUS_V2_LIVE_FEATURE_AUDIT: /mnt/data/live_identity_surface_audit.json
        run: python fantadesk-private/scripts/nexus-v2-build-live-feature-surface-2026-27.py

      - name: Calculate all base statistics in one pass
        shell: bash
        env:
          NEXUS_BASE_STATS_LISTONE: /mnt/data/current-listone-capture/current-listone.json
          NEXUS_BASE_STATS_SURFACE: /mnt/data/live_identity_surface.csv
          NEXUS_BASE_STATS_OUT_ROOT: /mnt/data/nexus-base-stats-arithmetic-v1
        run: |
          set -euo pipefail
          python fantadesk-private/scripts/nexus-base-stats-individual-arithmetic-v1.py
          test -s /mnt/data/nexus-base-stats-arithmetic-v1/nexus-base-stats-individual-arithmetic-v1-report.json
          test -s /mnt/data/nexus-base-stats-arithmetic-v1/nexus-base-stats-individual-arithmetic-v1-summary.csv
          test -s /mnt/data/nexus-base-stats-arithmetic-v1/nexus-base-stats-individual-arithmetic-v1-review-long.csv
          test -s /mnt/data/nexus-base-stats-arithmetic-v1/nexus-base-stats-individual-arithmetic-v1-coverage.json

      - name: Validate invariants and GOALS regression semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          root='/mnt/data/nexus-base-stats-arithmetic-v1'
          report=json.load(open(f'{root}/nexus-base-stats-individual-arithmetic-v1-report.json'))
          long=pd.read_csv(f'{root}/nexus-base-stats-individual-arithmetic-v1-review-long.csv',low_memory=False)
          summary=pd.read_csv(f'{root}/nexus-base-stats-individual-arithmetic-v1-summary.csv',low_memory=False)
          surface=pd.read_csv('/mnt/data/live_identity_surface.csv',low_memory=False)
          roster=json.load(open('/mnt/data/current-listone-capture/current-listone.json'))['players']
          assert report['schema']=='NEXUS_BASE_STATS_INDIVIDUAL_ARITHMETIC_V1'
          assert report['status']=='DIAGNOSTIC_ARITHMETIC_NO_MODEL'
          assert len(report['statistics'])==12
          assert len(summary)==len(roster)
          assert len(long)==len(roster)*12
          assert set(long.statistic.unique())==set(report['statistics'])
          assert 'league_normalization' in report['explicitly_forbidden']
          assert 'reliability_weights' in report['explicitly_forbidden']
          assert 'machine_learning' in report['explicitly_forbidden']
          by_fid={int(r.fantacalcio_id):r for _,r in surface.iterrows()}
          goals={int(r.fantacalcio_id):r for _,r in long[long.statistic.eq('GOALS')].iterrows()}
          def n(r,k):
              if r is None or k not in r.index: return None
              v=pd.to_numeric(pd.Series([r.get(k,np.nan)]),errors='coerce').iloc[0]
              return None if pd.isna(v) else float(v)
          def pace(g,m): return g/m*38.0 if g is not None and m is not None and m>0 else None
          for p in roster:
              fid=int(p.get('playerId') or p.get('fantacalcioId')); r=by_fid.get(fid); obs=[]
              for lag in [5,4,3,2,1]: obs.append((lag,n(r,f'lag{lag}_all_goals'),n(r,f'lag{lag}_all_games')))
              five=[x for x in obs if x[1] is not None and x[2] is not None and x[2]>0]; three=[x for x in five if x[0] in {3,2,1}]
              c5=pace(sum(x[1] for x in five),sum(x[2] for x in five)) if five else None
              c3=pace(sum(x[1] for x in three),sum(x[2] for x in three)) if three else None
              recent=None; sg=n(r,'lag1_sa_games'); sv=n(r,'lag1_sa_goals')
              if sg is not None and sg>0 and sv is not None: recent=pace(sv,sg)
              else:
                  for lag in [1,2,3,4,5]:
                      g=n(r,f'lag{lag}_all_games'); v=n(r,f'lag{lag}_all_goals')
                      if g is not None and g>0 and v is not None: recent=pace(v,g); break
              refs=[x for x in [c5,c3,recent] if x is not None and np.isfinite(x)]; expected=float(np.mean(refs)) if refs else None
              got=pd.to_numeric(pd.Series([goals[fid].prediction]),errors='coerce').iloc[0]; got=None if pd.isna(got) else float(got)
              if expected is None or got is None: assert expected is None and got is None, (fid,expected,got)
              else: assert abs(expected-got)<=1e-12, (fid,expected,got)
          print('BASE_STATS_VALIDATION=PASS',len(roster),len(long))
          PY

      - name: Encrypt player-level outputs before upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted-output
          for f in \
            nexus-base-stats-individual-arithmetic-v1-report.json \
            nexus-base-stats-individual-arithmetic-v1-summary.csv \
            nexus-base-stats-individual-arithmetic-v1-review-long.csv \
            nexus-base-stats-individual-arithmetic-v1-coverage.json; do
            openssl cms -encrypt -binary -aes256 \
              -in "/mnt/data/nexus-base-stats-arithmetic-v1/$f" \
              -outform DER -out "encrypted-output/$f.p7m" \
              runner-public/.nexus-v2-public/goals-trajectory-review-cert.pem
            rm -f "/mnt/data/nexus-base-stats-arithmetic-v1/$f"
          done

      - name: Upload encrypted unified base-stats package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-base-stats-individual-arithmetic-v1-encrypted
          path: encrypted-output/*.p7m
          if-no-files-found: error
          retention-days: 1
