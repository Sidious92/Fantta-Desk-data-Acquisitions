name: Nexus Ligue 1 Official Fantasy API Probe v7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-ligue1-official-fantasy-api-probe-v7-launch/EXECUTE'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo mkdir -p /mnt/data/nexus-ligue1-official-fantasy-api-probe-v7 && sudo chown -R $USER:$USER /mnt/data
      - run: python scripts/probe_ligue1_official_fantasy_api_v7.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-ligue1-official-fantasy-api-probe-v7
          path: /mnt/data/nexus-ligue1-official-fantasy-api-probe-v7
          if-no-files-found: warn
      - name: Record result
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-ligue1-official-fantasy-api-probe-v7-status
          if [ -f /mnt/data/nexus-ligue1-official-fantasy-api-probe-v7/RESULT.json ]; then
            cp /mnt/data/nexus-ligue1-official-fantasy-api-probe-v7/RESULT.json .nexus-ligue1-official-fantasy-api-probe-v7-status/RESULT.json
          else
            printf '{"schema":"NEXUS_LIGUE1_OFFICIAL_FANTASY_API_PUBLIC_PROBE_V7","status":"NO_RESULT_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-ligue1-official-fantasy-api-probe-v7-status/RESULT.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-ligue1-official-fantasy-api-probe-v7-status/RESULT.json
          git commit -m 'ci: record Ligue 1 official fantasy API probe v7' || exit 0
          git push origin HEAD:main
