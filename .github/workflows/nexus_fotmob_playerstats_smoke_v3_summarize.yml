name: Nexus FotMob PlayerStats Smoke v3 Summarize
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-fotmob-playerstats-smoke-v3-summary-launch/EXECUTE'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo mkdir -p /mnt/data/nexus-fotmob-playerstats-smoke-v3-summary && sudo chown -R $USER:$USER /mnt/data
      - run: python scripts/summarize_fotmob_playerstats_smoke_v3.py
      - name: Record summary
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-fotmob-playerstats-smoke-v3-summary
          if [ -f /mnt/data/nexus-fotmob-playerstats-smoke-v3-summary/SUMMARY.json ]; then
            cp /mnt/data/nexus-fotmob-playerstats-smoke-v3-summary/SUMMARY.json .nexus-fotmob-playerstats-smoke-v3-summary/SUMMARY.json
          else
            printf '{"schema":"NEXUS_FOTMOB_PLAYERSTATS_SMOKE_V3_SUMMARY","status":"NO_SUMMARY_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-fotmob-playerstats-smoke-v3-summary/SUMMARY.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-fotmob-playerstats-smoke-v3-summary/SUMMARY.json
          git commit -m 'ci: summarize FotMob playerStats smoke v3' || exit 0
          git push origin HEAD:main
