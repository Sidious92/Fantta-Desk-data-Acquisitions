name: FantaDesk B10 Security Smoke
on:
  push:
    branches: [main]
    paths:
      - .github/fantadesk-ci-target.txt
      - .github/workflows/fantadesk-b10-security-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-b10-account-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public CI controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve pinned private SHA
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < .github/fantadesk-ci-target.txt)"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid immutable SHA"; exit 1; }
          echo "PRIVATE_REF=$ref" >> "$GITHUB_ENV"
      - name: Checkout FantaDesk source ephemerally
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install dependencies
        working-directory: private-app
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify account privacy and onboarding
        working-directory: private-app
        run: |
          npx vitest run             src/db/accountScopedDatabase.test.ts             src/features/auth/authenticatedLocalBootstrap.test.ts             src/features/auth/deviceCacheIdentity.test.ts             src/features/auth/SupabaseAuthGate.test.tsx             src/lib/supabase/auth.test.ts             src/features/help/HelpPage.test.tsx
      - name: Verify types
        working-directory: private-app
        run: npx tsc -b --pretty false
