name: Nexus Post-Deadline 29 Identity Remediation A2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nexus-post-deadline-29-identity-remediation-a2.py'
      - '.github/workflows/nexus-post-deadline-29-identity-remediation-a2.yml'

permissions:
  contents: read

jobs:
  remediate-a2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - run: python -m py_compile scripts/nexus-post-deadline-29-domestic-history-recovery-v1.py scripts/nexus-post-deadline-29-identity-remediation-a2.py
      - name: Run deterministic A2 remediation
        run: python scripts/nexus-post-deadline-29-identity-remediation-a2.py
      - name: Hard gate A2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/nexus-post-deadline-29-identity-remediation-a2/summary.json').read_text())
          assert s['authority']['expectedTargets']==29
          assert s['authority']['fantacalcioSelectedTargets']==29
          assert s['transportOrSchemaGaps']==0
          assert s['allHistoryRowsHaveMinutesPlayed']
          assert not s['scientificBoundary']['modelFitPerformed']
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-post-deadline-29-identity-remediation-a2
          path: /tmp/nexus-post-deadline-29-identity-remediation-a2
          if-no-files-found: error
          retention-days: 30
