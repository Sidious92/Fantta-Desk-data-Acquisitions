name: FantaDesk Nexus Raw Predictions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-nexus-raw-predictions.yml

permissions:
  contents: read

jobs:
  raw-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private FantaDesk ephemerally
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: main
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize embedded Nexus runtime
        run: npm run nexus:runtime:build

      - name: Capture current official Listone ephemerally
        env:
          NEXUS_LIVE_LISTONE_OUTPUT_ROOT: .raw-current-listone
        run: node scripts/nexus-acquire-current-listone-2026-27.mjs

      - name: Create ephemeral raw experiment
        run: |
          cat > src/features/nexus/runtime/rawCurrentListone.integration.test.ts <<'TS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { beforeAll, describe, expect, it, vi } from 'vitest';
          import type { RosterEntry, RosterSnapshot } from '../../../db/schema';
          import { buildNexusFullSeasonPlayerIntelligenceFeatureSnapshot } from '../features/fullSeasonPlayerIntelligenceFeatureBuilder';
          import { loadCanonicalNexus2026_27Model } from '../model/canonicalPredictiveRelease';
          import { predictNexusCountStatisticalModel } from '../model/countStatisticalModels';
          import { predictNexusStatisticalModel } from '../model/statisticalModels';
          import { runNexusPredictiveIntelligence2026_27 } from '../model/predictiveIntelligenceRuntime';
          import {
            NEXUS_RUNTIME_PRIVATE_SUPPLEMENT_ASSET,
            loadNexusRuntimePrivateSupplement,
            resetNexusRuntimePrivateSupplementCacheForTests,
          } from './privateRuntimeSupplement';
          import {
            NEXUS_RUNTIME_UNIVERSE_ASSET,
            loadNexusRuntimeUniverse,
            resetNexusRuntimeUniverseCacheForTests,
          } from './runtimeUniverse';
          import { buildNexusServingDatasetForFantacalcioIds } from './servingDataset';

          type Target = 'AVERAGE_VOTE' | 'GOALS' | 'ASSISTS';
          type CurrentListone = {
            targetSeason: '2026/27'; capturedAt: string; rawSha256: string;
            players: Array<{ playerId: number; name: string; club: string; classicRole: 'P'|'D'|'C'|'A'; quotation: number; fvm: number; sourceRow: number }>;
          };

          function modelInput(entry: RosterEntry, snapshot: any, target: Target) {
            return { exampleId:`raw-unmasked:${target}:${snapshot.id}`, playerId:entry.playerId, playerName:entry.observedName, classicRole:entry.classicRole, targetSeason:entry.season, asOf:snapshot.asOf, horizon:'FULL_SEASON' as const, featureSnapshotId:snapshot.id, featureSnapshot:snapshot, target };
          }
          function feature(snapshot: any, key: string) {
            const item=snapshot.features.find((candidate:any)=>candidate.key===key);
            return item && typeof item.value==='number' && Number.isFinite(item.value) ? item.value as number : null;
          }
          function normalize(value: unknown) { return String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,''); }
          function q(values:number[], quantile:number) { if(!values.length) return null; const sorted=[...values].sort((a,b)=>a-b); const i=(sorted.length-1)*quantile; const lo=Math.floor(i),hi=Math.ceil(i),w=i-lo; return lo===hi ? sorted[lo]! : sorted[lo]!*(1-w)+sorted[hi]!*w; }
          function dist(values:Array<number|null>) { const v=values.filter((x):x is number=>typeof x==='number'&&Number.isFinite(x)); return {n:v.length,min:v.length?Math.min(...v):null,p10:q(v,.1),p25:q(v,.25),median:q(v,.5),p75:q(v,.75),p90:q(v,.9),p95:q(v,.95),max:v.length?Math.max(...v):null}; }
          function csv(value: unknown) { const s=String(value ?? ''); return /[",\n]/.test(s) ? `"${s.replaceAll('"','""')}"` : s; }

          beforeAll(async()=>{
            resetNexusRuntimeUniverseCacheForTests(); resetNexusRuntimePrivateSupplementCacheForTests();
            vi.stubGlobal('fetch',vi.fn(async(input:RequestInfo|URL)=>{
              const url=String(input); const asset=url.includes(NEXUS_RUNTIME_PRIVATE_SUPPLEMENT_ASSET) ? NEXUS_RUNTIME_PRIVATE_SUPPLEMENT_ASSET : url.includes(NEXUS_RUNTIME_UNIVERSE_ASSET) ? NEXUS_RUNTIME_UNIVERSE_ASSET : null;
              if(!asset) return new Response('not found',{status:404});
              return new Response(await readFile(resolve('public',asset),'utf8'),{status:200});
            }));
          });

          describe('current Listone raw predictions',()=>{
            it('emits unmasked model outputs and literal no-fit source baselines',async()=>{
              const roster=JSON.parse(await readFile('.raw-current-listone/current-listone.json','utf8')) as CurrentListone;
              const snapshot:RosterSnapshot={id:`raw:${roster.rawSha256}`,season:roster.targetSeason,fileName:'current-listone-live.json',sheetName:'live',rawSha256:roster.rawSha256,capturedAt:roster.capturedAt,playerCount:roster.players.length,origin:'listone_import',createdAt:roster.capturedAt};
              const entries:RosterEntry[]=roster.players.map(p=>({id:`${snapshot.id}:${p.playerId}`,snapshotId:snapshot.id,season:roster.targetSeason,playerId:p.playerId,observedName:p.name,club:p.club,classicRole:p.classicRole,outOfList:false,quotation:p.quotation,fvm:p.fvm,sourceRow:p.sourceRow,capturedAt:roster.capturedAt}));
              const [serving,supplement,runtime]=await Promise.all([buildNexusServingDatasetForFantacalcioIds(entries.map(e=>e.playerId)),loadNexusRuntimePrivateSupplement(),loadNexusRuntimeUniverse()]);
              const rawSnapshots=entries.map(entry=>buildNexusFullSeasonPlayerIntelligenceFeatureSnapshot({rosterSnapshot:snapshot,rosterEntry:entry,asOf:roster.capturedAt,history:serving.history,metrics:serving.metrics,teamEnvironment:[],coachContext:[],createdAt:roster.capturedAt}));
              const playerInputs=entries.map((entry,index)=>({playerId:entry.playerId,playerName:entry.observedName,classicRole:entry.classicRole,targetSeason:entry.season,asOf:roster.capturedAt,rosterSnapshotId:snapshot.id,snapshot:rawSnapshots[index]!}));
              const canonical=runNexusPredictiveIntelligence2026_27({players:playerInputs,metrics:serving.metrics,createdAt:roster.capturedAt});
              const engine=loadCanonicalNexus2026_27Model();
              const unmaskedMv=predictNexusStatisticalModel(engine.models.AVERAGE_VOTE,entries.map((e,i)=>modelInput(e,rawSnapshots[i]!,'AVERAGE_VOTE') as any));
              const unmaskedGoals=predictNexusCountStatisticalModel(engine.models.GOALS,entries.map((e,i)=>modelInput(e,rawSnapshots[i]!,'GOALS') as any));
              const unmaskedAssists=predictNexusCountStatisticalModel(engine.models.ASSISTS,entries.map((e,i)=>modelInput(e,rawSnapshots[i]!,'ASSISTS') as any));

              const personByKey=new Map(runtime.universe.persons.map(p=>[p.personKey,p]));
              const usById=new Map(supplement.us2025.map(row=>[String(row[0]),row]));
              const usByFantacalcio=new Map<number,(typeof supplement.us2025)[number]>();
              for(const index of runtime.universe.fantacalcioIndex){ const person=personByKey.get(index.personKey); if(!person) continue; const alias=(person.identity.providerAliases??[]).find(a=>normalize(a.provider)==='understat'); if(!alias) continue; const row=usById.get(String(alias.providerId)); if(row) usByFantacalcio.set(index.playerId,row); }
              const fcLag1=new Map<number,(typeof supplement.fc)[number]>(); const fcLag2=new Map<number,(typeof supplement.fc)[number]>();
              for(const row of supplement.fc){ if(row[1]==='2025/26') fcLag1.set(row[0],row); else if(row[1]==='2024/25') fcLag2.set(row[0],row); }

              const rows=entries.map((e,i)=>{
                const s=rawSnapshots[i]!; const us=usByFantacalcio.get(e.playerId); const f1=fcLag1.get(e.playerId); const f2=fcLag2.get(e.playerId);
                const lag1Minutes=feature(s,'event.volume.lag1.minutes'); const lag2Minutes=feature(s,'event.volume.lag2.minutes'); const lag1Goals=feature(s,'event.history.lag1.goals'); const lag2Goals=feature(s,'event.history.lag2.goals'); const lag1Assists=feature(s,'event.history.lag1.assists'); const lag2Assists=feature(s,'event.history.lag2.assists'); const lag1Mv=feature(s,'vote.history.lag1.average_vote'); const lag2Mv=feature(s,'vote.history.lag2.average_vote');
                const noFitMinutes=us?.[4] ?? lag1Minutes ?? lag2Minutes; const noFitGoals=us?.[6] ?? us?.[5] ?? lag1Goals ?? lag2Goals; const noFitAssists=us?.[9] ?? us?.[8] ?? lag1Assists ?? lag2Assists; const noFitMv=f1?.[5] ?? lag1Mv ?? f2?.[5] ?? lag2Mv ?? null;
                return {id:e.playerId,name:e.observedName,club:e.club,role:e.classicRole,quotation:e.quotation,fvm:e.fvm,canonicalMv:canonical[i]!.prediction.expectedBaseVote,canonicalGoals:canonical[i]!.prediction.expectedGoals,canonicalAssists:canonical[i]!.prediction.expectedAssists,canonicalMinutes:canonical[i]!.opportunityPrediction.value,unmaskedMv:unmaskedMv[i]!,unmaskedGoals:unmaskedGoals[i]!,unmaskedAssists:unmaskedAssists[i]!,noFitMv,noFitGoals,noFitAssists,noFitMinutes,lag1Mv,lag1Goals,lag1Assists,lag1Minutes,lag2Minutes,source2025:us?'UNDERSTAT_2025_26':f1?'FANTACALCIO_2025_26':lag1Minutes!==null?'SERIE_A_RUNTIME_2025_26':'FALLBACK_LAG2_OR_MISSING',opportunitySupport:canonical[i]!.opportunityPrediction.support,sourceRow:e.sourceRow};
              });
              const summary={definition:{unmaskedModel:'Frozen canonical coefficients (lambda=10) applied directly to raw feature snapshots BEFORE the 450-minute per90 reliability mask. This isolates the serving reliability mask; it is not a lambda=0 refit.',noFitSource:'No trained prediction model: MV=latest Fantacalcio average vote; Goals=2025/26 Understat xG (fallback observed goals/history); Assists=2025/26 Understat xA (fallback observed assists/history); Minutes=2025/26 Understat minutes (fallback latest available lag). Cross-league 2025/26 Understat is allowed here only because this is a diagnostic RAW view, never canonical routing.'},roster:{playerCount:rows.length,capturedAt:roster.capturedAt,rawSha256:roster.rawSha256},coverage:serving.coverage,goals:{canonical:dist(rows.map(r=>r.canonicalGoals)),unmaskedModel:dist(rows.map(r=>r.unmaskedGoals)),noFitSource:dist(rows.map(r=>r.noFitGoals)),canonicalGt10:rows.filter(r=>r.canonicalGoals>10).length,unmaskedGt10:rows.filter(r=>r.unmaskedGoals>10).length,noFitGt10:rows.filter(r=>(r.noFitGoals??-Infinity)>10).length,noFitGt15:rows.filter(r=>(r.noFitGoals??-Infinity)>15).length,top25NoFit:[...rows].filter(r=>r.noFitGoals!==null).sort((a,b)=>(b.noFitGoals??0)-(a.noFitGoals??0)).slice(0,25)},minutes:{canonical:dist(rows.map(r=>r.canonicalMinutes)),noFitSource:dist(rows.map(r=>r.noFitMinutes)),noFitGt2500:rows.filter(r=>(r.noFitMinutes??-Infinity)>2500).length,noFitGt3000:rows.filter(r=>(r.noFitMinutes??-Infinity)>3000).length,top20NoFit:[...rows].filter(r=>r.noFitMinutes!==null).sort((a,b)=>(b.noFitMinutes??0)-(a.noFitMinutes??0)).slice(0,20)},assists:{canonical:dist(rows.map(r=>r.canonicalAssists)),unmaskedModel:dist(rows.map(r=>r.unmaskedAssists)),noFitSource:dist(rows.map(r=>r.noFitAssists)),top20NoFit:[...rows].filter(r=>r.noFitAssists!==null).sort((a,b)=>(b.noFitAssists??0)-(a.noFitAssists??0)).slice(0,20)}};
              const headers=['id','name','club','role','quotation','fvm','raw_no_fit_mv','raw_no_fit_goals','raw_no_fit_assists','raw_no_fit_minutes','raw_unmasked_model_mv','raw_unmasked_model_goals','raw_unmasked_model_assists','canonical_mv','canonical_goals','canonical_assists','canonical_minutes','lag1_mv','lag1_goals','lag1_assists','lag1_minutes','lag2_minutes','raw_source','opportunity_support','source_row'];
              const ordered=[...rows].sort((a,b)=>(b.noFitGoals??-1)-(a.noFitGoals??-1)||(b.noFitMinutes??-1)-(a.noFitMinutes??-1));
              const csvRows=ordered.map(r=>[r.id,r.name,r.club,r.role,r.quotation,r.fvm,r.noFitMv,r.noFitGoals,r.noFitAssists,r.noFitMinutes,r.unmaskedMv,r.unmaskedGoals,r.unmaskedAssists,r.canonicalMv,r.canonicalGoals,r.canonicalAssists,r.canonicalMinutes,r.lag1Mv,r.lag1Goals,r.lag1Assists,r.lag1Minutes,r.lag2Minutes,r.source2025,r.opportunitySupport,r.sourceRow].map(csv).join(','));
              await writeFile('.raw-predictions.csv',`${headers.join(',')}\n${csvRows.join('\n')}\n`,'utf8'); await writeFile('.raw-summary.json',`${JSON.stringify(summary,null,2)}\n`,'utf8'); console.log(`RAW_NEXUS_SUMMARY=${JSON.stringify(summary)}`); expect(rows).toHaveLength(roster.players.length);
            });
          });
          TS

      - name: Run raw experiment
        run: npx vitest run src/features/nexus/runtime/rawCurrentListone.integration.test.ts --reporter=verbose

      - name: Print raw summary
        if: always()
        run: |
          if [ -f .raw-summary.json ]; then cat .raw-summary.json; fi

      - name: Upload temporary raw prediction files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fantadesk-nexus-raw-predictions
          path: |
            .raw-predictions.csv
            .raw-summary.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
