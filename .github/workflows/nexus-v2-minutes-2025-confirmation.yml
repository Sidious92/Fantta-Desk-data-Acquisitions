name: Nexus v2 Minutes 2025 Confirmation

on:
  workflow_dispatch:
  push:
    paths:
      - '.nexus-v2-minutes-2025-launch/EXECUTE'

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fixed private authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: d8367dfdcade426deea4119def6bac3974f6969b
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false

      - name: Verify authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "d8367dfdcade426deea4119def6bac3974f6969b"
          test -f fantadesk-private/data/nexus/research-v2/minutes/nexus-v2-minutes-2025-confirmation-protocol-v1.json
          test -f fantadesk-private/scripts/nexus-v2-minutes-2025-confirmation.py
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data

      - name: Setup exact Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install pinned environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir \
            numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 \
            joblib==1.5.3 threadpoolctl==3.6.0 orjson==3.11.9 \
            xgboost==3.1.3 lightgbm==4.6.0 catboost==1.2.8

      - name: Materialize exact private base inputs
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: bash fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh

      - name: Rebuild exact Minutes surface
        shell: bash
        run: |
          set -euo pipefail
          cp fantadesk-private/scripts/nexus-v2-minutes-surface-one.py /mnt/data/minutes_surface_one.py
          for season in 2021-22 2022-23 2023-24 2024-25 2025-26; do
            python fantadesk-private/scripts/nexus-v2-precompute-usage-cache.py "$season"
          done
          python fantadesk-private/scripts/nexus-v2-build-minutes-surface-cached.py
          echo "5898b2c01490e9a1ab21e19c159c4ba51fadbd300470f19e31f6384da13d4f2c  /mnt/data/nexus_v2_minutes_roster_surface.csv" | sha256sum --check --strict

      - name: Run frozen 2025 confirmation
        shell: bash
        run: python fantadesk-private/scripts/nexus-v2-minutes-2025-confirmation.py

      - name: Validate sanitized result
        shell: bash
        run: |
          set -euo pipefail
          SRC=/mnt/data/nexus_v2_minutes_2025_confirmation.json
          test -f "$SRC"
          mkdir -p confirmation-output
          cp "$SRC" confirmation-output/summary.json
          python - <<'PY'
          import json
          p=json.load(open('confirmation-output/summary.json'))
          assert p['status']=='2025_CONFIRMATION_COMPLETE'
          assert p['test_season']=='2025-26'
          assert p['test_status']=='POST_SELECTION_HISTORICAL_CONFIRMATION_NOT_PRISTINE'
          assert p['retuning'] is False
          assert p['selection_change_allowed'] is False
          assert p['no_player_rows'] is True
          print('MINUTES_2025_CONFIRMATION_VALIDATION=PASS')
          PY

      - name: Upload confirmation summary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-minutes-2025-confirmation-summary
          path: confirmation-output/summary.json
          if-no-files-found: error
          retention-days: 7
