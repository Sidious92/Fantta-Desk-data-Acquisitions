name: Nexus D1 Second Pass Wikipedia DOB Conflict v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-second-pass-wikipedia-dob-v2/EXECUTE'

permissions:
  contents: write

concurrency:
  group: nexus-d1-second-pass-wikipedia-dob-v2
  cancel-in-progress: false

jobs:
  corroborate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Acquire exact-QID Wikipedia DOB evidence v2
        run: |
          set -euo pipefail
          OUT=.nexus-d1-second-pass-wikipedia-dob-v2/output
          rm -rf "$OUT" && mkdir -p "$OUT"
          python scripts/nexus-d1-second-pass-dob-conflict-wikipedia-v2.py \
            --subjects data/nexus-d1/second-pass-v2/SECOND_PASS_SUBJECTS.json \
            --output "$OUT" | tee "$OUT/ACQUIRE.stdout.log"
      - name: Assert governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.nexus-d1-second-pass-wikipedia-dob-v2/output/RESULT.json').read_text())
          assert d['status']=='PASS'
          assert d['summary']['uniquePersons']==46
          assert d['summary']['requestFailures']==0
          r=d['rules']
          assert r['identityBindingExactVerifiedWikidataQid'] is True
          assert r['wikipediaPageSelectedOnlyByExactQidSitelink'] is True
          assert r['onlyExistingConflictDateMayResolve'] is True
          assert r['nameSearchUsed'] is False and r['fuzzyMatchingUsed'] is False
          assert r['dobInferred'] is False and r['computedAgeDerived'] is False
          assert r['f1Started'] is False and r['d2Started'] is False
          PY
      - name: Persist result authority
        run: |
          set -euo pipefail
          DEST=data/nexus-d1/second-pass-wikipedia-dob-v2
          mkdir -p "$DEST"
          cp .nexus-d1-second-pass-wikipedia-dob-v2/output/RESULT.json "$DEST/RESULT.json"
          cp .nexus-d1-second-pass-wikipedia-dob-v2/output/MANIFEST.json "$DEST/MANIFEST.json"
          cp .nexus-d1-second-pass-wikipedia-dob-v2/output/ACQUIRE.stdout.log "$DEST/ACQUIRE.stdout.log"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'nexus: persist D1 second-pass Wikipedia DOB conflict outcome v2 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-d1-second-pass-wikipedia-dob-v2
          path: .nexus-d1-second-pass-wikipedia-dob-v2/output/
          retention-days: 30
