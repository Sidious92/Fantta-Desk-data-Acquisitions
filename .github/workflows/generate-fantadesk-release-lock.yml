name: Generate FantaDesk Release Lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-fantadesk-release-lock.yml
  workflow_dispatch:
    inputs:
      fantadesk_ref:
        description: FantaDesk ref to lock
        required: true
        default: chore/android-play-internal-readiness

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Require private-repo token
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          test -n "$FANTADESK_READ_TOKEN" || { echo "Missing FANTADESK_READ_TOKEN"; exit 1; }

      - name: Checkout private FantaDesk authority
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ github.event.inputs.fantadesk_ref || 'chore/android-play-internal-readiness' }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false

      - name: Setup Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Generate lockfile only
        working-directory: app
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Verify lockfile
        working-directory: app
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion !== 3) process.exit(1);"

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: FantaDesk-package-lock
          path: app/package-lock.json
          if-no-files-found: error
          retention-days: 7
