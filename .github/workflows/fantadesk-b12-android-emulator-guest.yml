name: FantaDesk B12 Android Emulator Guest Smoke
on:
  push:
    branches: [ci/fantadesk-b12-integration-20261025]
    paths:
      - '.github/workflows/fantadesk-b12-android-emulator-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require readonly private checkout secret
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: a2e96a713488cae74729aaa431db8fec91f7d70a
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21.0.12
      - name: Install pinned npm dependencies and build actual Android WebView payload
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "95628faf5dee76d4df69b2bb6ebcfbd1baa5e7facb39c6cb7b96682b49fcfdb8"
          npm run nexus:runtime:build
          npx tsc -b
          npx vite build --base=./
          npx cap init FantaDesk com.deepfieldresearch.fantadesk --web-dir=dist
          npx cap add android
          npx cap sync android
          npm run android:configure:google-oauth
          grep -Fq 'android:scheme="fantadesk" android:host="auth" android:path="/callback"' android/app/src/main/AndroidManifest.xml
          ./android/gradlew -p android assembleDebug --no-daemon
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM group access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android 15 x86_64 emulator and test real app guest UI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          script: bash .github/scripts/fantadesk-b12-emulator-guest.sh

# Android WebView access hierarchy diagnostics; isolated replay

# Local WebView CDP guest DOM verification fallback; no secrets logged

# Android emulator verifies unauthenticated custom OAuth scheme routing (B13)
