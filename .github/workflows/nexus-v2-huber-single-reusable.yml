name: Nexus v2 Huber Atomic Shard

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      feature_set:
        required: true
        type: string
      level:
        required: true
        type: string
      fold:
        required: true
        type: string
    secrets:
      FANTADESK_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  atomic-huber-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTHORITY_SHA: d72a60e5768d5e6c6dda9b455a67cfea7cd671aa
      AUTHORITY_PROTOCOL_BLOB_SHA: a4e31637ef855ac85cec90fd002377ceea72b191
      CANONICAL_SCRIPT_SHA256: fb8d1072498c072fc1e60ff330d97b83fc54849244f9ecf4ff39bbb7de83dab4
      DATASET_HASH: ff8e952e0e48015ef06a51ffacb5bb6d9ffc7e66d50b27e79acd51b69e93a385
      SMOKE_CONFIG_HASH: b6b80e9b22967da9ef19da1282d5200731b2619f260f3588ec2ca77b2084452a
    steps:
      - name: Checkout fixed private scientific authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: d72a60e5768d5e6c6dda9b455a67cfea7cd671aa
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false

      - name: Verify authority and protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git -C fantadesk-private ls-tree HEAD data/nexus/research-v2/predictive-model-tournament-protocol-v1.json | awk '{print $3}')" = "$AUTHORITY_PROTOCOL_BLOB_SHA"
          echo "$CANONICAL_SCRIPT_SHA256  fantadesk-private/scripts/nexus-v2-stage1-shard.py" | sha256sum --check --strict
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data
          echo "authority_sha=$AUTHORITY_SHA"
          echo "authority_protocol_blob_sha=$AUTHORITY_PROTOCOL_BLOB_SHA"
          echo "canonical_script_sha256=$CANONICAL_SCRIPT_SHA256"

      - name: Prepare provenance-only shard harness correction
        shell: bash
        run: |
          set -euo pipefail
          SRC=fantadesk-private/scripts/nexus-v2-github-huber-shard-v2.py
          DST=/tmp/nexus-v2-github-huber-shard.py
          cp "$SRC" "$DST"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/nexus-v2-github-huber-shard.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            "PRECOMMIT_PROTOCOL_BLOB_SHA='0392ed46325064d0e38c274c9c365b4283cf977c'":
            "PRECOMMIT_PROTOCOL_BLOB_SHA='a4e31637ef855ac85cec90fd002377ceea72b191'",
            "'config_hash':'2eb8193fc6eac838cb97fc2cfe60d86ae354c0ad6adbeb801c37b414e356f6c7'":
            "'config_hash':'b6b80e9b22967da9ef19da1282d5200731b2619f260f3588ec2ca77b2084452a'",
          }
          for old,new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one provenance constant: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('shard_harness_provenance_patch=PASS')
          PY
          diff -u "$SRC" "$DST" || true
          echo "SHARD_PATCHED_SHA256=$(sha256sum "$DST" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Setup exact Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install pinned Huber environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir \
            numpy==2.3.5 \
            scipy==1.17.0 \
            scikit-learn==1.8.0 \
            pandas==2.2.3 \
            joblib==1.5.3 \
            threadpoolctl==3.6.0
          python - <<'PY'
          import sys, numpy, scipy, sklearn, pandas, joblib, threadpoolctl
          got = {
            'python': '.'.join(map(str, sys.version_info[:3])),
            'numpy': numpy.__version__,
            'scipy': scipy.__version__,
            'scikit-learn': sklearn.__version__,
            'pandas': pandas.__version__,
            'joblib': joblib.__version__,
            'threadpoolctl': threadpoolctl.__version__,
          }
          expected = {
            'python':'3.13.5','numpy':'2.3.5','scipy':'1.17.0','scikit-learn':'1.8.0',
            'pandas':'2.2.3','joblib':'1.5.3','threadpoolctl':'3.6.0'
          }
          print(got)
          if got != expected:
              raise SystemExit(f'ENVIRONMENT MISMATCH: {got} != {expected}')
          PY

      - name: Materialize exact private inputs
        shell: bash
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: bash fantadesk-private/scripts/nexus-v2-actions-materialize-inputs.sh

      - name: Run one Huber fit only
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/nexus-v2-github-huber-shard.py \
            "${{ inputs.target }}" \
            "${{ inputs.feature_set }}" \
            "${{ inputs.level }}" \
            "${{ inputs.fold }}"

      - name: Prepare sanitized checkpoint
        shell: bash
        env:
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_FEATURE_SET: ${{ inputs.feature_set }}
          EXPECTED_LEVEL: ${{ inputs.level }}
          EXPECTED_FOLD: ${{ inputs.fold }}
        run: |
          set -euo pipefail
          SRC="/mnt/data/nexus_v2_predictive_research/model_tournament_stage1_atomic_shards/${{ inputs.target }}/HUBER/${{ inputs.feature_set }}/${{ inputs.level }}/${{ inputs.fold }}/checkpoint.json"
          test -f "$SRC"
          mkdir -p shard-output
          cp "$SRC" shard-output/checkpoint.json
          python - <<'PY'
          import json, os
          p=json.load(open('shard-output/checkpoint.json'))
          expected_identity={
            'model':'HUBER',
            'target':os.environ['EXPECTED_TARGET'],
            'feature_set':os.environ['EXPECTED_FEATURE_SET'],
            'level':os.environ['EXPECTED_LEVEL'],
            'fold':os.environ['EXPECTED_FOLD'],
          }
          assert p['status']=='COMPLETE'
          assert p['identity']==expected_identity
          assert 'predictions' not in p
          assert p['audit']['no_individual_player_rows_in_checkpoint'] is True
          assert p['convergence']['pass'] is True
          assert p['configuration']['seed']==20260817
          assert p['configuration']['protocol_blob_sha']==os.environ['AUTHORITY_PROTOCOL_BLOB_SHA']
          assert p['hashes']['dataset_hash']==os.environ['DATASET_HASH']
          assert p['hashes']['script_sha256']==os.environ['CANONICAL_SCRIPT_SHA256']
          assert p['hashes']['authority_protocol_blob_sha']==os.environ['AUTHORITY_PROTOCOL_BLOB_SHA']
          if expected_identity=={'model':'HUBER','target':'GOALS','feature_set':'FC_LAG5','level':'LOW','fold':'2022-23'}:
              assert p['hashes']['config_hash']==os.environ['SMOKE_CONFIG_HASH']
              assert p['audit']['train_rows']==432
              assert p['audit']['test_rows']==494
              assert p['audit']['feature_count_numeric']==20
          print('checkpoint_validation=PASS')
          PY

      - name: Upload sanitized shard checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: huber-${{ inputs.target }}-${{ inputs.feature_set }}-${{ inputs.level }}-${{ inputs.fold }}
          path: shard-output/checkpoint.json
          if-no-files-found: error
          retention-days: 7
