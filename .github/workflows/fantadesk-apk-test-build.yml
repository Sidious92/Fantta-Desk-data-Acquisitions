name: FantaDesk Auction UAT APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact FantaDesk commit to package
        required: false
        default: 6c9422e2c0a654316156e5d7fb7f2b564e767cd7
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-apk-test-build.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FANTADESK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '6c9422e2c0a654316156e5d7fb7f2b564e767cd7' }}
      CAPACITOR_VERSION: 8.5.0
      APP_ID: com.fantadesk.app
      APP_VERSION_NAME: 0.9.8-my-team-economy-uat
      APP_VERSION_CODE: 26090701
    steps:
      - name: Checkout private FantaDesk ephemerally
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.FANTADESK_REF }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FANTADESK_REF"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Upgrade npm
        run: npm install -g npm@11.6.0

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify tests
        run: npm run test:run

      - name: Build web runtime
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@${CAPACITOR_VERSION} @capacitor/cli@${CAPACITOR_VERSION} @capacitor/android@${CAPACITOR_VERSION}

      - name: Create Android wrapper
        run: |
          npx cap init FantaNexus-Auction-Helper "$APP_ID" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Harden Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('android/variables.gradle'); t=p.read_text()
          for a,b in [(r'minSdkVersion\s*=\s*\d+','minSdkVersion = 24'),(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36'),(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36')]:
              t,n=re.subn(a,b,t,count=1)
              if n!=1: raise SystemExit(b)
          p.write_text(t)
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text().replace('android:allowBackup="true"','android:allowBackup="false"')
          if 'android:usesCleartextTraffic=' not in t: t=t.replace('<application','<application\n        android:usesCleartextTraffic="false"',1)
          if 'android:screenOrientation=' not in t: t=t.replace('android:name=".MainActivity"','android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"',1)
          m.write_text(t)
          g=Path('android/app/build.gradle'); t=g.read_text()
          t=re.sub(r'versionCode\s+\d+',f'versionCode {os.environ["APP_VERSION_CODE"]}',t,count=1)
          t=re.sub(r'versionName\s+"[^"]+"',f'versionName "{os.environ["APP_VERSION_NAME"]}"',t,count=1)
          g.write_text(t)
          PY

      - name: Android release lint
        working-directory: android
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        id: sign_apk
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          keytool -genkeypair -keystore /tmp/uat.jks -storepass fantadesk-uat-ci -keypass fantadesk-uat-ci -alias uat -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=FantaNexus Auction Helper UAT,O=FantaNexus,C=IT" -noprompt
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" /tmp/aligned.apk
          "$APKSIGNER" sign --ks /tmp/uat.jks --ks-key-alias uat --ks-pass pass:fantadesk-uat-ci --key-pass pass:fantadesk-uat-ci --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out /tmp/signed.apk /tmp/aligned.apk
          SHORT_SHA="${FANTADESK_REF:0:8}"
          OUT="FantaNexus-Auction-Helper-My-Team-Economy-UAT-${SHORT_SHA}.apk"
          cp /tmp/signed.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.sign_apk.outputs.file }}"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -q "package: name='$APP_ID'"
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          "$APKSIGNER" verify --verbose "$APK" | grep -q 'Verified'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FantaNexus-Auction-Helper-My-Team-Economy-UAT
          path: ${{ steps.sign_apk.outputs.file }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
