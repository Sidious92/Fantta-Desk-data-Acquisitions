name: F2 Understat Player Match Temporal Probe v1

on:
  push:
    branches:
      - feat/f2-understat-player-match-temporal-probe
    paths:
      - 'scripts/nexus-f2-probe-understat-player-matches-v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f2-understat-player-match-temporal-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed temporal probe
        run: python scripts/nexus-f2-probe-understat-player-matches-v1.py
      - name: Upload immutable probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-f2-understat-player-match-temporal-probe-v1
          path: .nexus-f2-understat-player-match-temporal-probe-v1
          if-no-files-found: error
          retention-days: 90
      - name: Persist compact probe status
        run: |
          mkdir -p .nexus-f2-understat-player-match-temporal-probe-v1-status
          cp .nexus-f2-understat-player-match-temporal-probe-v1/PROBE.json .nexus-f2-understat-player-match-temporal-probe-v1-status/PROBE.json
          cp .nexus-f2-understat-player-match-temporal-probe-v1/MANIFEST.json .nexus-f2-understat-player-match-temporal-probe-v1-status/MANIFEST.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nexus-f2-understat-player-match-temporal-probe-v1-status
          if git diff --cached --quiet; then
            echo 'No status changes.'
            exit 0
          fi
          git commit -m 'nexus f2: persist Understat player-match temporal probe v1 [skip ci]'
          git push origin HEAD:feat/f2-understat-player-match-temporal-probe
