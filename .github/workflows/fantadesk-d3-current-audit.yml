name: FantaDesk D3 Current 2026/27 Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-d3-current-audit.yml

permissions:
  contents: read
  statuses: write

jobs:
  d3-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FANTADESK_EXPECTED_HEAD: cbbbca4f21fccc62b27467068c2f7b8f8229438c
      NEXUS_D2B_ROSTER_JSON: /tmp/nexus-d3/frozen-roster.json
      NEXUS_D2B_OUTPUT_ROOT: /tmp/nexus-d3/d2
      NEXUS_D2B_ROWS_JSON: /tmp/nexus-d3/d2/D2B_ROWS_V3.json
      NEXUS_D3_OUTPUT_ROOT: /tmp/nexus-d3/d3
    steps:
      - name: Checkout private FantaDesk ephemerally
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: cbbbca4f21fccc62b27467068c2f7b8f8229438c
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FANTADESK_EXPECTED_HEAD"
          echo "Verified FantaDesk commit $(git rev-parse HEAD)"

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Typecheck branch
        id: typecheck
        run: npm run typecheck

      - name: Materialize embedded Nexus runtime
        id: materialize
        run: npm run nexus:runtime:build

      - name: Materialize frozen 523-player Listone
        id: roster
        run: node scripts/nexus-d2b-prepare-frozen-roster-2026-27-v2.mjs

      - name: Run D3 mathematical invariant tests
        id: unit
        run: npx vitest run src/features/nexus/decision/replacementScarcity.test.ts --reporter=verbose

      - name: Re-materialize audited D2 rows
        id: d2
        run: npx vitest run src/features/nexus/decision/d2bCurrentServing2026_27.v3.integration.test.ts --reporter=verbose

      - name: Run D3 523-player replacement/scarcity audit
        id: d3
        continue-on-error: true
        run: npx vitest run src/features/nexus/decision/d3Current2026_27.integration.test.ts --reporter=verbose

      - name: Publish compact D3 evidence statuses
        if: always() && steps.d3.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.NEXUS_D3_OUTPUT_ROOT + '/D3_CURRENT_AUDIT_V1.json', 'utf8'));
          const statuses = [
            ['d3-source', `players=${report.players} d2=${report.sourceD2RowDigestSha256.slice(0,16)} rules=${report.rulesHash.slice(0,16)}`],
            ['d3-demand', `P=${report.aggregateDemand.P} D=${report.aggregateDemand.D} C=${report.aggregateDemand.C} A=${report.aggregateDemand.A}`],
            ['d3-support', `opp=${JSON.stringify(report.support.opportunitySupport)} pv=${JSON.stringify(report.support.voteAppearanceSupport)}`],
            ['d3-digest', `d3PlayerDigestSha256=${report.d3PlayerDigestSha256}`],
          ];
          for (const role of ['P','D','C','A']) {
            const r = report.roleStates[role];
            const f = (v) => v === null ? 'null' : Number(v).toFixed(6);
            statuses.push([`d3-role-${role}`, `n=${r.availableCount} demand=${r.remainingLeagueDemand} replRank=${r.replacementRank} replId=${r.replacementPlayerId} replU=${f(r.replacementUtility)} gap=${f(r.frontierGap)} positive=${r.positiveIntrinsicValuePlayers}`]);
          }
          statuses.push(['d3-boundary', `scarcityAdj=${report.boundaries.scarcityAdjustmentApplied} arbitraryMultiplier=${report.boundaries.arbitraryRoleMultiplierUsed} market=${report.boundaries.marketInformationUsed} supportDiscount=${report.boundaries.supportDiscountApplied}`]);
          for (const [context, description] of statuses) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ state: 'success', context, description: description.slice(0, 140) }),
            });
            if (!response.ok) throw new Error(`${context}: HTTP ${response.status} ${await response.text()}`);
          }
          NODE

      - name: Publish step statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const steps = {
            checkout: '${{ steps.checkout.outcome }}', verify: '${{ steps.verify.outcome }}', setup: '${{ steps.setup.outcome }}',
            install: '${{ steps.install.outcome }}', typecheck: '${{ steps.typecheck.outcome }}', materialize: '${{ steps.materialize.outcome }}',
            roster: '${{ steps.roster.outcome }}', unit: '${{ steps.unit.outcome }}', d2: '${{ steps.d2.outcome }}', d3: '${{ steps.d3.outcome }}',
          };
          for (const [name, outcome] of Object.entries(steps)) {
            const state = outcome === 'success' ? 'success' : outcome === 'skipped' ? 'error' : 'failure';
            await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              body: JSON.stringify({ state, context: `d3-step-${name}`, description: `${name}=${outcome}` }),
            });
          }
          NODE

      - name: Publish D3 gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="D3 current 2026/27 audit failed"
          if [ "${{ steps.checkout.outcome }}" = "success" ] \
            && [ "${{ steps.verify.outcome }}" = "success" ] \
            && [ "${{ steps.setup.outcome }}" = "success" ] \
            && [ "${{ steps.install.outcome }}" = "success" ] \
            && [ "${{ steps.typecheck.outcome }}" = "success" ] \
            && [ "${{ steps.materialize.outcome }}" = "success" ] \
            && [ "${{ steps.roster.outcome }}" = "success" ] \
            && [ "${{ steps.unit.outcome }}" = "success" ] \
            && [ "${{ steps.d2.outcome }}" = "success" ] \
            && [ "${{ steps.d3.outcome }}" = "success" ]; then
            state=success
            description="D3 current 2026/27 replacement/scarcity PASS"
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"d3-gate\",\"description\":\"${description}\"}"

      - name: Enforce fail-closed D3 gate
        if: always() && (steps.checkout.outcome != 'success' || steps.verify.outcome != 'success' || steps.setup.outcome != 'success' || steps.install.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.materialize.outcome != 'success' || steps.roster.outcome != 'success' || steps.unit.outcome != 'success' || steps.d2.outcome != 'success' || steps.d3.outcome != 'success')
        run: exit 1
