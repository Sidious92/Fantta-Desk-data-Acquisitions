name: Nexus FPL Clone Crossleague v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-fpl-clone-crossleague-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo mkdir -p /mnt/data/nexus-fpl-clone-crossleague-v1 && sudo chown -R $USER:$USER /mnt/data
      - run: timeout 27m python scripts/acquire_fpl_clone_crossleague_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-fpl-clone-crossleague-v1
          path: /mnt/data/nexus-fpl-clone-crossleague-v1
          if-no-files-found: warn
      - name: Record compact summary
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-fpl-clone-crossleague-v1-status
          if [ -f /mnt/data/nexus-fpl-clone-crossleague-v1/SUMMARY.json ]; then
            cp /mnt/data/nexus-fpl-clone-crossleague-v1/SUMMARY.json .nexus-fpl-clone-crossleague-v1-status/SUMMARY.json
          else
            printf '{"schema":"NEXUS_FPL_CLONE_CROSSLEAGUE_ACQUISITION_V1_SUMMARY","status":"NO_SUMMARY_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-fpl-clone-crossleague-v1-status/SUMMARY.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-fpl-clone-crossleague-v1-status/SUMMARY.json
          git commit -m 'data: record FPL-clone crossleague v1 summary' || exit 0
          git push origin HEAD:main
