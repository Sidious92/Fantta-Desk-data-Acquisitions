name: Nexus Cross-League Fantasy Open Acquisition v1.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-crossleague-fantasy-open-v1-4-launch/EXECUTE'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AUTHORITY_SHA: 09624554bd04302882c8b6f7d0962b70e59224c7
      OUT_ROOT: /mnt/data/nexus-crossleague-fantasy-open-v1

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Checkout fixed private scientific authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false

      - name: Verify authority and governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-crossleague-fantasy-open-acquisition-v1-1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          test -f scripts/nexus-acquire-crossleague-fantasy-open-v1.py
          test -f scripts/nexus-acquire-crossleague-fantasy-open-v1-2.py
          test -f scripts/nexus-acquire-crossleague-fantasy-open-v1-3.py
          test -f scripts/nexus-acquire-crossleague-fantasy-open-v1-4.py
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install acquisition dependencies
        shell: bash
        run: python -m pip install --no-cache-dir pandas==2.2.3 requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1 html5lib==1.1

      - name: Acquire FPL Comunio MPG and Biwenger
        shell: bash
        env:
          NEXUS_CROSSLEAGUE_FANTASY_OUT: ${{ env.OUT_ROOT }}
        run: python scripts/nexus-acquire-crossleague-fantasy-open-v1-4.py

      - name: Validate complete public-provider snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/mnt/data/nexus-crossleague-fantasy-open-v1')
          m=json.load(open(root/'manifest.json'))
          assert m['schema']=='NEXUS_CROSSLEAGUE_FANTASY_OPEN_ACQUISITION_V1_1'
          assert m['status']=='PASS'
          g=m['governance']
          assert g['cross_provider_normalization_performed'] is False
          assert g['missing_values_filled'] is False
          assert g['predictive_models_modified'] is False

          pc=m['normalized']['provider_counts']
          assert pc.get('FPL_ARCHIVE',0)>1000, pc
          assert pc.get('MPG',0)>0, pc
          assert pc.get('COMUNIO',0)>0, pc
          assert pc.get('BIWENGER',0)>0, pc

          comunio=m['providers']['COMUNIO']
          scopes_ok=[k for k,v in comunio.items() if v.get('profiles_ok',0)>0]
          assert len(scopes_ok)>=15, comunio
          for competition_key in ['bundesliga','bundesliga2','laliga','superlig']:
              assert any(k.startswith(competition_key+':') and comunio[k].get('profiles_ok',0)>0 for k in comunio), (competition_key,comunio)

          mpg=m['providers']['MPG']
          assert len(mpg.get('nonempty_pools',[]))>0, mpg

          biw=m['providers']['BIWENGER']
          valid_catalogs=[x for x in biw.get('catalogs',[]) if x.get('valid') and x.get('players',0)>0]
          assert valid_catalogs, biw
          assert biw.get('unique_catalog_players',0)>100, biw
          assert biw.get('detail_profiles_ok',0)>0, biw

          for p in [
              root/'manifest.json',
              root/'field-inventory.json',
              root/'file-inventory.json',
              root/'normalized/provider-player-season-index.csv',
          ]:
              assert p.is_file() and p.stat().st_size>0, p

          print('CROSSLEAGUE_FANTASY_V1_4_VALIDATION=PASS')
          print(json.dumps({
              'provider_counts':pc,
              'comunio_scopes_ok':len(scopes_ok),
              'mpg_nonempty_pools':len(mpg.get('nonempty_pools',[])),
              'biwenger_valid_catalogs':len(valid_catalogs),
              'biwenger_unique_players':biw.get('unique_catalog_players'),
              'biwenger_detail_profiles_ok':biw.get('detail_profiles_ok'),
          },indent=2))
          PY

      - name: Package immutable acquisition snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT_ROOT/manifest.json" /mnt/data/nexus-crossleague-fantasy-open-v1-1-manifest.json
          cp "$OUT_ROOT/field-inventory.json" /mnt/data/nexus-crossleague-fantasy-open-v1-1-field-inventory.json
          cp "$OUT_ROOT/file-inventory.json" /mnt/data/nexus-crossleague-fantasy-open-v1-1-file-inventory.json
          tar -C /mnt/data --zstd -cf /mnt/data/nexus-crossleague-fantasy-open-v1-1.tar.zst nexus-crossleague-fantasy-open-v1
          sha256sum /mnt/data/nexus-crossleague-fantasy-open-v1-1.tar.zst > /mnt/data/nexus-crossleague-fantasy-open-v1-1.tar.zst.sha256

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-crossleague-fantasy-open-v1-1
          path: |
            /mnt/data/nexus-crossleague-fantasy-open-v1-1.tar.zst
            /mnt/data/nexus-crossleague-fantasy-open-v1-1.tar.zst.sha256
            /mnt/data/nexus-crossleague-fantasy-open-v1-1-manifest.json
            /mnt/data/nexus-crossleague-fantasy-open-v1-1-field-inventory.json
            /mnt/data/nexus-crossleague-fantasy-open-v1-1-file-inventory.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record SUCCESS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nexus-crossleague-fantasy-open-v1-4-status
          printf '{"workflow":"Nexus Cross-League Fantasy Open Acquisition v1.4","run_id":%s,"conclusion":"success","head_sha":"%s","authority_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$AUTHORITY_SHA" > .nexus-crossleague-fantasy-open-v1-4-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-crossleague-fantasy-open-v1-4-status/RESULT.json
          git commit -m 'ci: record cross-league fantasy v1.4 success' || exit 0
          git push origin HEAD:main

      - name: Record FAILURE
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nexus-crossleague-fantasy-open-v1-4-status
          printf '{"workflow":"Nexus Cross-League Fantasy Open Acquisition v1.4","run_id":%s,"conclusion":"failure","head_sha":"%s","authority_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$AUTHORITY_SHA" > .nexus-crossleague-fantasy-open-v1-4-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-crossleague-fantasy-open-v1-4-status/RESULT.json
          git commit -m 'ci: record cross-league fantasy v1.4 failure' || exit 0
          git push origin HEAD:main
