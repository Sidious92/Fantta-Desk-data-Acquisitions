name: FantaDesk Nexus Population Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-nexus-population-diagnostic.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private FantaDesk ephemerally
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: f66cb5d3195f6d4e8bb8fcd3bcce9162d3c3c1b3
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f66cb5d3195f6d4e8bb8fcd3bcce9162d3c3c1b3"
          echo "Verified FantaDesk commit $(git rev-parse HEAD)"

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Materialize embedded Nexus runtime
        id: materialize
        run: npm run nexus:runtime:build

      - name: Capture current official Listone ephemerally
        id: listone
        env:
          NEXUS_LIVE_LISTONE_OUTPUT_ROOT: .nexus-current-listone
        run: node scripts/nexus-acquire-current-listone-2026-27.mjs

      - name: Diagnose current population
        id: diagnostic
        continue-on-error: true
        env:
          NEXUS_CURRENT_LISTONE_JSON: .nexus-current-listone/current-listone.json
          NEXUS_POPULATION_DIAGNOSTIC_JSON: .nexus-population-diagnostic.json
        run: npx vitest run src/features/nexus/runtime/currentListonePopulationDiagnostic.integration.test.ts --reporter=verbose

      - name: Print diagnostic report
        if: always()
        run: |
          if [ -f .nexus-population-diagnostic.json ]; then
            cat .nexus-population-diagnostic.json
          fi

      - name: Publish machine-readable gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="Nexus population gate failed"
          if [ "${{ steps.checkout.outcome }}" = "success" ] \
            && [ "${{ steps.verify.outcome }}" = "success" ] \
            && [ "${{ steps.setup.outcome }}" = "success" ] \
            && [ "${{ steps.install.outcome }}" = "success" ] \
            && [ "${{ steps.materialize.outcome }}" = "success" ] \
            && [ "${{ steps.listone.outcome }}" = "success" ] \
            && [ "${{ steps.diagnostic.outcome }}" = "success" ]; then
            state=success
            description="Nexus population gate PASS"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"nexus-population-gate\",\"description\":\"${description}\"}"

      - name: Enforce fail-closed gate
        if: always() && (steps.checkout.outcome != 'success' || steps.verify.outcome != 'success' || steps.setup.outcome != 'success' || steps.install.outcome != 'success' || steps.materialize.outcome != 'success' || steps.listone.outcome != 'success' || steps.diagnostic.outcome != 'success')
        run: exit 1
