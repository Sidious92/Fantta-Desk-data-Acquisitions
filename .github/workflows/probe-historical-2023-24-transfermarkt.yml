name: Probe historical 2023-24 Transfermarkt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-historical-2023-24-transfermarkt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
          git -C fantadesk-private rev-parse HEAD
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run Transfermarkt read-only probe
        working-directory: fantadesk-private
        run: python scripts/nexus/probe_historical_2023_24_transfermarkt.py
      - name: Stage probe result
        run: |
          set -euo pipefail
          mkdir -p out
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2023-24-transfermarkt-probe-v1.json out/
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: historical-2023-24-transfermarkt-probe-v1
          path: out
          if-no-files-found: error
          retention-days: 14
