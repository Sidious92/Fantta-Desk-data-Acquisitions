name: Nexus Ligue 1 v8 Summarize
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-ligue1-v8-summarize-launch/EXECUTE'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/summarize_ligue1_official_fantasy_api_v8.py
      - name: Commit summary
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-ligue1-official-fantasy-api-probe-v8-status/SUMMARY.json
          git commit -m 'ci: summarize Ligue 1 official fantasy API probe v8' || exit 0
          git push origin HEAD:main
