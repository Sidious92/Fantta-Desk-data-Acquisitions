name: Nexus Understat 2025 Structure Probe
on:
  push:
    paths:
      - '.nexus-understat-2025-structure-probe/EXECUTE'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Understat EPL 2025 response structure
        shell: bash
        run: |
          node <<'NODE'
          const pageUrl='https://understat.com/league/EPL/2025';
          const baseUrl='https://understat.com/';
          const headers={'user-agent':'Mozilla/5.0 FantaNexus/2.0 acquisition-structure-probe'};
          const r=await fetch(pageUrl,{headers});
          const html=await r.text();
          console.log(JSON.stringify({url:pageUrl,status:r.status,contentType:r.headers.get('content-type'),bytes:Buffer.byteLength(html)}));
          const needles=['playersData','datesData','teamsData','JSON.parse','ajax','leagueData','get_stats','statistics'];
          for (const n of needles) {
            const p=html.indexOf(n);
            console.log(`html_hit ${JSON.stringify(n)} => ${p}`);
            if (p>=0) console.log(`html_snippet ${n} => ${JSON.stringify(html.slice(Math.max(0,p-350),p+700))}`);
          }
          const srcs=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]);
          console.log('script_srcs='+JSON.stringify(srcs));
          for (const src of srcs) {
            if (/^(?:https?:)?\/\//.test(src) && !src.includes('understat.com')) continue;
            const abs=new URL(src,baseUrl).href;
            try {
              const rr=await fetch(abs,{headers}); const js=await rr.text();
              const tokens=['/ajax','ajax/','/api','playersData','getStats','get_stats','statistics','league'];
              const hits=tokens.filter(n=>js.includes(n));
              console.log(`asset=${abs} status=${rr.status} bytes=${Buffer.byteLength(js)} hits=${JSON.stringify(hits)}`);
              for (const h of hits) {
                const p=js.indexOf(h);
                console.log(`asset_hit ${h} => ${JSON.stringify(js.slice(Math.max(0,p-500),p+1200))}`);
              }
            } catch(e) { console.log(`asset_error=${abs} ${e.message}`); }
          }
          NODE
