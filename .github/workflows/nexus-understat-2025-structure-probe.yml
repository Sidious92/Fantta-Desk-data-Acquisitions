name: Nexus Understat 2025 Structure Probe
on:
  push:
    paths:
      - '.nexus-understat-2025-structure-probe/EXECUTE'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Understat EPL 2025 JSON endpoint
        shell: bash
        run: |
          node <<'NODE'
          const headers={'user-agent':'Mozilla/5.0 FantaNexus/2.0 acquisition-structure-probe','accept':'application/json,text/plain,*/*','referer':'https://understat.com/league/EPL/2025'};
          const urls=[
            'https://understat.com/getLeagueData/EPL/2025',
            'https://understat.com/league/getLeagueData/EPL/2025',
            'https://understat.com/league/EPL/getLeagueData/EPL/2025'
          ];
          for (const url of urls) {
            try {
              const r=await fetch(url,{headers}); const text=await r.text();
              const out={url,status:r.status,contentType:r.headers.get('content-type'),bytes:Buffer.byteLength(text)};
              try {
                const data=JSON.parse(text); out.keys=Object.keys(data); out.playerCount=Array.isArray(data.players)?data.players.length:null; out.firstPlayerKeys=Array.isArray(data.players)&&data.players[0]?Object.keys(data.players[0]):[];
              } catch { out.prefix=text.slice(0,120).replace(/\s+/g,' '); }
              console.log(JSON.stringify(out));
            } catch(e) { console.log(JSON.stringify({url,error:e.message})); }
          }
          NODE
