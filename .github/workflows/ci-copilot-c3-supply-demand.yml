name: CI Copilot C3 Supply Demand

on:
  pull_request:
    paths:
      - 'ci/copilot-c3/**'
      - '.github/workflows/ci-copilot-c3-supply-demand.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public runner repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C3 verification harness
        run: node ci/copilot-c3/supply-demand-check.mjs
