name: Nexus D1 Resolve Historical DOB Conflicts Fantacalcio v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-historical-dob-conflict-fantacalcio-v1/EXECUTE'

permissions:
  contents: write

concurrency:
  group: nexus-d1-historical-dob-conflict-fantacalcio-v1
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve 46 historical DOB conflicts
        run: |
          set -euo pipefail
          OUT=.nexus-d1-historical-dob-conflict-fantacalcio-v1/output
          rm -rf "$OUT" && mkdir -p "$OUT"
          python scripts/nexus-d1-resolve-historical-dob-conflicts-fantacalcio-v1.py \
            --subjects-manifest data/nexus-d1/historical-resolved-person-subjects-v3-manifest.json \
            --second-pass data/nexus-d1/second-pass-v2/SECOND_PASS_SUBJECTS.json \
            --output "$OUT" | tee "$OUT/ACQUIRE.stdout.log"
      - name: Assert governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.nexus-d1-historical-dob-conflict-fantacalcio-v1/output/RESULT.json').read_text())
          assert d['status']=='PASS' and d['summary']['subjects']==46 and d['summary']['requestFailures']==0
          r=d['rules']
          assert r['providerIdUsedAsGlobalHistoricalPersonKey'] is False
          assert r['onlyExistingWikidataConflictDateMayResolve'] is True
          assert r['nameSearchUsed'] is False and r['fuzzyMatchingUsed'] is False
          assert r['computedAgeDerived'] is False and r['f1Started'] is False and r['d2Started'] is False
          PY
      - name: Persist outcome
        run: |
          set -euo pipefail
          DEST=data/nexus-d1/historical-dob-conflict-fantacalcio-v1
          mkdir -p "$DEST"
          cp .nexus-d1-historical-dob-conflict-fantacalcio-v1/output/RESULT.json "$DEST/RESULT.json"
          cp .nexus-d1-historical-dob-conflict-fantacalcio-v1/output/MANIFEST.json "$DEST/MANIFEST.json"
          cp .nexus-d1-historical-dob-conflict-fantacalcio-v1/output/ACQUIRE.stdout.log "$DEST/ACQUIRE.stdout.log"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'nexus: persist D1 historical DOB conflict Fantacalcio outcome v1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-d1-historical-dob-conflict-fantacalcio-v1
          path: .nexus-d1-historical-dob-conflict-fantacalcio-v1/output/
          retention-days: 30
