name: Nexus D1 Fantacalcio Historical Exact Observation Demographics Probe v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-fantacalcio-historical-observation-probe-v1/EXECUTE'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          rm -rf .nexus-d1-fantacalcio-historical-observation-probe-v1/output
          python scripts/nexus-d1-probe-fantacalcio-historical-exact-observation-demographics-v1.py | tee /tmp/probe.log
      - name: Persist probe outcome
        run: |
          set -euo pipefail
          DEST=data/nexus-d1/fantacalcio-historical-observation-probe-v1
          mkdir -p "$DEST"
          cp .nexus-d1-fantacalcio-historical-observation-probe-v1/output/RESULT.json "$DEST/RESULT.json"
          cp /tmp/probe.log "$DEST/PROBE.stdout.log"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'nexus: persist D1 Fantacalcio historical observation probe v1 outcome [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-d1-fantacalcio-historical-observation-probe-v1
          path: .nexus-d1-fantacalcio-historical-observation-probe-v1/output/
          retention-days: 30
