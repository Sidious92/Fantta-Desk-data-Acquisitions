name: Nexus Fantasy Provider Shape Probe v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-probe-fantasy-provider-shapes-v1-launch/EXECUTE'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1
      - name: Probe provider response shapes
        run: python scripts/nexus-probe-fantasy-provider-shapes-v1.py
