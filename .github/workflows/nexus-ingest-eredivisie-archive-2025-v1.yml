name: Nexus Eredivisie Archive 2025 v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-eredivisie-archive-2025-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUTHORITY_SHA: 0330d1caef8fddb29a35cb58e10749174b6a95c4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Checkout public Eredivisie archive
        uses: actions/checkout@v6
        with:
          repository: TopMarx/eredivisie
          ref: main
          path: archive-source
          persist-credentials: false
          sparse-checkout: |
            data/2025
          sparse-checkout-cone-mode: true
      - name: Verify governance and prepare data root
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-eredivisie-archive-2025-acquisition-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          test -f archive-source/data/2025/eredivisie-bootstrap_2025.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Ingest archive
        env:
          EREDIVISIE_ARCHIVE_SOURCE: archive-source/data/2025
          EREDIVISIE_ARCHIVE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          export EREDIVISIE_ARCHIVE_SHA="$(git -C archive-source rev-parse HEAD)"
          python scripts/nexus-ingest-eredivisie-archive-2025-v1.py
      - name: Validate
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          m=json.load(open('/mnt/data/nexus-eredivisie-archive-2025-v1/manifest.json')); c=m['coverage']
          checks={'manifest_pass':m.get('status')=='PASS','players_gt_300':c.get('bootstrap_players',0)>300,'player_files_gt_100':c.get('player_files',0)>100,'gameweeks_gt_10':c.get('gameweek_files',0)>10,'archive_sha_known':m.get('archive_git_sha') not in {None,'','UNKNOWN'},'no_model_mutation':m['governance']['predictive_models_modified'] is False}
          r={'status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'coverage':c,'archive_git_sha':m.get('archive_git_sha')};Path('/mnt/data/nexus-eredivisie-archive-2025-v1-validation.json').write_text(json.dumps(r,indent=2)+'\n');print(json.dumps(r,indent=2));sys.exit(0 if r['status']=='PASS' else 1)
          PY
      - name: Package
        if: always()
        run: |
          mkdir -p /mnt/data/package-eredivisie-archive-2025-v1
          test -d /mnt/data/nexus-eredivisie-archive-2025-v1 && tar -C /mnt/data --zstd -cf /mnt/data/package-eredivisie-archive-2025-v1/nexus-eredivisie-archive-2025-v1.tar.zst nexus-eredivisie-archive-2025-v1 || true
          test -f /mnt/data/nexus-eredivisie-archive-2025-v1/manifest.json && cp /mnt/data/nexus-eredivisie-archive-2025-v1/manifest.json /mnt/data/package-eredivisie-archive-2025-v1/ || true
          test -f /mnt/data/nexus-eredivisie-archive-2025-v1-validation.json && cp /mnt/data/nexus-eredivisie-archive-2025-v1-validation.json /mnt/data/package-eredivisie-archive-2025-v1/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-eredivisie-archive-2025-v1
          path: /mnt/data/package-eredivisie-archive-2025-v1/*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Record terminal status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:];p={'workflow':'Nexus Eredivisie Archive 2025 v1','job_status':status,'run_id':int(run_id)}
          for key,path in [('manifest','/mnt/data/nexus-eredivisie-archive-2025-v1/manifest.json'),('validation','/mnt/data/nexus-eredivisie-archive-2025-v1-validation.json')]:
              q=Path(path)
              if q.is_file():p[key]=json.load(open(q))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-eredivisie-archive-2025-v1-status
          cp "$tmp" .nexus-eredivisie-archive-2025-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-eredivisie-archive-2025-v1-status/RESULT.json
          git commit -m "ci: record Eredivisie archive 2025 ${{ job.status }}" || exit 0
          git push origin HEAD:main
