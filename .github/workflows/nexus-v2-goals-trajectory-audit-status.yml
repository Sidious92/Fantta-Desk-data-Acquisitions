name: Nexus v2 GOALS Trajectory Audit Status

on:
  workflow_run:
    workflows: ["Nexus v2 GOALS Trajectory Audit 2026-27"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Record terminal status
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .nexus-v2-goals-trajectory-status
          printf '{"workflow":"Nexus v2 GOALS Trajectory Audit 2026-27","run_id":%s,"conclusion":"%s","head_sha":"%s"}\n' "$RUN_ID" "$CONCLUSION" "$HEAD_SHA" > .nexus-v2-goals-trajectory-status/RESULT.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-v2-goals-trajectory-status/RESULT.json
          git commit -m 'ci: record GOALS trajectory audit status' || exit 0
          git push
