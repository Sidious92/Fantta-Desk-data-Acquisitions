name: FantaDesk B10 Local Supabase Real Auth E2E
on:
  push:
    branches: [main]
    paths:
      - .github/fantadesk-ci-target.txt
      - .github/workflows/fantadesk-b10-local-supabase-auth.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-and-deletion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout public CI controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable FantaDesk SHA
        shell: bash
        run: |
          set -euo pipefail
          rev="$(tr -d '\r\n' < .github/fantadesk-ci-target.txt)"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "PRIVATE_REF=$rev" >> "$GITHUB_ENV"
      - name: Checkout private FantaDesk ephemerally
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Install Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install JS SDK dependencies
        working-directory: private-app
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Static syntax check before starting heavy local containers
        working-directory: private-app
        run: node --check scripts/b10-supabase-auth-deletion-e2e.mjs
      - name: Install pinned Supabase local CLI (no hosted project connection)
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Initialize isolated Supabase project and start Auth/Postgres
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          # Creates a LOCAL config only on ephemeral runner; no Supabase login,
          # link, deploy, or real production project credentials are used.
          supabase init --force
          # A single disposable GoTrue instance runs disabled AND enabled test
          # phases. The CLI default (2 emails/hour for the entire project) is
          # too low for this multi-account CI protocol. This override is LOCAL
          # to the temporary runner; it never changes hosted Auth limits.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("supabase/config.toml")
          source = p.read_text()
          updated, count = re.subn(r"(?m)^(email_sent[ \t]*=[ \t]*)\d+", r"\g<1>12", source)
          assert count == 1, "Expected exactly one local email-sent limit"
          # Target ONLY [auth.email], never unrelated MFA frequency fields.
          # The generated CLI config may express 1 minute as "1m0s".
          lines = updated.splitlines(keepends=True)
          sections = [i for i, line in enumerate(lines) if line.strip() == "[auth.email]"]
          assert len(sections) == 1, "Expected one local auth.email section"
          section_start = sections[0] + 1
          section_end = next((i for i in range(section_start, len(lines))
                              if lines[i].lstrip().startswith("[")), len(lines))
          candidates = [i for i in range(section_start, section_end)
                        if re.match(r"^\s*max_frequency\s*=", lines[i])]
          assert len(candidates) == 1, "Expected one email max_frequency value"
          target = candidates[0]
          lines[target] = re.sub(r'^(\s*max_frequency\s*=\s*)"[^"]+"',
                                 r'\g<1>"1s"', lines[target], count=1)
          updated = "".join(lines)
          p.write_text(updated)
          PY
          # Local-only OTP template: no changes to the hosted Supabase email configuration.
          cat >> supabase/config.toml <<'TOML'

          [auth.email.template.magic_link]
          subject = "FantaDesk CI code"
          content_path = "./tests/auth-templates/b10-local-deletion-email-code.html"
          TOML
          supabase start > /tmp/fd-b10-supabase-start.log 2>&1 || {
            echo 'Supabase local stack startup failed (redacted diagnostic tail):'
            grep -E 'error|failed|migration' /tmp/fd-b10-supabase-start.log | tail -25 || true
            exit 1
          }
          supabase status -o env > /tmp/fd-b10-local-secrets.env
          chmod 600 /tmp/fd-b10-local-secrets.env
          set -a
          source /tmp/fd-b10-local-secrets.env
          set +a
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Verify deletion kill switch OFF with genuine local GoTrue tokens
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          printf 'FANTADESK_ACCOUNT_DELETION_ENABLED=false\n' > /tmp/fd-b10-edge-off.env
          supabase functions serve delete-account --env-file /tmp/fd-b10-edge-off.env > /tmp/fd-b10-edge-off.log 2>&1 &
          echo $! > /tmp/fd-b10-edge.pid
          sleep 9
          FANTADESK_E2E_MODE=disabled node scripts/b10-supabase-auth-deletion-e2e.mjs
          kill "$(cat /tmp/fd-b10-edge.pid)" || true
          sleep 4
      - name: Verify authorized deletion, cross-user protection and old JWT rejection
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          printf 'FANTADESK_ACCOUNT_DELETION_ENABLED=true\nFANTADESK_ACCOUNT_DELETION_EMAIL_OTP_ENABLED=true\nFANTADESK_LOCAL_AUTH_DIAGNOSTICS=true\n' > /tmp/fd-b10-edge-on.env
          supabase functions serve delete-account --env-file /tmp/fd-b10-edge-on.env > /tmp/fd-b10-edge-on.log 2>&1 &
          echo $! > /tmp/fd-b10-edge.pid
          sleep 9
          FANTADESK_E2E_MODE=enabled node scripts/b10-supabase-auth-deletion-e2e.mjs || {
            echo 'Edge startup/runtime diagnostic (only non-secret lines):'
            grep -E 'FANTADESK_LOCAL_OTP_ERROR|error|Error|failed|exception' /tmp/fd-b10-edge-on.log | tail -18 || true
            exit 1
          }
      - name: Stop local-only Supabase containers
        if: always()
        working-directory: private-app
        run: |
          if [ -f /tmp/fd-b10-edge.pid ]; then kill "$(cat /tmp/fd-b10-edge.pid)" || true; fi
          supabase stop --no-backup || true
