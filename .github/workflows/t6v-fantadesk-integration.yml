name: T6V FantaDesk Integration Verification

# Read-only verification harness for private FantaDesk T6V; no private source is persisted here.
on:
  push:
    branches:
      - chore/t6v-public-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private FantaDesk T6V head
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: 871263a73f363a43393a0c46c8d99c3e87576a45
          token: ${{ secrets.FANTADESK_READ_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "871263a73f363a43393a0c46c8d99c3e87576a45"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (npm Arborist compatibility)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify committed multipart T6 snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE=public/nexus/runtime/nexus-titolarita-runtime-2026-27-v1
          test ! -e "$BASE.json.gz.b64"
          test "$(wc -c < "$BASE.part-000.b64" | tr -d ' ')" = "11481"
          test "$(wc -c < "$BASE.part-001.b64" | tr -d ' ')" = "11481"
          test "$(wc -c < "$BASE.part-002.b64" | tr -d ' ')" = "19999"
          test "$(sha256sum "$BASE.part-000.b64" | awk '{print $1}')" = "55537ebda6e80715a98ac373b62d898aca2c10f6576e1a9f16d64aa772b96bc1"
          test "$(sha256sum "$BASE.part-001.b64" | awk '{print $1}')" = "e028ce43153574fa8e50e25c47a758132bd850687fb9a550e0da926115038ac8"
          test "$(sha256sum "$BASE.part-002.b64" | awk '{print $1}')" = "79ff8d70498470cc026013011752033cfd3147b6c05cf545173a1ef8ac3a1103"
          cat "$BASE.part-000.b64" "$BASE.part-001.b64" "$BASE.part-002.b64" > /tmp/t6-runtime.b64
          test "$(wc -c < /tmp/t6-runtime.b64 | tr -d ' ')" = "42961"
          test "$(sha256sum /tmp/t6-runtime.b64 | awk '{print $1}')" = "ec352a82131258d8d53f17453acbb0beb3a749832dce5ccd58870c461d3c0d7c"
          test "$(head -c 4 /tmp/t6-runtime.b64)" = "H4sI"
          test ! -e tmp/t6v-runtime-prefix-1.txt
          test ! -e tmp/t6v-runtime-prefix-2.txt

      - name: Global typecheck
        run: npm run typecheck

      - name: Global tests
        run: npm run test:run

      - name: T6-owned runtime tests
        run: npx vitest run src/features/nexus/titolarita/titolaritaRuntimeRepository.test.ts

      - name: Production build
        run: npm run build

      - name: Verify production multipart artifact and PWA precache
        shell: bash
        run: |
          set -euo pipefail
          BASE=dist/nexus/runtime/nexus-titolarita-runtime-2026-27-v1
          test ! -e "$BASE.json.gz.b64"
          cat "$BASE.part-000.b64" "$BASE.part-001.b64" "$BASE.part-002.b64" > /tmp/t6-dist-runtime.b64
          test "$(wc -c < /tmp/t6-dist-runtime.b64 | tr -d ' ')" = "42961"
          test "$(sha256sum /tmp/t6-dist-runtime.b64 | awk '{print $1}')" = "ec352a82131258d8d53f17453acbb0beb3a749832dce5ccd58870c461d3c0d7c"
          for part in 000 001 002; do
            grep -R -F "nexus/runtime/nexus-titolarita-runtime-2026-27-v1.part-${part}.b64" dist/sw.js dist/workbox-*.js >/dev/null
          done

      - name: Audit browser/runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'drive\.google\.com|googleapis\.com/drive|Authorization: Bearer|FANTADESK_READ_TOKEN' dist --exclude='*.map'
          test ! -e dist/data/nexus/research-v3/titolarita-mvp/t5/T5_TITOLARITA_OPERATIONAL_SURFACE_V1.json
          du -sh dist
