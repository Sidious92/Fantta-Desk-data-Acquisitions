name: T6V FantaDesk Integration Verification

# Verification harness for private FantaDesk T6V; no private source is persisted here.
on:
  push:
    branches:
      - chore/t6v-public-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private FantaDesk T6V head
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: 00221c69cfce665a773a21c2a8e6c4fe7a697906
          token: ${{ secrets.FANTADESK_READ_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "00221c69cfce665a773a21c2a8e6c4fe7a697906"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (npm Arborist compatibility)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Reconstruct canonical T6 runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          FILE=public/nexus/runtime/nexus-titolarita-runtime-2026-27-v1.json.gz.b64
          P0=data/nexus/research-v3/titolarita-mvp/t6v/_runtime_repair_prefix_0.b64part
          P1=data/nexus/research-v3/titolarita-mvp/t6v/_runtime_repair_prefix_1.b64part
          test "$(wc -c < "$FILE" | tr -d ' ')" = "19999"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = "79ff8d70498470cc026013011752033cfd3147b6c05cf545173a1ef8ac3a1103"
          test "$(wc -c < "$P0" | tr -d ' ')" = "11481"
          test "$(wc -c < "$P1" | tr -d ' ')" = "11481"
          cat "$P0" "$P1" "$FILE" > "$FILE.repaired"
          mv "$FILE.repaired" "$FILE"
          test "$(wc -c < "$FILE" | tr -d ' ')" = "42961"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = "ec352a82131258d8d53f17453acbb0beb3a749832dce5ccd58870c461d3c0d7c"
          test "$(head -c 4 "$FILE")" = "H4sI"

      - name: Global typecheck
        run: npm run typecheck

      - name: Global tests
        run: npm run test:run

      - name: T6-owned runtime tests
        run: npx vitest run src/features/nexus/titolarita/titolaritaRuntimeRepository.test.ts

      - name: Production build
        run: npm run build

      - name: Verify production artifact and PWA precache
        shell: bash
        run: |
          set -euo pipefail
          FILE=dist/nexus/runtime/nexus-titolarita-runtime-2026-27-v1.json.gz.b64
          test -f "$FILE"
          test "$(wc -c < "$FILE" | tr -d ' ')" = "42961"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = "ec352a82131258d8d53f17453acbb0beb3a749832dce5ccd58870c461d3c0d7c"
          grep -R -F 'nexus/runtime/nexus-titolarita-runtime-2026-27-v1.json.gz.b64' dist/sw.js dist/workbox-*.js >/dev/null

      - name: Audit browser/runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'drive\.google\.com|googleapis\.com/drive|Authorization: Bearer|FANTADESK_READ_TOKEN' dist --exclude='*.map'
          test ! -e dist/data/nexus/research-v3/titolarita-mvp/t5/T5_TITOLARITA_OPERATIONAL_SURFACE_V1.json
          du -sh dist

      - name: Commit canonical snapshot back to private T6 branch
        shell: bash
        env:
          FANTADESK_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FANTADESK_TOKEN:-}"
          git config user.name 'FantaNexus CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm data/nexus/research-v3/titolarita-mvp/t6v/_runtime_repair_prefix_0.b64part
          git rm data/nexus/research-v3/titolarita-mvp/t6v/_runtime_repair_prefix_1.b64part
          git add public/nexus/runtime/nexus-titolarita-runtime-2026-27-v1.json.gz.b64
          git commit -m 'fix(titolarita): restore canonical runtime snapshot'
          git remote set-url origin "https://x-access-token:${FANTADESK_TOKEN}@github.com/Sidious92/FantaDesk.git"
          git push origin HEAD:feat/nexus-titolarita-mvp-t6-runtime-integration-v1
