name: T10 FantaDesk Player UI Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/t6v-fantadesk-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact private FantaDesk T10 head
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: 7f8cd1757bd5aae06779f612e1d2230ea0b6c798
          token: ${{ secrets.FANTADESK_READ_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7f8cd1757bd5aae06779f612e1d2230ea0b6c798"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin stable npm
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Global typecheck
        run: npm run typecheck

      - name: Global tests
        run: npm run test:run

      - name: T6 runtime regression tests
        run: npx vitest run src/features/nexus/titolarita/titolaritaRuntimeRepository.test.ts

      - name: T7B challenger runtime tests
        run: npx vitest run src/features/nexus/titolarita/titolaritaNamedRiskChallengerRepository.test.ts

      - name: T8 operational evidence tests
        run: npx vitest run src/features/nexus/titolarita/titolaritaOperationalEvidenceRepository.test.ts

      - name: T9 presentation contract tests
        run: npx vitest run src/features/nexus/titolarita/titolaritaPresentationAdapter.test.ts

      - name: T10 player UI tests
        run: npx vitest run src/features/nexus/titolarita/TitolaritaEvidencePanel.test.tsx

      - name: Production build
        run: npm run build

      - name: Verify canonical source snapshots
        shell: bash
        run: |
          set -euo pipefail
          T7=public/nexus/runtime/nexus-titolarita-named-risk-challenger-2026-27-v1.json.gz.b64
          cat public/nexus/runtime/nexus-titolarita-runtime-2026-27-v1.part-*.b64 > /tmp/t6-runtime.b64
          test "$(wc -c < /tmp/t6-runtime.b64 | tr -d ' ')" = "42961"
          test "$(sha256sum /tmp/t6-runtime.b64 | awk '{print $1}')" = "ec352a82131258d8d53f17453acbb0beb3a749832dce5ccd58870c461d3c0d7c"
          test -f "$T7"
          test "$(wc -c < "$T7" | tr -d ' ')" = "12789"
          test "$(sha256sum "$T7" | awk '{print $1}')" = "a67b81d2cdb0a15c178ccd5295862815ff7e8067434a63e90fcf16af9034fa18"

      - name: Verify production artifacts and PWA precache
        shell: bash
        run: |
          set -euo pipefail
          for NAME in nexus-titolarita-runtime-2026-27-v1.part-000.b64 nexus-titolarita-runtime-2026-27-v1.part-001.b64 nexus-titolarita-runtime-2026-27-v1.part-002.b64 nexus-titolarita-named-risk-challenger-2026-27-v1.json.gz.b64; do
            test -f "dist/nexus/runtime/$NAME"
            grep -R -F "nexus/runtime/$NAME" dist/sw.js dist/workbox-*.js >/dev/null
          done
          cat dist/nexus/runtime/nexus-titolarita-runtime-2026-27-v1.part-*.b64 > /tmp/dist-t6-runtime.b64
          test "$(sha256sum /tmp/dist-t6-runtime.b64 | awk '{print $1}')" = "ec352a82131258d8d53f17453acbb0beb3a749832dce5ccd58870c461d3c0d7c"
          test "$(sha256sum dist/nexus/runtime/nexus-titolarita-named-risk-challenger-2026-27-v1.json.gz.b64 | awk '{print $1}')" = "a67b81d2cdb0a15c178ccd5295862815ff7e8067434a63e90fcf16af9034fa18"

      - name: Audit browser and scientific boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'drive\.google\.com|googleapis\.com/drive|Authorization: Bearer|FANTADESK_READ_TOKEN' dist --exclude='*.map'
          ! grep -R -E '"(pNamed|combinedProbability|combinedPStart|marginalPStart|expectedMinutes)"[[:space:]]*:' public/nexus/runtime/nexus-titolarita-named-risk-challenger-2026-27-v1.json.gz.b64
          test ! -e dist/data/nexus/research-v3/titolarita-mvp/t7
          du -sh dist
