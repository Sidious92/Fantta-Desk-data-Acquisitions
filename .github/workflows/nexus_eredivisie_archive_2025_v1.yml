name: Nexus Eredivisie Archive 2025 v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-eredivisie-archive-2025-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone public archive source
        run: |
          git clone --depth 1 https://github.com/TopMarx/eredivisie.git /tmp/eredivisie
          cd /tmp/eredivisie
          git rev-parse HEAD > /tmp/eredivisie-commit.txt
      - run: sudo mkdir -p /mnt/data/nexus-eredivisie-archive-2025-v1 && sudo chown -R $USER:$USER /mnt/data
      - name: Acquire and validate archive
        env:
          EREDIVISIE_ARCHIVE_SRC: /tmp/eredivisie/data/2025
        run: |
          export EREDIVISIE_ARCHIVE_COMMIT="$(cat /tmp/eredivisie-commit.txt)"
          python scripts/acquire_eredivisie_archive_2025_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-eredivisie-archive-2025-v1
          path: /mnt/data/nexus-eredivisie-archive-2025-v1
          if-no-files-found: warn
      - name: Record compact summary and inventory
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-eredivisie-archive-2025-v1-status
          for f in SUMMARY.json INVENTORY.json; do
            if [ -f "/mnt/data/nexus-eredivisie-archive-2025-v1/$f" ]; then
              cp "/mnt/data/nexus-eredivisie-archive-2025-v1/$f" ".nexus-eredivisie-archive-2025-v1-status/$f"
            fi
          done
          if [ ! -f .nexus-eredivisie-archive-2025-v1-status/SUMMARY.json ]; then
            printf '{"schema":"NEXUS_EREDIVISIE_ARCHIVE_2025_ACQUISITION_V1_SUMMARY","status":"NO_SUMMARY_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-eredivisie-archive-2025-v1-status/SUMMARY.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-eredivisie-archive-2025-v1-status
          git commit -m 'data: record Eredivisie 2025 archive acquisition v1' || exit 0
          git push origin HEAD:main
