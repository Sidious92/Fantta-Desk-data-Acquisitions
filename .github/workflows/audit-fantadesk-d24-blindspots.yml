name: Audit FantaDesk D24 Exact 38 Low Evidence Triage

on:
  push:
    paths:
      - '.github/workflows/audit-fantadesk-d24-blindspots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require existing private read-only checkout credential
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/Fantta-Desk-data-Acquisitions
          path: public
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          ref: audit/data-coverage-source-gates-20261028
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1
      - name: Assert pinned private source commit
        run: test "$(git -C private rev-parse HEAD)" = "446211f4a5e5bc5efda1bfc3b8b04d1965a71a4e"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: D24 immutable triage contract tests
        run: |
          node --check private/scripts/data/d24-blindspot-triage.mjs
          node --check private/scripts/data/d24-real-38-triage-cli.mjs
          node --test private/scripts/data/d24-blindspot-triage.test.mjs
          node --check private/scripts/data/d24-authorized-listone-diff.mjs
          node --test private/scripts/data/d24-authorized-listone-diff.test.mjs
          node --test private/scripts/data/d24-aggregate-evidence.test.mjs
      - name: D24 real private source intersection aggregate-only
        run: |
          node private/scripts/data/d24-real-38-triage-cli.mjs \
            private/data/nexus/current-listone/2026-08-30/active-listone.csv \
            public/data/nexus-d1/final-v3/IDENTITY_MASTER.json \
            private/src/features/auction/secasPlayerAuctionHistory.generated.ts \
            public/data/nexus-d2/final-v1/understat \
            private/data/coverage/D22_PRIVATE_FANTALAB_PER_PLAYER_FIELD_PRESENCE_2026-10-29.json \
            private/data/nexus/runtime-private
