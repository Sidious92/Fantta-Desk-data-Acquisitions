name: Nexus Cross-League Fantasy Open Acquisition v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-crossleague-fantasy-open-v1-launch/EXECUTE'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AUTHORITY_SHA: 9782b1aca4bac80231a3c54a806eac8532471be7
      OUT_ROOT: /mnt/data/nexus-crossleague-fantasy-open-v1

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Checkout fixed private scientific authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false

      - name: Verify governance contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-crossleague-fantasy-open-acquisition-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          test -f scripts/nexus-acquire-crossleague-fantasy-open-v1.py
          test -f scripts/nexus-acquire-crossleague-fantasy-open-v1-1.py
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - name: Install acquisition dependencies
        shell: bash
        run: python -m pip install --no-cache-dir pandas==2.2.3 requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1 html5lib==1.1

      - name: Acquire all public fantasy datasets
        shell: bash
        env:
          NEXUS_CROSSLEAGUE_FANTASY_OUT: ${{ env.OUT_ROOT }}
        run: python scripts/nexus-acquire-crossleague-fantasy-open-v1-1.py

      - name: Validate provider coverage and governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/mnt/data/nexus-crossleague-fantasy-open-v1')
          m=json.load(open(root/'manifest.json'))
          assert m['schema']=='NEXUS_CROSSLEAGUE_FANTASY_OPEN_ACQUISITION_V1'
          assert m['status']=='PASS'
          assert m['governance']['cross_provider_normalization_performed'] is False
          assert m['governance']['missing_values_filled'] is False
          assert m['governance']['predictive_models_modified'] is False
          assert m['normalized']['provider_player_season_rows'] > 1000
          pc=m['normalized']['provider_counts']
          assert pc.get('FPL_ARCHIVE',0) > 1000
          comunio=m['providers']['COMUNIO']
          ok_comps=sum(1 for v in comunio.values() if v.get('profiles_ok',0)>0)
          assert ok_comps >= 3, comunio
          assert len(m['providers']['MPG'].get('nonempty_pools',[])) > 0, m['providers']['MPG']
          assert (root/'field-inventory.json').is_file()
          assert (root/'file-inventory.json').is_file()
          assert (root/'normalized/provider-player-season-index.csv').is_file()
          print('CROSSLEAGUE_FANTASY_VALIDATION=PASS')
          print(json.dumps({'provider_counts':pc,'comunio_comp_seasons_ok':ok_comps,'mpg_pools':len(m['providers']['MPG']['nonempty_pools'])},indent=2))
          PY

      - name: Package immutable acquisition snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT_ROOT/manifest.json" /mnt/data/nexus-crossleague-fantasy-open-v1-manifest.json
          cp "$OUT_ROOT/field-inventory.json" /mnt/data/nexus-crossleague-fantasy-open-v1-field-inventory.json
          cp "$OUT_ROOT/file-inventory.json" /mnt/data/nexus-crossleague-fantasy-open-v1-file-inventory.json
          tar -C /mnt/data --zstd -cf /mnt/data/nexus-crossleague-fantasy-open-v1.tar.zst nexus-crossleague-fantasy-open-v1
          sha256sum /mnt/data/nexus-crossleague-fantasy-open-v1.tar.zst > /mnt/data/nexus-crossleague-fantasy-open-v1.tar.zst.sha256

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-crossleague-fantasy-open-v1
          path: |
            /mnt/data/nexus-crossleague-fantasy-open-v1.tar.zst
            /mnt/data/nexus-crossleague-fantasy-open-v1.tar.zst.sha256
            /mnt/data/nexus-crossleague-fantasy-open-v1-manifest.json
            /mnt/data/nexus-crossleague-fantasy-open-v1-field-inventory.json
            /mnt/data/nexus-crossleague-fantasy-open-v1-file-inventory.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record SUCCESS status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nexus-crossleague-fantasy-open-v1-status
          printf '{"workflow":"Nexus Cross-League Fantasy Open Acquisition v1","run_id":%s,"conclusion":"success","head_sha":"%s","authority_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$AUTHORITY_SHA" > .nexus-crossleague-fantasy-open-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-crossleague-fantasy-open-v1-status/RESULT.json
          git commit -m 'ci: record cross-league fantasy acquisition success' || exit 0
          git push origin HEAD:main

      - name: Record FAILURE status
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nexus-crossleague-fantasy-open-v1-status
          printf '{"workflow":"Nexus Cross-League Fantasy Open Acquisition v1","run_id":%s,"conclusion":"failure","head_sha":"%s","authority_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$AUTHORITY_SHA" > .nexus-crossleague-fantasy-open-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-crossleague-fantasy-open-v1-status/RESULT.json
          git commit -m 'ci: record cross-league fantasy acquisition failure' || exit 0
          git push origin HEAD:main
