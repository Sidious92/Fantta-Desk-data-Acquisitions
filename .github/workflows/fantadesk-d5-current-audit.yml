name: FantaDesk D5 Current 2026/27 Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-d5-current-audit.yml

permissions:
  contents: read
  statuses: write

jobs:
  d5-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FANTADESK_EXPECTED_HEAD: fcb1ff38f88a2ac90d9a06dfd0457e896ecc6208
      NEXUS_D2B_ROSTER_JSON: /tmp/nexus-d5/frozen-roster.json
      NEXUS_D2B_OUTPUT_ROOT: /tmp/nexus-d5/d2
      NEXUS_D2B_ROWS_JSON: /tmp/nexus-d5/d2/D2B_ROWS_V3.json
      NEXUS_D5_OUTPUT_ROOT: /tmp/nexus-d5/d5
    steps:
      - name: Checkout private FantaDesk ephemerally
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: fcb1ff38f88a2ac90d9a06dfd0457e896ecc6208
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FANTADESK_EXPECTED_HEAD"

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Typecheck branch
        id: typecheck
        run: npm run typecheck

      - name: Materialize embedded Nexus runtime
        id: materialize
        run: npm run nexus:runtime:build

      - name: Materialize frozen 523-player Listone
        id: roster
        run: node scripts/nexus-d2b-prepare-frozen-roster-2026-27-v2.mjs

      - name: Run D5 MaxBid unit tests
        id: unit
        run: npx vitest run src/features/nexus/decision/liveMaxBid.test.ts --reporter=verbose

      - name: Re-materialize audited D2 rows
        id: d2
        run: npx vitest run src/features/nexus/decision/d2bCurrentServing2026_27.v3.integration.test.ts --reporter=verbose

      - name: Run D5 representative current-pool audit
        id: d5
        continue-on-error: true
        run: npx vitest run src/features/nexus/decision/d5Current2026_27.integration.test.ts --reporter=verbose

      - name: Publish D5 evidence statuses
        if: always() && steps.d5.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.NEXUS_D5_OUTPUT_ROOT + '/D5_CURRENT_REPRESENTATIVE_AUDIT_V1.json', 'utf8'));
          const statuses = [
            ['d5-source', `pool=${report.poolPlayers} d2=${report.sourceD2RowDigestSha256.slice(0,16)} rules=${report.rulesHash.slice(0,16)}`],
            ['d5-state', `credits=${report.state.remainingCredits} slots=${JSON.stringify(report.state.remainingSlotsByRole)} sold=${report.state.soldPlayers}`],
            ['d5-digest', `representativeDigestSha256=${report.representativeDigestSha256}`],
          ];
          for (const r of report.representatives) {
            statuses.push([`d5-role-${r.role}`, `id=${r.playerId} q=${r.quotation} hard=${r.hardFeasibilityMaxBid} floor=${r.floorScenarioMaxBid} fvm=${r.fvmScenarioMaxBid} robust=${r.operationalMaxBid} ${r.action}`]);
          }
          statuses.push(['d5-boundary', `expectedMarketDist=${report.boundaries.expectedMarketPriceDistributionClaimed} roleMultiplier=${report.boundaries.roleMultiplierUsed} robust=${report.boundaries.operationalMaxIsRobustMinimum}`]);
          for (const [context, description] of statuses) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              body: JSON.stringify({ state: 'success', context, description: description.slice(0, 140) }),
            });
            if (!response.ok) throw new Error(`${context}: HTTP ${response.status} ${await response.text()}`);
          }
          NODE

      - name: Publish step statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const steps = {
            checkout: '${{ steps.checkout.outcome }}', verify: '${{ steps.verify.outcome }}', setup: '${{ steps.setup.outcome }}', install: '${{ steps.install.outcome }}',
            typecheck: '${{ steps.typecheck.outcome }}', materialize: '${{ steps.materialize.outcome }}', roster: '${{ steps.roster.outcome }}',
            unit: '${{ steps.unit.outcome }}', d2: '${{ steps.d2.outcome }}', d5: '${{ steps.d5.outcome }}',
          };
          for (const [name, outcome] of Object.entries(steps)) {
            const state = outcome === 'success' ? 'success' : outcome === 'skipped' ? 'error' : 'failure';
            await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
              body: JSON.stringify({ state, context: `d5-step-${name}`, description: `${name}=${outcome}` }),
            });
          }
          NODE

      - name: Publish D5 gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="D5 current 2026/27 MaxBid audit failed"
          if [ "${{ steps.checkout.outcome }}" = "success" ] \
            && [ "${{ steps.verify.outcome }}" = "success" ] \
            && [ "${{ steps.setup.outcome }}" = "success" ] \
            && [ "${{ steps.install.outcome }}" = "success" ] \
            && [ "${{ steps.typecheck.outcome }}" = "success" ] \
            && [ "${{ steps.materialize.outcome }}" = "success" ] \
            && [ "${{ steps.roster.outcome }}" = "success" ] \
            && [ "${{ steps.unit.outcome }}" = "success" ] \
            && [ "${{ steps.d2.outcome }}" = "success" ] \
            && [ "${{ steps.d5.outcome }}" = "success" ]; then
            state=success
            description="D5 current 2026/27 live MaxBid PASS"
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"d5-gate\",\"description\":\"${description}\"}"

      - name: Enforce fail-closed D5 gate
        if: always() && (steps.checkout.outcome != 'success' || steps.verify.outcome != 'success' || steps.setup.outcome != 'success' || steps.install.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.materialize.outcome != 'success' || steps.roster.outcome != 'success' || steps.unit.outcome != 'success' || steps.d2.outcome != 'success' || steps.d5.outcome != 'success')
        run: exit 1
