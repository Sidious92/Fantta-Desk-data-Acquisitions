name: Nexus Belgian Fantasy Pro League Public v1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-belgian-fantasy-proleague-public-v1-1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1
      - run: python scripts/nexus-acquire-belgian-fantasy-proleague-public-v1.py
      - name: Package
        if: always()
        run: |
          mkdir -p /mnt/data/package-belgian-fantasy-v1-1
          test -d /mnt/data/nexus-belgian-fantasy-proleague-public-v1 && tar -C /mnt/data --zstd -cf /mnt/data/package-belgian-fantasy-v1-1/nexus-belgian-fantasy-proleague-public-v1.tar.zst nexus-belgian-fantasy-proleague-public-v1 || true
          test -f /mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json && cp /mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json /mnt/data/package-belgian-fantasy-v1-1/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-belgian-fantasy-proleague-public-v1-1
          path: /mnt/data/package-belgian-fantasy-v1-1/*
          if-no-files-found: warn
          retention-days: 90
      - name: Record terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:]; p={'workflow':'Nexus Belgian Fantasy Pro League Public v1.1','job_status':status,'run_id':int(run_id)}
          m=Path('/mnt/data/nexus-belgian-fantasy-proleague-public-v1/manifest.json')
          if m.is_file(): p['manifest']=json.load(open(m))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-belgian-fantasy-proleague-public-v1-1-status
          cp "$tmp" .nexus-belgian-fantasy-proleague-public-v1-1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-belgian-fantasy-proleague-public-v1-1-status/RESULT.json
          git commit -m "ci: record Belgian Fantasy Pro League v1.1 ${{ job.status }}" || exit 0
          git push origin HEAD:main
