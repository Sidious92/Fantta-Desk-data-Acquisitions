name: Finalize historical 2024-25 transfer ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-historical-2024-25-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
          git -C fantadesk-private rev-parse HEAD

      - name: Reconcile audited 2024-25 internal Serie A faces
        working-directory: fantadesk-private
        run: python scripts/nexus/reconcile_historical_2024_25_internal_pairs_v2.py

      - name: Require reconciliation PASS
        working-directory: fantadesk-private
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nexus/transfer-events/v1/historical-2024-25-internal-pair-reconciliation-audit-v1.json')
          d=json.loads(p.read_text())
          if d['status'] != 'PASS': raise SystemExit('reconciliation not PASS')
          if any(v['unresolvedInternalCandidateGroups'] for v in d['windows'].values()): raise SystemExit('unresolved candidate groups remain')
          PY

      - name: Materialize canonical unique-event ledger
        working-directory: fantadesk-private
        run: python scripts/nexus/materialize_historical_2024_25_unique_events.py

      - name: Validate canonical accounting
        working-directory: fantadesk-private
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nexus/transfer-events/v1/historical-2024-25-canonical-unique-event-ledger-status-v1.json')
          d=json.loads(p.read_text())
          print(json.dumps(d['totals'],indent=2))
          assert d['status']=='CLOSED'
          assert d['totals']=={'teamSideFaces':625,'internalSerieAPairs':90,'uniqueSemanticEvents':535}
          PY

      - name: Publish canonical outputs to private authority
        working-directory: fantadesk-private
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "fantanexus-public-runner"
          git config user.email "actions@users.noreply.github.com"
          git add data/nexus/transfer-events/v1/historical-2024-25-summer-internal-pair-reconciliation-v1.csv
          git add data/nexus/transfer-events/v1/historical-2024-25-winter-internal-pair-reconciliation-v1.csv
          git add data/nexus/transfer-events/v1/historical-2024-25-internal-pair-reconciliation-audit-v1.json
          git add data/nexus/transfer-events/v1/historical-2024-25-canonical-unique-event-ledger-status-v1.json
          git add data/nexus/transfer-events/v1/historical-2024-25-summer-unique-event-ledger-v1-part-*.csv
          git add data/nexus/transfer-events/v1/historical-2024-25-winter-unique-event-ledger-v1-part-*.csv
          if git diff --cached --quiet; then
            echo "Canonical outputs already published"
          else
            git commit -m "nexus transfer: close canonical 2024-25 ledger"
            git push "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" HEAD:"$FANTADESK_BRANCH"
          fi

      - name: Stage canonical artifact
        if: always()
        run: |
          mkdir -p out
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-summer-internal-pair-reconciliation-v1.csv out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-winter-internal-pair-reconciliation-v1.csv out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-internal-pair-reconciliation-audit-v1.json out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-canonical-unique-event-ledger-status-v1.json out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-summer-unique-event-ledger-v1-part-*.csv out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-winter-unique-event-ledger-v1-part-*.csv out/ || true

      - name: Upload canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-2024-25-canonical-ledger
          path: out
          if-no-files-found: error
          retention-days: 14
