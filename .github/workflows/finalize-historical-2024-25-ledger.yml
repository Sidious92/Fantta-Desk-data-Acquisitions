name: Finalize historical 2024-25 transfer ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-historical-2024-25-ledger.yml'
      - 'scripts/finalize_historical_2024_25_runner.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
          git -C fantadesk-private rev-parse HEAD

      - name: Reconcile audited 2024-25 internal Serie A faces
        working-directory: fantadesk-private
        run: python scripts/nexus/reconcile_historical_2024_25_internal_pairs_v2.py

      - name: Validate reconciliation result
        working-directory: fantadesk-private
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/nexus/transfer-events/v1/historical-2024-25-internal-pair-reconciliation-audit-v1.json')
          d=json.loads(p.read_text())
          print(json.dumps({k:{'faces':v['teamSideFaces'],'pairs':v['pairedInternalSerieAEvents'],'events':v['preCanonicalUniqueSemanticEvents'],'unresolved':len(v['unresolvedInternalCandidateGroups'])} for k,v in d['windows'].items()},indent=2))
          print('status=',d['status'])
          PY

      - name: Stage reconciliation artifact
        if: always()
        run: |
          mkdir -p out
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-summer-internal-pair-reconciliation-v1.csv out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-winter-internal-pair-reconciliation-v1.csv out/ || true
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2024-25-internal-pair-reconciliation-audit-v1.json out/ || true

      - name: Upload reconciliation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-2024-25-reconciliation
          path: out
          if-no-files-found: error
          retention-days: 14
