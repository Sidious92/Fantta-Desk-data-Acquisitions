name: FantaDesk B32 - auditable round seal and owner reviewed match
on:
  push:
    branches: [ci/fantadesk-b32-round-seal-review-20261027]
    paths:
      - .github/workflows/fantadesk-b32-round-review-gate.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  jwt-postgrest:
    name: B32 PG17 001-045 closed matchday and append-only reviewed evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fantadesk_b32_ephemeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fantadesk_b32_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRIVATE_SHA: 'ea723baf59ed89087e56b68b8cd21656a97be9fd'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fantadesk_b32_ephemeral
      B28_POSTGREST_URL: http://127.0.0.1:3000
      B28_JWT_SECRET: 'B28_ci_only_synthetic_signed_jwt_signing_secret_2026'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Exact candidate source
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply actual historical SQL and seed RLS owner fixtures
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-full-chain-bootstrap.sql > /dev/null
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -name '*.sql' | sort)
          test "${#migrations[@]}" -eq 45
          for i in "${!migrations[@]}"; do
            n=$((i+1))
            if [ "$n" -eq 39 ]; then
              psql -v ON_ERROR_STOP=1 -c "create table auth.users(id uuid primary key);"
              psql -v ON_ERROR_STOP=1 -c "insert into auth.users(id) values ('11111111-1111-4111-8111-111111111111'),('22222222-2222-4222-8222-222222222222');"
            fi
            psql -v ON_ERROR_STOP=1 -f "${migrations[$i]}" > /dev/null
            if [ "$n" -eq 29 ]; then
              psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-live-029-object-parity-assert.sql > /dev/null
            fi
            if [ "$n" -eq 38 ]; then
              psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-full-chain-assert.sql > /dev/null
              psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-vote-atomic-assert.sql > /dev/null
            fi
          done
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-identity-revisions-assert.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-scoring-revisions-assert.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-calendar-assert.sql
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-provisional-results-assert.sql
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-dual-lineup-assert.sql
          psql -v ON_ERROR_STOP=1 -f scripts/campionato-b28-postgrest-jwt-bootstrap.sql
      - name: Start actual PostgREST HTTP Data API (isolated, no Supabase credentials)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name b28_postgrest --network host \
            -e PGRST_DB_URI='postgres://authenticator:B28_ephemeral_postgrest_only@127.0.0.1:5432/fantadesk_b32_ephemeral' \
            -e PGRST_DB_SCHEMAS='public' \
            -e PGRST_DB_ANON_ROLE='anon' \
            -e PGRST_JWT_SECRET="$B28_JWT_SECRET" \
            -e PGRST_DB_CHANNEL_ENABLED='false' \
            -e PGRST_LOG_LEVEL='warn' \
            postgrest/postgrest:v16.3
          for i in $(seq 1 50); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/ > /dev/null; then
              echo B28_POSTGREST_HTTP_SERVER_READY
              exit 0
            fi
            sleep 1
          done
          docker logs b28_postgrest --tail 100
          exit 1
      - name: Signed owner A/B JWT tests against real HTTP API before deletion
        working-directory: private-app
        run: node scripts/campionato-b28-postgrest-jwt.test.mjs before-delete
      - name: Verify HTTP RLS and CAS for B30 provisional fixture reports and table rules
        working-directory: private-app
        run: node scripts/campionato-b30-postgrest-provisional.test.mjs before-delete
      - name: B31 signed JWT HTTP owner A/B opponent provenance and RPC isolation
        working-directory: private-app
        run: node scripts/campionato-b31-postgrest-opponent.test.mjs before-delete
      - name: B32 two-sided round seal and reviewed revision audit in real PostgreSQL
        working-directory: private-app
        run: psql -v ON_ERROR_STOP=1 -f scripts/campionato-postgres-match-review-assert.sql
      - name: Verify Auth deletion trigger and foreign-key cascade inside SAME isolated database
        working-directory: private-app
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/b10-postgres-real-schema-delete-assert.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -c "do \$\$ begin if exists(select 1 from public.campionato_identity_revisions where season_id='10101010-1010-4010-8010-101010101010') then raise exception 'A identity revisions survived deletion'; end if; if (select count(*) from public.campionato_identity_revisions)<>2 then raise exception 'B identity revisions not preserved'; end if; if exists(select 1 from public.campionato_scoring_revisions where season_id='10101010-1010-4010-8010-101010101010') then raise exception 'A scoring survived deletion'; end if; if (select count(*) from public.campionato_scoring_revisions)<>2 then raise exception 'B scoring revisions not preserved'; end if; end \$\$;"
      - name: Reuse OLD bearer JWT for deleted A; verify no access and B preserved
        working-directory: private-app
        run: node scripts/campionato-b28-postgrest-jwt.test.mjs after-delete
      - name: Confirm old JWT cannot view deleted A B30 reports; B revision survives
        working-directory: private-app
        run: node scripts/campionato-b30-postgrest-provisional.test.mjs after-delete
      - name: B31 after account delete, no opponent evidence leakage
        working-directory: private-app
        run: node scripts/campionato-b31-postgrest-opponent.test.mjs after-delete
      - name: Confirm no production credentials, no remote hosts, no service role in this run
        shell: bash
        run: |
          set -euo pipefail
          test "$B28_POSTGREST_URL" = 'http://127.0.0.1:3000'
          test -z "${FANTADESK_DATABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          echo B32_PG17_ROUND_SEAL_REVIEW_JWT_PASS
      - name: Docker logs on failure (synthetic fixture only)
        if: failure()
        run: docker logs b28_postgrest --tail 60 || true
  app-regression:
    name: B32 reviewed fixtures, complete Vitest, TypeScript and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRIVATE_SHA: 'ea723baf59ed89087e56b68b8cd21656a97be9fd'
      FANTADESK_PUBLIC_WEB_BUILD: 'true'
      VITE_NEXUS_PRIVATE_DATA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Assert immutable source
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Test Campionato and cloud identity
        working-directory: private-app
        run: npm run test:run -- --maxWorkers=3
      - name: Typecheck
        working-directory: private-app
        run: npm run typecheck
      - name: Public web build
        working-directory: private-app
        run: npm run build
      - name: Public asset leak gate
        working-directory: private-app
        run: node scripts/assert-public-web-dist.mjs

# All DB/auth data here is SYNTHETIC, local to one ephemeral Actions runner.
# Does not use private CI repo, hosted Supabase JWTs, real credentials or production mutations.
