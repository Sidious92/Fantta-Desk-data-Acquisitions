name: CI Copilot C7R Live Runtime

on:
  pull_request:
    paths:
      - 'ci/copilot-c7r/**'
      - '.github/workflows/ci-copilot-c7r-live-runtime.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public runner repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C7R verification harness
        run: node ci/copilot-c7r/live-runtime-check.mjs
