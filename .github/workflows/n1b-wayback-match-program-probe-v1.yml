name: N1B Wayback Match Program probe v1

on:
  push:
    branches:
      - feat/n1b-match-program-full-coverage-v1
    paths:
      - 'scripts/n1b_wayback_match_program_probe_v1.py'
      - '.github/workflows/n1b-wayback-match-program-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/n1b_wayback_match_program_probe_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1b-wayback-match-program-probe-v1
          path: artifacts/n1b-wayback-match-program-probe-v1
          if-no-files-found: error
          retention-days: 14
