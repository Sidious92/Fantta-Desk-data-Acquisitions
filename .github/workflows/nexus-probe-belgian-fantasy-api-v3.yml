name: Nexus Belgian Fantasy API Probe v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-probe-belgian-fantasy-api-v3-launch/EXECUTE'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - run: python scripts/nexus-probe-belgian-fantasy-api-v3.py
      - name: Persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if test -s .nexus-probe-belgian-fantasy-api-v3-status/RESULT.json; then cp .nexus-probe-belgian-fantasy-api-v3-status/RESULT.json "$tmp"; else printf '{"error":"probe produced no result"}\n' > "$tmp"; fi
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-probe-belgian-fantasy-api-v3-status
          cp "$tmp" .nexus-probe-belgian-fantasy-api-v3-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-probe-belgian-fantasy-api-v3-status/RESULT.json
          git commit -m 'ci: record Belgian fantasy API probe v3' || exit 0
          git push origin HEAD:main
