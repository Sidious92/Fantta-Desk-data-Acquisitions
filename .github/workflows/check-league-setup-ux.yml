name: Check League Setup UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-league-setup-ux.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require private token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - name: Checkout FantaDesk UX branch
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: feat/league-setup-ux-pass
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install
        working-directory: app
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: TypeScript and production build
        working-directory: app
        run: |
          npx tsc -b
          npx vite build --base=./
      # UX validation only; no application artifacts are published.
