name: Nexus SLGR v8-v4 Endpoint Diff
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-slgr-v8-diff-v4-launch/EXECUTE'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/summarize_slgr_v8_diff_v4.py
      - name: Commit diff
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-slgr-fantasy-public-probe-v8-status/DIFF_V4.json
          git commit -m 'ci: summarize SLGR v8-v4 endpoint diff' || exit 0
          git push origin HEAD:main
