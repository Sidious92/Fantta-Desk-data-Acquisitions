name: Nexus D1 Historical 2048 Wikidata Demographics v4 Sharded

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-historical-2048-wikidata-v4/EXECUTE'

permissions:
  contents: write
  actions: read

concurrency:
  group: nexus-d1-historical-2048-wikidata-v4
  cancel-in-progress: false

jobs:
  acquire-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - shard: 0
            start: 0
            end: 512
          - shard: 1
            start: 512
            end: 1024
          - shard: 2
            start: 1024
            end: 1536
          - shard: 3
            start: 1536
            end: 2048
    env:
      ROOT: .nexus-d1-historical-2048-wikidata-v4/shard-${{ matrix.shard }}
      OUT: .nexus-d1-historical-2048-wikidata-v4/shard-${{ matrix.shard }}/output
      RECONSTRUCTED: .nexus-d1-historical-2048-wikidata-v4/shard-${{ matrix.shard }}/subjects.json.xz.b64
      STATUS_DIR: .nexus-d1-historical-2048-wikidata-v4-status
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct immutable v3 authority transport
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python - <<'PY'
          import base64,hashlib,json,lzma,os
          from pathlib import Path
          m=json.loads(Path('data/nexus-d1/historical-resolved-person-subjects-v3-manifest.json').read_text())
          encoded=''.join(Path(c['path']).read_text().strip() for c in m['payload']['chunks'])
          xz=base64.b64decode(encoded,validate=True); raw=lzma.decompress(xz); d=json.loads(raw)
          assert len(encoded)==57516
          assert len(xz)==43136 and hashlib.sha256(xz).hexdigest()==m['payload']['xzSha256']
          assert len(raw)==508959 and hashlib.sha256(raw).hexdigest()==m['payload']['decodedJsonSha256']
          assert len(d['subjects'])==2048
          Path(os.environ['RECONSTRUCTED']).write_text(encoded+'\n')
          PY

      - name: Acquire shard
        id: acquire
        shell: bash
        timeout-minutes: 24
        run: |
          set -uo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"
          set +e
          python scripts/nexus-d1-acquire-historical-wikidata-demographics-v2-shard.py \
            --subjects-b64 "$RECONSTRUCTED" \
            --manifest data/nexus-d1/historical-resolved-person-subjects-v3-manifest.json \
            --output "$OUT" \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            >"$OUT/ACQUIRE.stdout.log" 2>"$OUT/ACQUIRE.stderr.log"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Persist shard status before gate
        if: always() && steps.acquire.outcome == 'success'
        env:
          SHARD: ${{ matrix.shard }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          RC: ${{ steps.acquire.outputs.rc }}
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR"
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path(os.environ['OUT']); rc=int(os.environ.get('RC') or 999)
          doc={'schema':'NEXUS_D1_HISTORICAL_V4_SHARD_STATUS_V1','capturedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'shard':int(os.environ['SHARD']),'range':[int(os.environ['START']),int(os.environ['END'])],'exitCode':rc}
          if (out/'RESULT.json').exists():
            r=json.loads((out/'RESULT.json').read_text()); doc['status']=r['status']; doc['summary']=r['summary']; doc['resultCanonicalPresent']=True
          elif (out/'TECHNICAL_FAILURE.json').exists():
            f=json.loads((out/'TECHNICAL_FAILURE.json').read_text()); doc['status']='TECHNICAL_FAILURE_NOT_SCIENTIFIC_MISSINGNESS'; doc['failure']={'errorType':f.get('errorType'),'detail':f.get('detail'),'lastProgress':f.get('lastProgress')}; doc['resultCanonicalPresent']=False
          else:
            doc['status']='TECHNICAL_FAILURE_NO_DIAGNOSTIC'; doc['resultCanonicalPresent']=False
          Path(os.environ['STATUS_DIR'],f"shard-{os.environ['SHARD']}.json").write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_DIR/shard-${{ matrix.shard }}.json"
          if ! git diff --cached --quiet; then
            git commit -m 'nexus: persist D1 historical v4 shard ${{ matrix.shard }} status [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-d1-historical-v4-shard-${{ matrix.shard }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on shard technical failure
        if: steps.acquire.outputs.rc != '0'
        run: |
          echo 'Shard ${{ matrix.shard }} failed technically; status was persisted before stop.' >&2
          exit 1

  combine:
    needs: acquire-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMBINED: .nexus-d1-historical-2048-wikidata-v4-combined
      STATUS_DIR: .nexus-d1-historical-2048-wikidata-v4-status
      RELEASE_TAG: nexus-d1-historical-2048-wikidata-v4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-d1-historical-v4-shard-*
          path: .nexus-d1-historical-v4-downloads
      - name: Combine and validate four shard results
        run: |
          set -euo pipefail
          rm -rf "$COMBINED"; mkdir -p "$COMBINED"
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          roots=sorted(Path('.nexus-d1-historical-v4-downloads').glob('nexus-d1-historical-v4-shard-*'))
          if len(roots)!=4: raise SystemExit(f'expected 4 shard artifacts, got {len(roots)}')
          shard_results=[]
          for root in roots:
            rp=root/'RESULT.json'
            if not rp.exists(): raise SystemExit(f'missing RESULT.json in {root}')
            shard_results.append(json.loads(rp.read_text()))
          ranges=sorted((r['shard']['start'],r['shard']['end']) for r in shard_results)
          if ranges!=[(0,512),(512,1024),(1024,1536),(1536,2048)]: raise SystemExit(f'bad shard ranges {ranges}')
          records=[x for r in sorted(shard_results,key=lambda x:x['shard']['start']) for x in r['records']]
          if len(records)!=2048 or len({r['subjectId'] for r in records})!=2048: raise SystemExit('combined subject cardinality/uniqueness failure')
          mc={};dc={};fail=[]
          for sr in shard_results:
            for k,v in sr['summary']['mappingStatus'].items(): mc[k]=mc.get(k,0)+v
            for k,v in sr['summary']['dobStatus'].items(): dc[k]=dc.get(k,0)+v
            fail.extend(sr.get('requestFailures') or [])
          status='PASS' if not fail and all(r['status']=='PASS' for r in shard_results) else 'REVIEW_REQUIRED'
          out={'schema':'NEXUS_D1_HISTORICAL_RESOLVED_PERSON_WIKIDATA_RESULT_V4','protocolVersion':'1.1','status':status,'declaredUse':'HISTORICAL_POPULATION_COVERAGE_CURRENT_RETRIEVAL_ONLY','capturedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'subjectSurface':{'count':2048,'decodedJsonSha256':'d472fe00c88e70b77adc8a38093360042a632559a9ac52366f8da3b37aec5660','sourceArtifactId':9162967092},'rules':{'fuzzyMatchingUsed':False,'dobUsedForIdentitySelection':False,'computedAgeDerived':False,'currentRetrievalImpliesHistoricalAsOf':False,'trainingPromotionGranted':False,'requestFailureCanBecomeMissingIdentity':False,'shardedExecution':True},'summary':{'subjects':2048,'mappingStatus':mc,'dobStatus':dc,'requestFailures':len(fail)},'requestFailures':fail,'records':records}
          root=Path('.nexus-d1-historical-2048-wikidata-v4-combined'); root.mkdir(parents=True,exist_ok=True)
          (root/'RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          files=[]
          for d in roots:
            for name in ('RESULT.json','MANIFEST.json','PROGRESS.json','ACQUIRE.stdout.log','ACQUIRE.stderr.log'):
              p=d/name
              if p.exists():
                b=p.read_bytes(); files.append({'source':str(p),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          digest=hashlib.sha256('\n'.join(f"{x['source']}\t{x['size']}\t{x['sha256']}" for x in files).encode()).hexdigest()
          manifest={'schema':'NEXUS_D1_HISTORICAL_WIKIDATA_COMBINED_MANIFEST_V4','generatedAt':out['capturedAt'],'status':status,'shardEvidence':files,'canonicalShardEvidenceSha256':digest,'combinedSubjects':2048}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(out['summary'],indent=2))
          PY
      - name: Persist combined outcome
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR"
          cp "$COMBINED/RESULT.json" "$STATUS_DIR/RESULT.json"
          cp "$COMBINED/MANIFEST.json" "$STATUS_DIR/MANIFEST.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_DIR/RESULT.json" "$STATUS_DIR/MANIFEST.json"
          if ! git diff --cached --quiet; then
            git commit -m 'nexus: persist D1 historical 2048 Wikidata v4 combined outcome [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Freeze combined evidence in immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "Release already exists" >&2; exit 1; fi
          tar -czf nexus-d1-historical-2048-wikidata-v4.tar.gz .nexus-d1-historical-v4-downloads "$COMBINED"
          sha256sum nexus-d1-historical-2048-wikidata-v4.tar.gz > nexus-d1-historical-2048-wikidata-v4.tar.gz.sha256
          trap 'gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true' ERR
          gh release create "$RELEASE_TAG" --draft --target "$(git rev-parse HEAD)" --title 'FantaNexus D1 Historical 2048 Wikidata Demographics v4' --notes 'Four sequential fail-closed shards over the byte-verified D0-derived historical identity surface. No fuzzy mapping, age derivation, historical-as-of claim or training promotion.'
          gh release upload "$RELEASE_TAG" nexus-d1-historical-2048-wikidata-v4.tar.gz nexus-d1-historical-2048-wikidata-v4.tar.gz.sha256 "$COMBINED/RESULT.json" "$COMBINED/MANIFEST.json"
          trap - ERR
