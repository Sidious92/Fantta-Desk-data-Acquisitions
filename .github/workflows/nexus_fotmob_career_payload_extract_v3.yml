name: Nexus FotMob Career Payload Extract v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-fotmob-career-payload-extract-v3-launch/EXECUTE'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/extract_fotmob_career_payload_v3.py
      - name: Commit focused extract
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-fotmob-nextdata-career-v3-status/CAREER_EXTRACT.json
          git commit -m 'ci: extract focused FotMob career payload v3' || exit 0
          git push origin HEAD:main
