name: FantaDesk D2B Current Serving Audit V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fantadesk-d2b-current-serving-audit-v3.yml

permissions:
  contents: read
  statuses: write

jobs:
  d2b-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FANTADESK_EXPECTED_HEAD: 8687a1db8fa89f67a1094b1836cace9ba79f75b7
      NEXUS_D2B_ROSTER_JSON: /tmp/d2b-v3/frozen-roster.json
      NEXUS_D2B_OUTPUT_ROOT: /tmp/d2b-v3/output
    steps:
      - name: Checkout private FantaDesk ephemerally
        id: checkout
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: 8687a1db8fa89f67a1094b1836cace9ba79f75b7
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FANTADESK_EXPECTED_HEAD"
          echo "Verified FantaDesk commit $(git rev-parse HEAD)"

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Typecheck branch
        id: typecheck
        run: npm run typecheck

      - name: Materialize embedded Nexus runtime from frozen authorities
        id: materialize
        run: npm run nexus:runtime:build

      - name: Materialize frozen current 523-player roster
        id: roster
        run: node scripts/nexus-d2b-prepare-frozen-roster-2026-27-v2.mjs

      - name: Run D1C current serving parser tests
        id: d1c
        run: npx vitest run src/features/nexus/decision/d1cCurrentServing.test.ts --reporter=verbose

      - name: Run artifact-independent D2B V3 audit
        id: audit
        continue-on-error: true
        run: npx vitest run src/features/nexus/decision/d2bCurrentServing2026_27.v3.integration.test.ts --reporter=verbose

      - name: Print D2B V3 report
        if: always()
        run: |
          if [ -f "$NEXUS_D2B_OUTPUT_ROOT/D2B_AUDIT_V3.json" ]; then
            cat "$NEXUS_D2B_OUTPUT_ROOT/D2B_AUDIT_V3.json"
          fi

      - name: Publish per-step status contexts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_VERIFY: ${{ steps.verify.outcome }}
          STEP_SETUP: ${{ steps.setup.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_TYPECHECK: ${{ steps.typecheck.outcome }}
          STEP_MATERIALIZE: ${{ steps.materialize.outcome }}
          STEP_ROSTER: ${{ steps.roster.outcome }}
          STEP_D1C: ${{ steps.d1c.outcome }}
          STEP_AUDIT: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local context="$1" outcome="$2" state
            case "$outcome" in
              success) state=success ;;
              failure) state=failure ;;
              cancelled|skipped) state=error ;;
              *) state=error ;;
            esac
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"${state}\",\"context\":\"d2b-v3-step-${context}\",\"description\":\"${outcome}\"}"
          }
          publish checkout "$STEP_CHECKOUT"
          publish verify "$STEP_VERIFY"
          publish setup "$STEP_SETUP"
          publish install "$STEP_INSTALL"
          publish typecheck "$STEP_TYPECHECK"
          publish materialize "$STEP_MATERIALIZE"
          publish roster "$STEP_ROSTER"
          publish d1c "$STEP_D1C"
          publish audit "$STEP_AUDIT"

      - name: Publish compact D2B V3 evidence statuses
        if: always() && steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.NEXUS_D2B_OUTPUT_ROOT + '/D2B_AUDIT_V3.json', 'utf8'));
          const role = report.roster.roles;
          const c = report.runtimeAuthority.coverage;
          const statusRows = [
            ['d2b-v3-roster', `players=${report.roster.players} P=${role.P} D=${role.D} C=${role.C} A=${role.A} clubs=${report.roster.clubs}`],
            ['d2b-v3-runtime', `hist=${c.fantacalcioHistoryPlayers} l1fc=${c.lag1FantacalcioPlayers} l2fc=${c.lag2FantacalcioPlayers} us25=${c.understat2025MappedRows} l1m=${c.lag1MinutesPlayers} l2m=${c.lag2MinutesPlayers} l1x=${c.lag1MetricPlayers}`],
            ['d2b-v3-support', `opp=${JSON.stringify(report.d2.opportunitySupport)} pv=${JSON.stringify(report.d2.voteAppearanceSupport)}`],
            ['d2b-v3-digest', `rowDigestSha256=${report.d2.rowDigestSha256}`],
          ];
          for (const roleName of ['P', 'D', 'C', 'A']) {
            const d = report.d2.byRole[roleName].modeledCoreFantasyPoints;
            const fmt = (v) => Number(v).toFixed(3);
            statusRows.push([`d2b-v3-utility-${roleName}`, `n=${d.n} min=${fmt(d.min)} p50=${fmt(d.p50)} p95=${fmt(d.p95)} max=${fmt(d.max)}`]);
          }
          for (const [context, description] of statusRows) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ state: 'success', context, description: description.slice(0, 140) }),
            });
            if (!response.ok) throw new Error(`${context}: HTTP ${response.status} ${await response.text()}`);
          }
          NODE

      - name: Publish D2B V3 gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="D2B current serving V3 failed"
          if [ "${{ steps.checkout.outcome }}" = "success" ] \
            && [ "${{ steps.verify.outcome }}" = "success" ] \
            && [ "${{ steps.setup.outcome }}" = "success" ] \
            && [ "${{ steps.install.outcome }}" = "success" ] \
            && [ "${{ steps.typecheck.outcome }}" = "success" ] \
            && [ "${{ steps.materialize.outcome }}" = "success" ] \
            && [ "${{ steps.roster.outcome }}" = "success" ] \
            && [ "${{ steps.d1c.outcome }}" = "success" ] \
            && [ "${{ steps.audit.outcome }}" = "success" ]; then
            state=success
            description="D2B current serving V3 PASS"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"d2b-v3-gate\",\"description\":\"${description}\"}"

      - name: Enforce fail-closed D2B gate
        if: always() && (steps.checkout.outcome != 'success' || steps.verify.outcome != 'success' || steps.setup.outcome != 'success' || steps.install.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.materialize.outcome != 'success' || steps.roster.outcome != 'success' || steps.d1c.outcome != 'success' || steps.audit.outcome != 'success')
        run: exit 1
