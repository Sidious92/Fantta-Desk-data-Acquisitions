name: Export full membership replay mirror v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-membership-replay-mirror-full-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode current frozen membership replay mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-membership-full
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          src=Path('data/nexus/membership-replay/v1/membership-replay-mirror-v1.csv.xz.b64')
          xz=base64.b64decode(src.read_text().strip())
          raw=lzma.decompress(xz)
          rows=len(raw.decode().splitlines())-1
          assert rows == 367, rows
          out=Path('/tmp/nexus-membership-full/membership-replay-full-v1.csv')
          out.write_bytes(raw)
          print('rows', rows)
          print('xz_sha256', hashlib.sha256(xz).hexdigest())
          print('raw_sha256', hashlib.sha256(raw).hexdigest())
          PY
      - name: Upload full mirror
        uses: actions/upload-artifact@v4
        with:
          name: nexus-membership-replay-full-v1
          path: /tmp/nexus-membership-full/membership-replay-full-v1.csv
          retention-days: 14
