name: Nexus F5A xA Share Same-Commit Shots v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nexus-f5a-xa-share-shots-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-xa-share-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Acquire same-commit player and shot surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, io, json, pathlib, subprocess
          from datetime import datetime, timezone

          out=pathlib.Path('artifact')
          out.mkdir(parents=True,exist_ok=True)
          repo=pathlib.Path('/tmp/douglas-understat')
          subprocess.run(['git','clone','--filter=blob:none','--no-checkout','https://github.com/douglasbc/scraping-understat-dataset.git',str(repo)],check=True)
          terminal='0e474a6197b9707d92b21db9bb47e5ab1b6bb876'
          leagues=['serie_a','epl','bundesliga','la_liga','ligue_1','rfpl']
          seasons=['14-15','15-16','16-17','17-18','18-19','19-20','20-21']

          def show(commit,path):
              return subprocess.check_output(['git','-C',str(repo),'show',f'{commit}:{path}'])
          def ciso(commit):
              return subprocess.check_output(['git','-C',str(repo),'show','-s','--format=%cI',commit],text=True).strip()
          def bsha(commit,path):
              return subprocess.check_output(['git','-C',str(repo),'rev-parse',f'{commit}:{path}'],text=True).strip()
          def parse_iso(s):
              return datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(timezone.utc)
          def h(raw): return hashlib.sha256(raw).hexdigest()

          manifest={
              'schema':'NEXUS_F5A_XA_SHARE_SAME_COMMIT_SHOTS_V1',
              'sourceRepository':'douglasbc/scraping-understat-dataset',
              'terminalReferenceCommit':terminal,
              'selectionUsesPredictiveValues':False,
              'selectionUsesFantasyOutcomes':False,
              'fuzzyIdentityUsed':False,
              'leagueSeasons':[]
          }

          for league in leagues:
              for season in seasons:
                  ppath=f'datasets/{league}/players_{league}_{season}.csv'
                  spath=f'datasets/{league}/shots_{league}_{season}.csv'
                  terminal_shots=show(terminal,spath).decode('utf-8-sig')
                  dates=[]
                  for r in csv.DictReader(io.StringIO(terminal_shots)):
                      d=(r.get('date') or '').strip()
                      if d: dates.append(datetime.fromisoformat(d).replace(tzinfo=timezone.utc))
                  if not dates: raise SystemExit(f'NO_COMPLETION_DATE:{league}:{season}')
                  season_end=max(dates)

                  log=subprocess.check_output(['git','-C',str(repo),'log','--all','--reverse','--format=%H|%cI','--',ppath],text=True).splitlines()
                  selected=None
                  for line in log:
                      sha,iso=line.split('|',1)
                      if parse_iso(iso) <= season_end: continue
                      try:
                          praw=show(sha,ppath)
                          sraw=show(sha,spath)
                      except subprocess.CalledProcessError:
                          continue
                      pr=csv.DictReader(io.StringIO(praw.decode('utf-8-sig')))
                      sr=csv.DictReader(io.StringIO(sraw.decode('utf-8-sig')))
                      pf=set(pr.fieldnames or [])
                      sf=set(sr.fieldnames or [])
                      if not {'id','player_name','time','xA','team_title'} <= pf: continue
                      if not {'xG','player_assisted','h_a','h_team','a_team','date'} <= sf: continue
                      selected=(sha,iso,praw,sraw)
                      break
                  if selected is None: raise SystemExit(f'NO_SAME_COMMIT_SURFACE:{league}:{season}')
                  sha,iso,praw,sraw=selected
                  target=out/league/season
                  target.mkdir(parents=True,exist_ok=True)
                  (target/'players.csv').write_bytes(praw)
                  (target/'shots.csv').write_bytes(sraw)
                  prows=list(csv.DictReader(io.StringIO(praw.decode('utf-8-sig'))))
                  srows=list(csv.DictReader(io.StringIO(sraw.decode('utf-8-sig'))))
                  ids=[str(r['id']).strip() for r in prows]
                  if len(ids)!=len(set(ids)): raise SystemExit(f'DUPLICATE_PLAYER_ID:{league}:{season}')
                  manifest['leagueSeasons'].append({
                      'league':league,'season':season,
                      'seasonCompletionEvidenceUtc':season_end.isoformat(),
                      'selectedCommit':sha,'selectedCommitTimestamp':iso,
                      'playerPath':ppath,'playerGitBlobSha':bsha(sha,ppath),'playerSha256':h(praw),'playerRows':len(prows),
                      'shotPath':spath,'shotGitBlobSha':bsha(sha,spath),'shotSha256':h(sraw),'shotRows':len(srows)
                  })

          manifest['leagueSeasons']=sorted(manifest['leagueSeasons'],key=lambda x:(x['league'],x['season']))
          mb=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          (out/'MANIFEST.json').write_bytes(mb)
          sums=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name!='SHA256SUMS.txt'):
              sums.append(f"{h(p.read_bytes())}  {p.relative_to(out).as_posix()}")
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          print(json.dumps({'leagueSeasons':len(manifest['leagueSeasons']),'manifestSha256':h(mb)},indent=2))
          PY

      - name: Upload xA share reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-f5a-xa-share-same-commit-shots-v1
          path: artifact/
          if-no-files-found: error
          retention-days: 30
