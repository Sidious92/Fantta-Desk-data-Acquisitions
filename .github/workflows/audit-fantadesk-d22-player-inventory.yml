name: Audit FantaDesk D22 Real 523 Player Field Inventory

on:
  push:
    paths:
      - '.github/workflows/audit-fantadesk-d22-player-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require existing read-only private checkout credential
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/Fantta-Desk-data-Acquisitions
          path: public
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          ref: 68e03188a4957bf83406679ad457aee6a55389b9
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1
      - name: Pin private D22 audit SHA
        run: test "$(git -C private rev-parse HEAD)" = "68e03188a4957bf83406679ad457aee6a55389b9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: D22 contract unit tests (synthetic)
        run: |
          node --check private/scripts/data/d22-player-inventory-core.mjs
          node --check private/scripts/data/d22-player-inventory-cli.mjs
          node --test private/scripts/data/d22-player-inventory-core.test.mjs
      - name: D22 real per-player coverage — print aggregate only
        run: |
          node private/scripts/data/d22-player-inventory-cli.mjs \
            private/data/nexus/current-listone/2026-08-30/active-listone.csv \
            public/data/nexus-d1/final-v3/IDENTITY_MASTER.json \
            private/src/features/auction/secasPlayerAuctionHistory.generated.ts \
            public/data/nexus-d2/final-v1/understat \
            --fantalab-evidence private/data/coverage/D22_PRIVATE_FANTALAB_PER_PLAYER_FIELD_PRESENCE_2026-10-29.json
