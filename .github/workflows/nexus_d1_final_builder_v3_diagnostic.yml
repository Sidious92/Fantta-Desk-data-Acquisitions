name: Nexus D1 Final Builder v3 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-final-builder-v3-diagnostic/EXECUTE'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run v3 builder and persist result
        shell: bash
        run: |
          set +e
          rm -rf data/nexus-d1/final-v3
          python scripts/nexus-d1-build-final-identity-master-v3.py >/tmp/stdout 2>/tmp/stderr
          rc=$?
          set -e
          RC="$rc" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          out=Path('data/nexus-d1/final-builder-v3-diagnostic');out.mkdir(parents=True,exist_ok=True);rc=int(os.environ['RC'])
          d={'schema':'NEXUS_D1_FINAL_BUILDER_V3_DIAGNOSTIC','capturedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'status':'PASS' if rc==0 else 'FAIL','builderExitCode':rc,'stdout':Path('/tmp/stdout').read_text(errors='replace'),'stderr':Path('/tmp/stderr').read_text(errors='replace'),'governance':{'diagnosticOnly':True,'rawMutation':False,'f1Started':False,'d2Started':False}}
          (out/'DIAGNOSTIC.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nexus-d1/final-builder-v3-diagnostic/DIAGNOSTIC.json
          git commit -m 'nexus: persist D1 final builder v3 diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
