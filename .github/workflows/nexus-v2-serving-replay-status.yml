name: Nexus v2 Serving Replay Status

on:
  workflow_run:
    workflows: ['Nexus v2 Serving Replay 2025']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Record replay status
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .nexus-v2-serving-replay-status
          printf '{"run_id":%s,"conclusion":"%s","head_sha":"%s"}\n' "$RUN_ID" "$CONCLUSION" "$HEAD_SHA" > .nexus-v2-serving-replay-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-v2-serving-replay-status/RESULT.json
          git diff --cached --quiet && exit 0
          git commit -m 'ci: record Nexus v2 serving replay status'
          git push
