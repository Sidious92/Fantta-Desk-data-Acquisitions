name: Nexus v2 Live GOALS Top50 Export Status

on:
  workflow_run:
    workflows: ["Nexus v2 Live GOALS Top50 Export"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Record status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .nexus-v2-top50-goals-status
          cat > .nexus-v2-top50-goals-status/RESULT.json <<EOF
          {"workflow":"Nexus v2 Live GOALS Top50 Export","run_id":${{ github.event.workflow_run.id }},"conclusion":"${{ github.event.workflow_run.conclusion }}","head_sha":"${{ github.event.workflow_run.head_sha }}","updated_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-v2-top50-goals-status/RESULT.json
          git commit -m "ci: record GOALS top50 export status" || exit 0
          git push
