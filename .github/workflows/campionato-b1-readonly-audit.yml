# QA gate 2026-10-22: includes least-privilege import staging regression.
name: FantaDesk Campionato B1 Read-only Audit
on:
  push:
    branches: [test/campionato-b1-audit-20261022]
    paths:
      - '.github/workflows/campionato-b1-readonly-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-tests-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Preflight repository authorization
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo 'FANTADESK_READ_TOKEN is missing or unavailable to this workflow.'
            exit 1
          fi
          echo 'Private repository token is present; checkout will test its scope.'
      - name: Checkout private feature branch read-only
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: feat/campionato-b2b3-identity-stage-lineups-20261022
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct dependencies without executing postinstall scripts
        working-directory: app
        run: |
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: TypeScript compile gate
        working-directory: app
        run: npx tsc -b --pretty false
      - name: Campionato contracts and UI regressions; auction stability
        working-directory: app
        run: npx vitest run src/features/campionato/ src/features/auction/secasHistoricalMarket.test.ts src/features/auction/auctionSession.remoteAuthority.test.ts
      - name: Nexus runtime and Vite production build (no deploy)
        working-directory: app
        run: |
          npm run nexus:runtime:build
          npx vite build --base=./

      - name: PostgreSQL migration 030-032, atomic staging and RLS cross-user gate (ephemeral)
        working-directory: app
        env:
          PGPASSWORD: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          for source in \
            scripts/campionato-postgres-smoke-setup.sql \
            supabase/migrations/20261022183000_030_campionato_season_core.sql \
            supabase/migrations/20261022210500_031_campionato_italia_vote_staging.sql \
            supabase/migrations/20261022220000_032_campionato_atomic_vote_stage.sql \
            scripts/campionato-postgres-smoke-assert.sql \
            scripts/campionato-postgres-vote-atomic-assert.sql; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$source"
          done
