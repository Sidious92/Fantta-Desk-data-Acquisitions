name: Check Auction League Context

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-auction-league-context.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require private token
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - name: Checkout FantaDesk data-driven budget branch
        uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: fix/data-driven-strategy-budget-v1
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install
        working-directory: app
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Tests
        working-directory: app
        run: >-
          npx vitest run
          src/features/auction/auctionLeagueContext.test.ts
          src/features/auction/secasHistoricalMarket.test.ts
          src/features/auction/auctionSession.test.ts
          src/features/auction/leagueContextAdvisorLite.test.ts
          src/features/auction/nexusPriceBandPolicy.test.ts
          src/features/auction/secasEmpiricalPriceAuthority.test.ts
          src/features/auction/secasPlayerAuctionHistory.test.ts
          src/features/auction/myTeamBudgetModel.test.ts
          src/features/auction/slotSuggestionDelta.test.ts
          src/features/auction/strategyMarketBudgetAuthority.test.ts
      - name: TypeScript and production build
        working-directory: app
        run: |
          npx tsc -b
          npx vite build --base=./
      # validation target: data-driven strategy budget authority after slot-count fix
