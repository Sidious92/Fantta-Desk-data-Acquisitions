name: Audit FantaDesk D21 Real Reep Identity Overlap

on:
  push:
    paths:
      - '.github/workflows/audit-fantadesk-reep-d21-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require read-only private checkout credential
        env:
          FANTADESK_READ_TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: test -n "$FANTADESK_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/Fantta-Desk-data-Acquisitions
          path: public
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          ref: 92c8eb7b177bb670e5a879f633f6c5e70ed83786
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1
      - name: Assert immutable private candidate SHA
        run: test "$(git -C private rev-parse HEAD)" = "92c8eb7b177bb670e5a879f633f6c5e70ed83786"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: D21 checksum-verified bulk registry overlap, no persistence
        run: |
          node --check private/scripts/data/d21-reep-real-audit.mjs
          node private/scripts/data/d21-reep-real-audit.mjs \
            private/data/nexus/current-listone/2026-08-30/active-listone.csv \
            public/data/nexus-d1/final-v3/IDENTITY_MASTER.json
