name: Nexus FotMob Crossleague DeepStats v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-fotmob-crossleague-deepstats-v1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo mkdir -p /mnt/data/nexus-fotmob-crossleague-deepstats-v1 && sudo chown -R $USER:$USER /mnt/data
      - run: timeout 17m python scripts/acquire_fotmob_crossleague_deepstats_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-fotmob-crossleague-deepstats-v1
          path: /mnt/data/nexus-fotmob-crossleague-deepstats-v1
          if-no-files-found: warn
      - name: Record compact outputs
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-fotmob-crossleague-deepstats-v1-status
          for f in SUMMARY.json NORMALIZED.json COVERAGE.json; do
            if [ -f "/mnt/data/nexus-fotmob-crossleague-deepstats-v1/$f" ]; then
              cp "/mnt/data/nexus-fotmob-crossleague-deepstats-v1/$f" ".nexus-fotmob-crossleague-deepstats-v1-status/$f"
            fi
          done
          if [ ! -f .nexus-fotmob-crossleague-deepstats-v1-status/SUMMARY.json ]; then
            printf '{"schema":"NEXUS_FOTMOB_CROSSLEAGUE_DEEPSTATS_V1_SUMMARY","status":"NO_SUMMARY_FILE","run_id":%s}\n' "$GITHUB_RUN_ID" > .nexus-fotmob-crossleague-deepstats-v1-status/SUMMARY.json
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-fotmob-crossleague-deepstats-v1-status
          git commit -m 'data: record FotMob crossleague deep-stats v1' || exit 0
          git push origin HEAD:main
