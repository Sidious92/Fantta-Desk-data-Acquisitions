name: CI Copilot C6 Evidence Resolver

on:
  pull_request:
    paths:
      - 'ci/copilot-c6/**'
      - '.github/workflows/ci-copilot-c6-evidence-resolver.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public runner repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C6 verification harness
        run: node ci/copilot-c6/evidence-resolver-check.mjs
