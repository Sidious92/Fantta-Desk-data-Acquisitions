name: Nexus Biwenger Serie A Cross-League History v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-biwenger-seriea-crossleague-history-v1-launch/EXECUTE'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AUTHORITY_SHA: 3035bd40499a3ba33b20ae36549426f29144a948
      OUT_ROOT: /mnt/data/nexus-biwenger-seriea-crossleague-history-v1
    steps:
      - name: Checkout runner
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Checkout fixed scientific authority
        uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-biwenger-seriea-crossleague-history-v1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - name: Acquire provider-native cross-league history
        env:
          NEXUS_BIWENGER_SERIEA_HISTORY_OUT: ${{ env.OUT_ROOT }}
        run: python scripts/nexus-acquire-biwenger-seriea-crossleague-history-v1.py
      - name: Validate
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          root=Path('/mnt/data/nexus-biwenger-seriea-crossleague-history-v1')
          m=json.load(open(root/'manifest.json'))
          c=m['coverage']
          checks={
            'manifest_pass':m.get('status')=='PASS',
            'catalog_gt_500':m['entry_catalog']['players']>500,
            'metadata_rate_ge_95pct':c['metadata_success_rate']>=0.95,
            'season_refs_nonempty':c['season_refs_in_window']>500,
            'history_nonempty':c['historical_requests_ok']>500,
            'zero_competition_mismatch':c['competition_mismatches']==0,
            'no_model_mutation':m['governance']['predictive_models_modified'] is False,
            'no_normalization':m['governance']['cross_provider_normalization_performed'] is False,
          }
          result={'schema':'NEXUS_BIWENGER_SERIEA_CROSSLEAGUE_HISTORY_V1_VALIDATION','status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'coverage':c}
          Path('/mnt/data/nexus-biwenger-seriea-crossleague-history-v1-validation.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          sys.exit(0 if result['status']=='PASS' else 1)
          PY
      - name: Package snapshot and diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p /mnt/data/package-biwenger-seriea-history-v1
          test -d "$OUT_ROOT" && tar -C /mnt/data --zstd -cf /mnt/data/package-biwenger-seriea-history-v1/nexus-biwenger-seriea-crossleague-history-v1.tar.zst nexus-biwenger-seriea-crossleague-history-v1 || true
          test -f /mnt/data/nexus-biwenger-seriea-crossleague-history-v1-validation.json && cp /mnt/data/nexus-biwenger-seriea-crossleague-history-v1-validation.json /mnt/data/package-biwenger-seriea-history-v1/ || true
          test -f "$OUT_ROOT/manifest.json" && cp "$OUT_ROOT/manifest.json" /mnt/data/package-biwenger-seriea-history-v1/ || true
          if test -f /mnt/data/package-biwenger-seriea-history-v1/nexus-biwenger-seriea-crossleague-history-v1.tar.zst; then
            sha256sum /mnt/data/package-biwenger-seriea-history-v1/nexus-biwenger-seriea-crossleague-history-v1.tar.zst > /mnt/data/package-biwenger-seriea-history-v1/nexus-biwenger-seriea-crossleague-history-v1.tar.zst.sha256
          fi
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-biwenger-seriea-crossleague-history-v1
          path: /mnt/data/package-biwenger-seriea-history-v1/*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Record terminal status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$AUTHORITY_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          out,conclusion,run_id,head_sha,authority_sha=sys.argv[1:]
          root=Path('/mnt/data/nexus-biwenger-seriea-crossleague-history-v1')
          validation=Path('/mnt/data/nexus-biwenger-seriea-crossleague-history-v1-validation.json')
          p={'workflow':'Nexus Biwenger Serie A Cross-League History v1','run_id':int(run_id),'conclusion':conclusion,'head_sha':head_sha,'authority_sha':authority_sha}
          if (root/'manifest.json').is_file():
            m=json.load(open(root/'manifest.json')); p['manifest_status']=m.get('status'); p['coverage']=m.get('coverage')
          if validation.is_file(): p['validation']=json.load(open(validation))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-biwenger-seriea-crossleague-history-v1-status
          cp "$tmp" .nexus-biwenger-seriea-crossleague-history-v1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-biwenger-seriea-crossleague-history-v1-status/RESULT.json
          git commit -m "ci: record Biwenger Serie A history ${{ job.status }}" || exit 0
          git push origin HEAD:main
