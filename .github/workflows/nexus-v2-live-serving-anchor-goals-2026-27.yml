          -----END CERTIFICATE-----
          CERT
          openssl cms -encrypt -binary -aes256 \
            -in /mnt/data/nexus_v2_live_player_sanity_anchor_goals_2026_27.json \
            -outform DER -out encrypted-review/player-sanity.p7m \
            /tmp/nexus-goals-review-cert.pem
          rm -f /mnt/data/nexus_v2_live_player_sanity_anchor_goals_2026_27.json
          test -s encrypted-review/player-sanity.p7m

      - name: Upload sanitized live serving audit
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-live-serving-anchor-goals-2026-27-audit
          path: sanitized-output/audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted player review only
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-live-player-sanity-anchor-goals-2026-27-encrypted
          path: encrypted-review/player-sanity.p7m
          if-no-files-found: error
          retention-days: 1
