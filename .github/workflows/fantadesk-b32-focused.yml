name: FantaDesk B32 - focused round seal and review
on:
  push:
    branches: [ci/fantadesk-b32-round-seal-review-20261027]
    paths: [.github/workflows/fantadesk-b32-focused.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  unit-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_SHA: '228f3d161bc89569df323490ab0ca7d675ceeedd'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: private-app
          persist-credentials: false
      - name: Verify exact code
        working-directory: private-app
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: private-app/package-lock.json
      - name: Install
        working-directory: private-app
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: B32 owner-reviewed revisions + previous dual fixture regressions
        working-directory: private-app
        run: npm run test:run -- src/features/campionato/MatchReviewControl.test.tsx src/features/campionato/matchReviewRepository.test.ts src/features/campionato/dualFixtureReconciliation.test.ts src/features/campionato/opponentLineupRepository.test.ts src/features/campionato/CampionatoPage.test.tsx --maxWorkers=2
      - name: Strict TypeScript
        working-directory: private-app
        run: npm run typecheck
