name: Nexus F1 Understat Pinned Source v2

on:
  workflow_dispatch:
  push:
    branches:
      - feat/nexus-input-v1-1-f1-understat-snapshot
    paths:
      - 'scripts/nexus-f1-acquire-understat-pinned-source-v2.py'
      - '.github/workflows/nexus-f1-understat-club-stint-v1.yml'
      - '.nexus-f1-understat-snapshot-trigger'

permissions:
  contents: write

concurrency:
  group: nexus-f1-understat-pinned-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated F1 acquisition branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static syntax check
        id: syntax
        run: python -m py_compile scripts/nexus-f1-acquire-understat-pinned-source-v2.py

      - name: Acquire pinned F0-approved Understat source
        id: acquire
        env:
          NEXUS_F1_UNDERSTAT_PINNED_OUTPUT: .nexus-f1-understat-pinned-v2
        run: python scripts/nexus-f1-acquire-understat-pinned-source-v2.py

      - name: Require grain and RAW integrity PASS
        id: audit
        run: |
          python - <<'PY'
          import json
          a=json.load(open('.nexus-f1-understat-pinned-v2/audit.json',encoding='utf-8'))
          assert a['status']=='PASS_WITH_EXPLICIT_STINT_QUARANTINE', a
          assert a['coverage']['seasons']==11, a['coverage']
          assert a['coverage']['records']==a['integrity']['technicalKeys'], a['integrity']
          assert a['integrity']['duplicates']==0, a['integrity']
          assert a['grain']['sourceAlreadyClubSplit'] is False, a['grain']
          assert a['grain']['sourceClubLabelMayAggregateMultipleClubs'] is True, a['grain']
          assert a['grain']['sourceMultiClubAggregateRows']>0, a['grain']
          assert a['grain']['numericAllocationPerformed'] is False, a['grain']
          assert a['grain']['multiClubNumericSplitAttempted'] is False, a['grain']
          assert a['temporal']['currentCaptureUsedAsHistoricalAvailableAt'] is False, a['temporal']
          assert a['temporal']['expectedMetricsReplayAdmissible'] is False, a['temporal']
          print(json.dumps({
            'status':a['status'],
            'records':a['coverage']['records'],
            'singleClubRecords':a['grain']['singleClubRecordsWithDeterministicStintOrdinal1'],
            'multiClubAggregateRows':a['grain']['sourceMultiClubAggregateRows'],
            'stintUnresolvedRecords':a['grain']['stintUnresolvedRecords'],
            'sourceSha256':a['source']['sha256'],
            'outputSha256':a['integrity']['outputSha256']
          },indent=2))
          PY

      - name: Build deterministic preservation bundle
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - .nexus-f1-understat-pinned-v2 | gzip -n > nexus-f1-understat-pinned-v2.tar.gz
          BUNDLE_SHA=$(sha256sum nexus-f1-understat-pinned-v2.tar.gz | awk '{print $1}')
          AUDIT_SHA=$(sha256sum .nexus-f1-understat-pinned-v2/audit.json | awk '{print $1}')
          OUTPUT_SHA=$(awk '{print $1}' .nexus-f1-understat-pinned-v2/OUTPUT.sha256)
          mkdir -p bundle-parts
          split -b 40m -d -a 3 nexus-f1-understat-pinned-v2.tar.gz bundle-parts/part-
          BUNDLE_SHA="$BUNDLE_SHA" python - <<'PY'
          import hashlib,json,os,pathlib
          parts=[]
          for p in sorted(pathlib.Path('bundle-parts').iterdir()):
              b=p.read_bytes();parts.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          pathlib.Path('BUNDLE_PARTS.json').write_text(json.dumps({'schema':'NEXUS_F1_UNDERSTAT_PINNED_V2_BUNDLE_PARTS','status':'PASS','bundleSha256':os.environ['BUNDLE_SHA'],'parts':parts},indent=2)+'\n',encoding='utf-8')
          PY
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"
          echo "audit_sha=$AUDIT_SHA" >> "$GITHUB_OUTPUT"
          echo "output_sha=$OUTPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Persist immutable content-addressed snapshot
        id: persist
        env:
          BUNDLE_SHA: ${{ steps.meta.outputs.bundle_sha }}
          AUDIT_SHA: ${{ steps.meta.outputs.audit_sha }}
          OUTPUT_SHA: ${{ steps.meta.outputs.output_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="data/nexus-f1/understat-pinned-v2/$BUNDLE_SHA"
          mkdir -p "$DEST/parts"
          cp bundle-parts/* "$DEST/parts/"
          cp BUNDLE_PARTS.json "$DEST/BUNDLE_PARTS.json"
          cp .nexus-f1-understat-pinned-v2/audit.json "$DEST/audit.json"
          cp .nexus-f1-understat-pinned-v2/OUTPUT.sha256 "$DEST/OUTPUT.sha256"
          python - <<'PY'
          import json,os,pathlib
          dest=pathlib.Path('data/nexus-f1/understat-pinned-v2')/os.environ['BUNDLE_SHA']
          receipt={
            'schema':'NEXUS_F1_UNDERSTAT_PINNED_V2_PRESERVATION_RECEIPT',
            'protocolVersion':'1.1',
            'status':'PERSISTED_PENDING_REMOTE_READBACK',
            'sourceCommit':os.environ['GITHUB_SHA'],
            'githubRunId':int(os.environ['GITHUB_RUN_ID']),
            'bundleSha256':os.environ['BUNDLE_SHA'],
            'auditSha256':os.environ['AUDIT_SHA'],
            'normalizedOutputSha256':os.environ['OUTPUT_SHA'],
            'coverage':'2014/15-2024/25',
            'supersedesBundleSha256':'7f0c299fbec1e9e952bae98f35262bfa911d337fa0b4192a01d7938bec8410e5',
            'supersessionReason':'V1 source grain assumption was invalid; V2 explicitly quarantines comma-separated multi-club aggregate labels.',
            'remoteReadbackSha256Pass':False,
            'immutablePath':str(dest),
            'nextRequiredAction':'JOIN_WITH_PRIVATE_D0_2025_26_F1_SOURCE_FALLBACK',
            'governance':{'f1Closed':False,'f2PlusAuthorized':False,'trainingPromotionGranted':False,'canonicalMutation':False}
          }
          (dest/'PRESERVATION_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m "nexus f1: persist corrected Understat pinned v2 $BUNDLE_SHA [skip ci]"
          git push origin HEAD:feat/nexus-input-v1-1-f1-understat-snapshot

      - name: Verify remote Git read-back
        id: readback
        env:
          BUNDLE_SHA: ${{ steps.meta.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feat/nexus-input-v1-1-f1-understat-snapshot'
          DEST="data/nexus-f1/understat-pinned-v2/$BUNDLE_SHA"
          git fetch origin "$BRANCH"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from datetime import datetime,timezone
          dest=f"data/nexus-f1/understat-pinned-v2/{os.environ['BUNDLE_SHA']}"
          m=json.load(open(f'{dest}/BUNDLE_PARTS.json',encoding='utf-8'))
          for p in m['parts']:
              b=subprocess.check_output(['git','show',f"origin/feat/nexus-input-v1-1-f1-understat-snapshot:{dest}/parts/{p['name']}"])
              if hashlib.sha256(b).hexdigest()!=p['sha256']:
                  raise SystemExit(f"remote part hash mismatch {p['name']}")
          rpath=pathlib.Path(dest)/'PRESERVATION_RECEIPT.json'
          r=json.loads(rpath.read_text(encoding='utf-8'))
          r['status']='PASS_DURABLY_PRESERVED_REMOTE_GIT_READBACK_SHA256'
          r['remoteReadbackSha256Pass']=True
          r['verifiedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          rpath.write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8')
          PY
          git add "$DEST/PRESERVATION_RECEIPT.json"
          git commit -m "nexus f1: verify corrected Understat pinned v2 readback $BUNDLE_SHA [skip ci]"
          git push origin HEAD:"$BRANCH"

      - name: Record supersession of V1 artifact
        if: ${{ steps.readback.outcome == 'success' }}
        env:
          BUNDLE_SHA: ${{ steps.meta.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/nexus-f1/superseded
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('data/nexus-f1/superseded/understat-pinned-v1-7f0c299f.json')
          p.write_text(json.dumps({
            'schema':'NEXUS_F1_SUPERSESSION_RECEIPT_V1',
            'protocolVersion':'1.1',
            'status':'SUPERSEDED_DO_NOT_USE_FOR_F1_CLOSURE',
            'supersededBundleSha256':'7f0c299fbec1e9e952bae98f35262bfa911d337fa0b4192a01d7938bec8410e5',
            'replacementBundleSha256':os.environ['BUNDLE_SHA'],
            'reason':'V1 inferred club-split grain from row multiplicity. Actual pinned source contains comma-separated multi-club aggregate labels; V2 detects and quarantines them without numeric allocation.',
            'canonicalMutation':False
          },indent=2)+'\n',encoding='utf-8')
          PY
          git add data/nexus-f1/superseded/understat-pinned-v1-7f0c299f.json
          git commit -m "nexus f1: supersede invalid Understat pinned v1 grain claim [skip ci]"
          git push origin HEAD:feat/nexus-input-v1-1-f1-understat-snapshot

      - name: Persist run outcome receipt
        if: always()
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          BUNDLE_OUTCOME: ${{ steps.meta.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          READBACK_OUTCOME: ${{ steps.readback.outcome }}
          BUNDLE_SHA: ${{ steps.meta.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/nexus-f1/run-status/understat-pinned-v2
          python - <<'PY'
          import json,os,pathlib
          from datetime import datetime,timezone
          stages={k:os.getenv(v,'not-run') for k,v in {
            'syntax':'SYNTAX_OUTCOME','acquire':'ACQUIRE_OUTCOME','audit':'AUDIT_OUTCOME','bundle':'BUNDLE_OUTCOME','persist':'PERSIST_OUTCOME','readback':'READBACK_OUTCOME'}.items()}
          success=all(v=='success' for v in stages.values())
          receipt={
            'schema':'NEXUS_F1_UNDERSTAT_PINNED_V2_RUN_RECEIPT',
            'protocolVersion':'1.1',
            'status':'PASS_HISTORICAL_2014_2024_WITH_EXPLICIT_STINT_QUARANTINE' if success else 'FAIL_CLOSED',
            'generatedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'sourceCommit':os.environ['GITHUB_SHA'],
            'githubRunId':int(os.environ['GITHUB_RUN_ID']),
            'githubRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'stages':stages,
            'bundleSha256':os.getenv('BUNDLE_SHA') or None,
            'coverage':'2014/15-2024/25',
            'nextRequiredAction':'JOIN_WITH_PRIVATE_D0_2025_26_F1_SOURCE_FALLBACK',
            'governance':{'f1Closed':False,'f2PlusAuthorized':False,'trainingPromotionGranted':False,'canonicalMutation':False}
          }
          pathlib.Path('data/nexus-f1/run-status/understat-pinned-v2/latest.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nexus-f1/run-status/understat-pinned-v2/latest.json
          git commit -m "nexus f1: record corrected Understat pinned v2 outcome [skip ci]" || true
          git push origin HEAD:feat/nexus-input-v1-1-f1-understat-snapshot || true

      - name: Upload transient audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-f1-understat-pinned-v2
          path: |
            BUNDLE_PARTS.json
            .nexus-f1-understat-pinned-v2/audit.json
            .nexus-f1-understat-pinned-v2/OUTPUT.sha256
            .nexus-f1-understat-pinned-v2/normalized/multi-club-quarantine-v2.json
            data/nexus-f1/run-status/understat-pinned-v2/latest.json
          if-no-files-found: warn
          retention-days: 7
