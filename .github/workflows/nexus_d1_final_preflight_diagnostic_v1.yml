name: Nexus D1 Final Preflight Diagnostic v1
on:
  push:
    branches: [main]
    paths: ['.nexus-d1-final-preflight-diagnostic-v1/EXECUTE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Diagnose
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/d1diag
          python - <<'PY' >/tmp/d1diag/source-preflight.out 2>/tmp/d1diag/source-preflight.err
          import json
          from pathlib import Path
          paths=[
            '.nexus-d1-current-505-wikidata-v2-1-status/RESULT.json',
            '.nexus-d1-historical-2048-wikidata-v4-1-status/RESULT.json',
            '.nexus-d1-historical-445-observation-demographics-v1-status/RESULT.json',
            '.nexus-d1-secondary-raw-preservation-v2-status/RESULT.json',
          ]
          for p in paths:
            d=json.loads(Path(p).read_text()); assert d['status']=='PASS',(p,d.get('status'))
          print('SOURCE_PREFLIGHT_PASS')
          PY
          src_rc=$?
          : >/tmp/d1diag/releases.out
          : >/tmp/d1diag/releases.err
          rel_rc=0
          for tag in nexus-d1-current-505-wikidata-v2-1 nexus-d1-historical-2048-wikidata-v4-1 nexus-d1-historical-445-observation-demographics-v1 nexus-d1-secondary-raw-preservation-v2; do
            if gh release view "$tag" >>/tmp/d1diag/releases.out 2>>/tmp/d1diag/releases.err; then echo "PASS $tag" >>/tmp/d1diag/releases.out; else echo "FAIL $tag" >>/tmp/d1diag/releases.err; rel_rc=1; fi
          done
          rm -rf data/nexus-d1/final-v1
          python scripts/nexus-d1-build-final-identity-master-v1.py >/tmp/d1diag/builder.out 2>/tmp/d1diag/builder.err
          build_rc=$?
          SRC_RC=$src_rc REL_RC=$rel_rc BUILD_RC=$build_rc python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          def txt(p):
            q=Path(p);return q.read_text(errors='replace')[-20000:] if q.exists() else ''
          src=int(os.environ['SRC_RC']);rel=int(os.environ['REL_RC']);build=int(os.environ['BUILD_RC'])
          d={'schema':'NEXUS_D1_FINAL_PREFLIGHT_DIAGNOSTIC_V1','capturedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'status':'PASS' if src==0 and rel==0 and build==0 else 'FAIL','sourcePreflightExitCode':src,'releasePreflightExitCode':rel,'builderExitCode':build,'sourceStdout':txt('/tmp/d1diag/source-preflight.out'),'sourceStderr':txt('/tmp/d1diag/source-preflight.err'),'releaseStdout':txt('/tmp/d1diag/releases.out'),'releaseStderr':txt('/tmp/d1diag/releases.err'),'builderStdout':txt('/tmp/d1diag/builder.out'),'builderStderr':txt('/tmp/d1diag/builder.err'),'governance':{'diagnosticOnly':True,'rawMutation':False,'trainingPromotionGranted':False,'f1Started':False,'d2Started':False}}
          Path('data/nexus-d1/final-preflight-diagnostic-v1').mkdir(parents=True,exist_ok=True)
          Path('data/nexus-d1/final-preflight-diagnostic-v1/DIAGNOSTIC.json').write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps({'status':d['status'],'sourceRC':src,'releaseRC':rel,'builderRC':build},indent=2))
          PY
          exit 0
      - name: Persist diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nexus-d1/final-preflight-diagnostic-v1/DIAGNOSTIC.json
          git commit -m 'nexus: persist D1 final preflight diagnostic v1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
