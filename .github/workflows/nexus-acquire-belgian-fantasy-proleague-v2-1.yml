name: Nexus Belgian Fantasy Pro League v2.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-belgian-fantasy-proleague-v2-1-launch/EXECUTE'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUTHORITY_SHA: dcf490a1c51b9a5bd938f7cb5359a7514cbf6a92
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: Sidious92/FantaDesk
          ref: ${{ env.AUTHORITY_SHA }}
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          path: fantadesk-private
          persist-credentials: false
      - name: Verify governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fantadesk-private rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -f fantadesk-private/data/nexus/research-v3/crossleague-fantasy/nexus-belgian-fantasy-proleague-acquisition-v2-1-protocol.json
          test -f fantadesk-private/data/nexus/research-v2/final/nexus-v2-predictive-engine-freeze-v1.json
          sudo mkdir -p /mnt/data && sudo chown "$USER":"$USER" /mnt/data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - run: python -m pip install --no-cache-dir requests==2.32.5
      - run: python scripts/nexus-acquire-belgian-fantasy-proleague-v2-1.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          m=json.load(open('/mnt/data/nexus-belgian-fantasy-proleague-v2-1/manifest.json'));ps=m['sources']['players_stats'];pd=m['sources']['player_details'];ex=m['sources']['excel_optional_diagnostic'];fdr=m['sources']['fdr_json']
          checks={'manifest_pass':m.get('status')=='PASS','players_gt_100':ps.get('unique_players',0)>100,'detail_rate':pd.get('success_rate',0)>=0.90,'fdr_public_json':fdr.get('valid_json') is True,'excel_bypass_not_attempted':m['governance']['excel_access_bypass_attempted'] is False,'opaque_ids':m['governance']['opaque_string_player_ids_preserved'] is True,'no_auth':m['governance']['authenticated_surface_accessed'] is False,'no_model_mutation':m['governance']['predictive_models_modified'] is False}
          r={'schema':'NEXUS_BELGIAN_FANTASY_PROLEAGUE_V2_1_VALIDATION','status':'PASS' if all(checks.values()) else 'FAIL','checks':checks,'players_stats':ps,'player_details':pd,'excel_status':ex.get('status'),'fdr':fdr};Path('/mnt/data/nexus-belgian-fantasy-proleague-v2-1-validation.json').write_text(json.dumps(r,indent=2)+'\n');print(json.dumps(r,indent=2));sys.exit(0 if r['status']=='PASS' else 1)
          PY
      - name: Package
        if: always()
        shell: bash
        run: |
          mkdir -p /mnt/data/package-belgian-v2-1
          test -d /mnt/data/nexus-belgian-fantasy-proleague-v2-1 && tar -C /mnt/data --zstd -cf /mnt/data/package-belgian-v2-1/nexus-belgian-fantasy-proleague-v2-1.tar.zst nexus-belgian-fantasy-proleague-v2-1 || true
          test -f /mnt/data/nexus-belgian-fantasy-proleague-v2-1/manifest.json && cp /mnt/data/nexus-belgian-fantasy-proleague-v2-1/manifest.json /mnt/data/package-belgian-v2-1/ || true
          test -f /mnt/data/nexus-belgian-fantasy-proleague-v2-1-validation.json && cp /mnt/data/nexus-belgian-fantasy-proleague-v2-1-validation.json /mnt/data/package-belgian-v2-1/ || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-belgian-fantasy-proleague-v2-1
          path: /mnt/data/package-belgian-v2-1/*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Record terminal status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          python - "$tmp" '${{ job.status }}' "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          out,status,run_id=sys.argv[1:];p={'workflow':'Nexus Belgian Fantasy Pro League v2.1','job_status':status,'run_id':int(run_id)}
          for key,path in [('manifest','/mnt/data/nexus-belgian-fantasy-proleague-v2-1/manifest.json'),('validation','/mnt/data/nexus-belgian-fantasy-proleague-v2-1-validation.json')]:
              q=Path(path)
              if q.is_file():p[key]=json.load(open(q))
          Path(out).write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .nexus-belgian-fantasy-proleague-v2-1-status
          cp "$tmp" .nexus-belgian-fantasy-proleague-v2-1-status/RESULT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nexus-belgian-fantasy-proleague-v2-1-status/RESULT.json
          git commit -m "ci: record Belgian Fantasy Pro League v2.1 ${{ job.status }}" || exit 0
          git push origin HEAD:main
