name: N1B Match Program full coverage v1

on:
  push:
    branches:
      - feat/n1b-match-program-full-coverage-v1
    paths:
      - 'scripts/n1b_match_program_full_coverage_v1.py'
      - '.github/workflows/n1b-match-program-full-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Run N1B full coverage audit
        run: python scripts/n1b_match_program_full_coverage_v1.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1b-match-program-full-coverage-v1
          path: artifacts/n1b-match-program-full-coverage-v1
          if-no-files-found: error
          retention-days: 14
