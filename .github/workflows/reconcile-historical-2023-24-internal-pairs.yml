name: Reconcile historical 2023-24 internal pairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-historical-2023-24-internal-pairs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTADESK_REPO: Sidious92/FantaDesk
      FANTADESK_BRANCH: feat/nexus-five-season-transfer-ledgers-v1
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4
      - name: Clone private scientific authority
        env:
          TOKEN: ${{ secrets.FANTADESK_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          git clone --quiet --branch "$FANTADESK_BRANCH" --single-branch \
            "https://x-access-token:${TOKEN}@github.com/${FANTADESK_REPO}.git" fantadesk-private
          git -C fantadesk-private rev-parse HEAD
      - name: Reconcile reviewed internal Serie A pairs
        working-directory: fantadesk-private
        run: python scripts/nexus/reconcile_historical_2023_24_internal_pairs.py
      - name: Stage reconciliation audit
        run: |
          set -euo pipefail
          mkdir -p out
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2023-24-summer-internal-pair-reconciliation-v1.csv out/
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2023-24-winter-internal-pair-reconciliation-v1.csv out/
          cp fantadesk-private/data/nexus/transfer-events/v1/historical-2023-24-internal-pair-reconciliation-audit-v1.json out/
      - name: Upload reconciliation audit
        uses: actions/upload-artifact@v4
        with:
          name: historical-2023-24-reviewed-pair-reconciliation
          path: out
          if-no-files-found: error
          retention-days: 14
