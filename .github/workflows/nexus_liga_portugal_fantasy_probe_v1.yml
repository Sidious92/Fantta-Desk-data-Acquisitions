name: Nexus Liga Portugal Fantasy Public Probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.nexus-launch-liga-portugal-fantasy-probe-v1'
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo mkdir -p /mnt/data/nexus-liga-portugal-fantasy-probe-v1 && sudo chown -R $USER:$USER /mnt/data
      - run: python scripts/probe_liga_portugal_fantasy_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-liga-portugal-fantasy-probe-v1
          path: /mnt/data/nexus-liga-portugal-fantasy-probe-v1
      - name: Record result
        shell: bash
        run: |
          mkdir -p .nexus-liga-portugal-fantasy-probe-v1-status
          cp /mnt/data/nexus-liga-portugal-fantasy-probe-v1/RESULT.json .nexus-liga-portugal-fantasy-probe-v1-status/RESULT.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .nexus-liga-portugal-fantasy-probe-v1-status/RESULT.json
          git commit -m 'ci: record Liga Portugal fantasy public probe' || true
          git pull --rebase origin main
          git push origin HEAD:main
