name: D30 5-credit StrikerAPI Serie A 2026-27 xG season bulk audit
on:
  push:
    paths:
      - '.github/workflows/d30-striker-bulk-xg-five-credit.yml'
permissions:
  contents: read
concurrency:
  group: d30-striker-bulk-one-shot
  cancel-in-progress: false
jobs:
  one-shot-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require existing keys without printing
        env:
          GIT_READ: ${{ secrets.FANTADESK_READ_TOKEN }}
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: |
          test -n "$GIT_READ"
          test -n "$STRIKERAPI_API_KEY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sidious92/FantaDesk
          token: ${{ secrets.FANTADESK_READ_TOKEN }}
          ref: 03804a0e106b27b76ed3152269919a55fa2d3589
          path: private
          persist-credentials: false
      - name: Pin exact source
        run: test "$(git -C private rev-parse HEAD)" = "03804a0e106b27b76ed3152269919a55fa2d3589"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Check syntax
        run: node --check private/scripts/data/d30-striker-bulk-leaders-five-credit-qa.mjs
      - name: Single call, five free credits maximum
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
          D30_ALLOW_5_CREDITS: '1'
        run: node private/scripts/data/d30-striker-bulk-leaders-five-credit-qa.mjs
