name: Nexus D1 Second Pass Routing Audit v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.nexus-d1-second-pass-routing-audit-v1/EXECUTE'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build routing audit
        run: python scripts/nexus-d1-second-pass-routing-audit-v1.py | tee /tmp/audit.log
      - name: Persist routing authority
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nexus-d1/second-pass-routing-audit-v1
          git commit -m 'nexus: persist D1 second-pass routing audit v1 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
